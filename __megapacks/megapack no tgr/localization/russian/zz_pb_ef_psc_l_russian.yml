# pb+ef: hand-authored strings for the E&F + PSC compatch.
#
# Everything here needs human wording, so it is NOT regenerated by
# tools/regen_ef_psc_copies.py -- that script only does the mechanical
# building_ef_private_construction -> building_construction_sector rename and
# it deliberately skips these keys.
#
# concept_*_desc            : our own concepts, E&F has no text for them.
# speculative_share_*_tt_2  : reworded for the compatch's cap check. E&F asks
#                             "is there room for one more sector"; the effect
#                             builds 5/10/15/20 at once, so pb+ef checks
#                             pcs_construction_sector_headroom_by_base_rate
#                             instead (zz_pb_ef_remap_pcs_values.txt).
#
# NOTE: the level readout must call ScriptValue('building_ef_private_construction_lvl').
# That is E&F's key name, remapped by the compatch to sum building_construction_sector.
# An earlier build used 'building_construction_sector_lvl' in the Russian file --
# no such script_value exists, so the number rendered empty.

l_russian:
  concept_building_urban_center_lvl_by_base_rate_desc:1 "Максимальный уровень [GetBuildingType('building_construction_sector').GetName] определяется количеством [GetBuildingType('building_urban_center').GetName] в стране и значением [concept_base_rate_percentage]. При [concept_base_rate_percentage] 1% (или ниже) максимальный уровень равен суммарному уровню [GetBuildingType('building_urban_center').GetName]. При [concept_base_rate_percentage] 10% максимальный уровень [GetBuildingType('building_construction_sector').GetName] равен 1."
  concept_maximum_pcs_capacity_desc:0 "[concept_maximum_pcs_capacity]: теоретический максимальный уровень [GetBuildingType('building_construction_sector').GetName], который способна поддерживать национальная экономика. Этот предел определяется суммарным уровнем городских центров по стране с поправкой на фактор (1 – базовая ставка).\n\n Низкая базовая ставка повышает эффективность строительной системы и позволяет работать большему числу [GetBuildingType('building_construction_sector').GetName], тогда как высокая базовая ставка снижает эту ёмкость.\n\n Если фактическое число строй. секторов превышает этот порог, избыточные сектора будут стагнировать или закрываться из‑за недостатка кредита и финансирования строительства."
  speculative_share_9_button_tt_2: "Суммарный уровень [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 5#! от стимула ниже теоретического предела #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_10_button_tt_2: "Суммарный уровень [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 10#! от стимула ниже теоретического предела #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_11_button_tt_2: "Суммарный уровень [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 15#! от стимула ниже теоретического предела #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_12_button_tt_2: "Суммарный уровень [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 20#! от стимула ниже теоретического предела #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"

# The Overbuilt Economy counter is held at 0 by the compatch, so this is the only
# status_speculative_share_2_* tier the player will ever see. Re-word it rather
# than leave E&F's "Dormant Sector" text, which would read as a live diagnosis.
 status_speculative_share_2_1:0 "\n Строительство: #green Перестроенная экономика: отключена компачем#! — PSC уже списывает с казны и инвестпула стоимость каждого строительного товара, поэтому второй штраф E&F за то же самое выключен."
