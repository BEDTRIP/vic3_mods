 zz_pb_ef_fso_v_dyn_zero:0 "на цели"
 zz_pb_ef_fso_overcap_desc:0 "#b [GetBuildingType('building_construction_sector').GetName]#! — строительные мощности страны: они производят стройку для всех строек, государственных и частных.\n\n#b Лимит#! — сколько секторов может загрузить экономика: суммарный уровень [GetBuildingType('building_urban_center').GetName] × (1 − 5 × [concept_base_rate_percentage]). При ставке 1% это 95% городских центров, при 6% — 70%, при 12% — 40%. Соотношение к лимиту — секторы / лимит: выше 100% мощностей больше, чем экономика может использовать.\n\n#b Штраф#! — −1% выработки каждого сектора стройки за пункт: модификатор страны «Избыточные строительные мощности», виден в подсказке выработки сектора. Каждый месяц штраф сдвигается к целевому: на 2 пункта, пока до него больше 10, дальше на 1.\n\n#b Целевой штраф#! — урезание, при котором все секторы вместе производят столько же, сколько произвёл бы лимит: 1 − лимит / секторы. Пока секторов не больше лимита, целевой штраф 0, и штраф так же постепенно уходит.\n\n#b Пример.#! 59 секторов при лимите 34: соотношение 174%, целевой штраф 1 − 34 / 59 = 42%. Штраф растёт по 2 пункта в месяц до 32, дальше по 1 и через 26 месяцев останавливается на 42%: секторы работают на 58% и вместе дают столько же, сколько 34 сектора без штрафа.\n\n#b Частные секторы#! — частные инвесторы строят секторы только до лимита, государство может и сверх него. Кнопка запрета останавливает частную постройку секторов совсем; отменить решение можно не раньше чем через 6 месяцев. Снизить избыток: понизить ставку (лимит вырастет), дождаться роста городских центров или запретить частные секторы.\n\n#b Стимул#! — четыре кнопки ниже снижают ключевую ставку на 1–4%. Лимит от этого растёт, но каждый 1% сразу добавляет 10 пунктов штрафа, и дальше штраф идёт к целевому как обычно. Кнопка доступна, пока штраф ниже 90, 80, 70 или 60, так что после нажатия он не выходит за 100; повторить можно через 12 месяцев."
