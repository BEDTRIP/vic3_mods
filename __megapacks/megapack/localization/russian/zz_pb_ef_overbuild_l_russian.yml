l_russian:
 # EF.18 v2: избыточные строительные мощности -- модификатор страны от индекса (on_actions/zz_pb_ef_overbuild_counter.txt).
 zz_pb_ef_overbuilt_economy:0 "Избыточные строительные мощности"
 zz_pb_ef_overbuilt_economy_desc:0 "Секторов стройки больше, чем выдерживает урбанизация при нынешней ставке ЦБ. Индекс избыточных мощностей подтягивается к урезанию, при котором секторы производят столько же, сколько произвёл бы лимит; каждый пункт стоит 1% выработки каждого сектора стройки."
 # EF.18 v1, больше не применяется (для сейвов, где он ещё висит).
 zz_pb_ef_overbuilt_brake:0 "Избыточные строительные мощности (старое)"
 zz_pb_ef_overbuilt_brake_desc:0 "Штраф выработки секторов стройки из прежней версии. Снимается при следующем месячном пересчёте."

 # EF.18 v2: сообщения в ленту, когда индекс входит в новую десятку.
 notification_zz_pb_ef_overbuild_rising_name:0 "Избыточные мощности растут"
 notification_zz_pb_ef_overbuild_rising_desc:0 "Секторов стройки больше, чем выдерживают наши городские центры при нынешней ставке ЦБ. Индекс избыточных мощностей: [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0] — выработка секторов стройки −[GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]%."
 notification_zz_pb_ef_overbuild_rising_tooltip:0 "#header $notification_zz_pb_ef_overbuild_rising_name$#!\n$TOOLTIP_DELIMITER$\n$notification_zz_pb_ef_overbuild_rising_desc$"

 # EF.18 v2: запрет / разрешение частных секторов стройки.
 zz_pb_ef_css_private_ban_button:0 "Запретить частные секторы стройки"
 zz_pb_ef_css_private_ban_button_desc:0 "Инвесторы больше не строят [GetBuildingType('building_construction_sector').GetName]. Мера против избыточных мощностей: новые секторы только увеличивают их."
 zz_pb_ef_css_private_ban_button_tt:0 "Частные инвесторы перестают строить [GetBuildingType('building_construction_sector').GetName]. Снять запрет можно через 6 месяцев."
 zz_pb_ef_css_private_allow_button:0 "Разрешить частные секторы стройки"
 zz_pb_ef_css_private_allow_button_desc:0 "Инвесторы снова могут строить [GetBuildingType('building_construction_sector').GetName] — до лимита, который задают городские центры и ставка ЦБ."
 zz_pb_ef_css_private_allow_button_tt:0 "Частные инвесторы снова могут строить [GetBuildingType('building_construction_sector').GetName]. Запретить снова можно через 6 месяцев."
 zz_pb_ef_css_private_ban_cooldown_tt:0 "Политику меняли меньше 6 месяцев назад"

 # EF.18 v2: секции журнала (gui/scripted_widgets/zz_pb_ef_fso_widgets.gui).
 zz_pb_ef_fso_bubble_bar:0 "Спекулятивный пузырь: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue|0]%"
 zz_pb_ef_fso_overcap_bar:0 "Избыточные строительные мощности: [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]"
 zz_pb_ef_fso_bubble_share:0 "Спекулятивный рынок: #b [GetPlayer.MakeScope.ScriptValue('fiancial_center_week_balance_in_ratio')|%1]#! [concept_gdp] в год"
 zz_pb_ef_fso_bubble_dyn_up:0 "Пузырь: #N +[GetPlayer.MakeScope.ScriptValue('zz_ef_bubble_step_eff')|0] в месяц#!"
 zz_pb_ef_fso_bubble_dyn_down:0 "Пузырь: #P [GetPlayer.MakeScope.ScriptValue('zz_ef_bubble_step_eff')|0] в месяц#!"
 zz_pb_ef_fso_bubble_dyn_zero:0 "Пузырь: в этом месяце без изменений"
 zz_pb_ef_fso_bubble_effects:0 "Сейчас: инновации #N [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|0]%#!, престиж #N [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|0]%#!, директора компаний теряют популярность"
 zz_pb_ef_fso_bubble_desc:0 "#b Как это работает#!\nБиржи продают паевые фонды дороже, чем стоят купленные ими акции, — эта наценка и есть спекулятивный рынок. Каждый месяц его годовой объём сравнивается с [concept_gdp]: меньше 30% — пузырь сдувается (до −3 в месяц при доле меньше 10%), больше 30% — надувается (+1 при 30–40%, +2 при 40–50%, +3 при 50% и больше).\n\nКаждый пункт пузыря стоит 1% скорости инноваций и 1% престижа, директора компаний теряют популярность. На стройку пузырь не влияет.\n\nКнопки выше — меры E&F: при пузыре — ограничить закупки бирж на год, без пузыря — стимулировать рынок. Подробности — в подсказках."

