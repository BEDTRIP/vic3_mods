  GLOBAL_METALIC_PRICE_bimetallism_standard:0 "#v Глобальные цены на металлы:#! \n- Цена золота в серебре: #T 1 @gold! = [Country.MakeScope.ScriptValue('gold_to_silver_rate')|D] @silver!  (Биметаллический = [Country.MakeScope.ScriptValue('bimetallic_rate_gold_to_silver')|D] @silver!) - [Country.MakeScope.ScriptValue('weight_silver')|%|] @silver!#!\n- Цена серебра в золоте: #T 1 @silver! = [Country.MakeScope.ScriptValue('silver_to_gold_rate')|D] @gold! (Биметаллический = [Country.MakeScope.ScriptValue('bimetallic_rate_silver_to_gold')|D] @gold!) -  [Country.MakeScope.ScriptValue('weight_gold')|%|] @gold!#!\n$TOOLTIP_DELIMITER$"

  LOCAL_METALIC_PRICE_bimetallism_standard:0  "#v Местные цены на металлы:#! (установленные законом при законе «Биметаллизм») \n- Цена золота в серебре: #T 1 @gold! = [Country.MakeScope.ScriptValue('bimetallic_rate_gold_to_silver')|D] @silver!#!\n- Цена серебра в золоте: #T 1 @silver! = [Country.MakeScope.ScriptValue('bimetallic_rate_silver_to_gold')] @gold!#!\n- Состав резервного металла: #b [Country.MakeScope.ScriptValue('silver_state_native_for_stockpile')|D|] @silver! ([Country.MakeScope.ScriptValue('weight_silver')|%|]) [Country.GetCustom('misalignment_rate_silver_drain')] - [Country.MakeScope.ScriptValue('gold_state_native_for_stockpile')|D|] @gold! ([Country.MakeScope.ScriptValue('weight_gold')|%|])#! [Country.GetCustom('misalignment_rate_gold_drain')]\n- Стоимость серебряного резерва в пересчёте на золото: #b [Country.MakeScope.ScriptValue('silver_state_native_for_stockpile_in_gold')|D|]#! @gold!\n$TOOLTIP_DELIMITER$"

