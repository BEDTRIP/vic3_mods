  _debt_in_national_currency:0 "Ваш дефицит в размере #v [Localize(Concatenate(Scope.GetFlagName,'_debt_in_national'))]#!, переведённый в эквивалент по системе [GetPlayer.GetCustom('monetary_system_name')] ([GetPlayer.MakeScope.ScriptValue('money_value')|D][GetPlayer.GetCustom('monetary_system')]), составляет [Localize(Concatenate(Scope.GetFlagName,'_debt_in_national_currency'))]. Эта сумма увеличивается каждый месяц на [Localize(Concatenate(Scope.GetFlagName,'_import_in_gold'))]."

