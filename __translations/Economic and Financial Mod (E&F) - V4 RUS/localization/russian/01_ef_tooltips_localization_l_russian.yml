  _currency_state_in_gold:0 "Сумма [Localize(Concatenate(Scope.GetFlagName,'_stockpiling_currency_state'))] переводится в свой металлический эквивалент. Значение [Localize(Concatenate(Scope.GetFlagName,'_stockpiling_currency_state'))] умножается на [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4'))], что соответствует золотой стоимости валюты [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4_1'))]. Если у вас действует [GetLawType('law_silver_standard').GetName], эта золотая стоимость дополнительно умножается на коэффициент перевода золота в серебро #v (1 @gold! = [GetPlayer.MakeScope.ScriptValue('gold_to_silver_rate')|D] @silver!)#!.\n\nЕсли у вас действует [GetLawType('law_gold_standard').GetName] или [GetLawType('law_bimetallism_standard').GetName], золотая стоимость исходной валюты используется напрямую, без перевода в серебро. Итоговая сумма — [Localize(Concatenate(Scope.GetFlagName,'_currency_state_in_gold'))]. Аналогично, ежемесячная сумма [Localize(Concatenate(Scope.GetFlagName,'_export_in'))] соответствует [Localize(Concatenate(Scope.GetFlagName,'_export_in_gold'))] после перевода в золото.\n\nЕсли после Серебряного кризиса 1873 года у вас действует [GetLawType('law_silver_standard').GetName], к переводу накапливаемых вами валют из золота в серебро применяется прогрессирующий штраф. По мере того как серебро становится всё менее стабильным, всё меньше центральных банков способны или готовы предоставлять серебряный эквивалент вашего экспорта, что снижает вашу конкурентоспособность при расчёте торгового баланса.\n\nПрименяемый штраф: x[GetPlayer.MakeScope.ScriptValue('silver_crisis_multiplicator_factor')|D+].\n\nИтоговый результат — [Localize(Concatenate(Scope.GetFlagName,'_tooltips_4_2'))]."

