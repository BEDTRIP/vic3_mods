  MONEY_VALUE_fiat_standard:0 "#T Стоимость денег#! - Фиатный стандарт @fiat_standard_small!\n$MONEY_VALUE_INFO_fiat_standard$\n$MONEY_SUPPLY_DESC_fiat_standard$\n$NATIONAL_CAPACITY_DESC_fiat_standard$\n$AVERAGE_MONEY_VALUE_DESC_MONEY_VALUE$\n$MONEY_VALUE_HIST$\n"

  MONEY_VALUE_INFO_fiat_standard:0 "Текущий индекс с учетом инфляции/дефляции: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_rapported_inflation')]#! ([Country.MakeScope.ScriptValue('inflation_value')|%|=-] @inflation!)\nЗначение без инфляции/дефляции: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value')]#! #T (= [Country.MakeScope.ScriptValue('money_value_in_gold')]#! @gold!)#!\n$TOOLTIP_DELIMITER$"

  #money_supply
  MONEY_SUPPLY_DESC_fiat_standard:0 "Денежная масса:\nВсего #v Денежная масса #!: #p [Country.MakeScope.ScriptValue('total_money_supply')|D]#!#! [Country.GetCustom('currency_symbol')]\n - [Country.GetCustom('currency_name')] в собственности страны: #T [Country.MakeScope.ScriptValue('money_supply')|D]#! [Country.GetCustom('currency_symbol')]\n   > [Country.GetCustom('currency_name')] в обращении: #T [Country.MakeScope.ScriptValue('money_circulating')|D]#! [Country.GetCustom('currency_symbol')]\n    -> Сбережения населения: #T [Country.MakeScope.ScriptValue('pop_savings')|D]#! [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('pop_savings_monthly')|D+=][Country.GetCustom('currency_symbol')] в месяц)\n    -> Средства частных банков: #T [Country.MakeScope.ScriptValue('private_bank_funds')|D]#! [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('private_bank_funds_pourcent')|%|])\n    -> Сбережения зданий: #T [Country.MakeScope.ScriptValue('building_saving')|D]#! [Country.GetCustom('currency_symbol')]\n    -> В распоряжении правительства: #T [Country.MakeScope.ScriptValue('government_loan_fixe')|D]#! [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('country_minting_month')|D+=][Country.GetCustom('currency_symbol')] в месяц)\n   > [Country.GetCustom('currency_name')] в резерве центрального банка: #T [Country.MakeScope.ScriptValue('money_supply_state')|D]#! [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('money_supply_state_monthly')|D+=][Country.GetCustom('currency_symbol')] в месяц)\n - [Country.GetCustom('currency_name')] в собственности другой страны: #T [Country.MakeScope.ScriptValue('money_supply_stockpile_by_other_country')|D]#! [Country.GetCustom('currency_symbol')]\n$TOOLTIP_DELIMITER$"

  #national_capacity
  NATIONAL_CAPACITY_DESC_fiat_standard:0 "Национальная емкость:\nВаша валюта не привязана к металлу\n$TOOLTIP_DELIMITER$"

