  #national_capacity
  NATIONAL_CAPACITY_DESC_silver_standard:0 "Национальная емкость:\nВсего #v Национальная емкость#!: [Country.MakeScope.ScriptValue('national_capacity')|+D] [Country.GetCustom('monetary_system')]\n- Резервы центрального банка [Country.GetCustom('monetary_system_name')]: #T [Country.MakeScope.ScriptValue('central_bank_metal_reserves_state')|D]#! [Country.GetCustom('monetary_system')] ([Country.MakeScope.ScriptValue('central_bank_metal_reserves_state_per_month')|D=+] [Country.GetCustom('monetary_system')] в месяц)\n- Залоговое золото за рубежом: #T [Country.MakeScope.Var('gold_loaned_to_central_bank_fix').GetValue|D] @gold!/[Country.MakeScope.ScriptValue('total_debt_in_gold')|D]#! @gold! (#T #n -#![Country.MakeScope.ScriptValue('central_bank_interest_refund_per_year')|D-]#! @gold! в год) ([Country.MakeScope.ScriptValue('gold_loaned_to_central_bank_in_national_metal')|D]#! [Country.GetCustom('monetary_system')])\n- Торговый баланс: #T [Country.MakeScope.ScriptValue('trade_balance_in_gold_fixe_sv')|D]#! [Country.GetCustom('monetary_system')] ([Country.MakeScope.ScriptValue('trade_balance_in_gold_delta')|D=+] [Country.GetCustom('monetary_system')] в месяц)\n$TOOLTIP_DELIMITER$"
