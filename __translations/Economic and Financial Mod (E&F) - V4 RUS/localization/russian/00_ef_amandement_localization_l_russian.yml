l_russian:

amendment_bimetallic_ratio_15_5_fra: "Жерминальское биметаллическое соотношение"
amendment_bimetallic_ratio_15_5_fra_desc: "Законный паритет золота и серебра закреплён в соответствии с жерминальской денежной системой, устанавливающей биметаллическое соотношение 15,5 к 1."

amendment_bimetallic_ratio_15_5_latine_union: "Латинский монетный паритет"
amendment_bimetallic_ratio_15_5_latine_union_desc: "Соотношение золота и серебра приведено в соответствие со стандартами Латинского монетного союза, унифицируя биметаллическую чеканку монет среди государств-участников."

amendment_usa_bimetallic_ratio_1834: "Пересмотренное американское биметаллическое соотношение"
amendment_usa_bimetallic_ratio_1834_desc: "Паритет золота и серебра скорректирован в соответствии с Монетным актом 1834 года, повышая законное соотношение в пользу серебра относительно золота."

amendment_usa_bimetallic_ratio_1873: "Конец свободной чеканки серебра"
amendment_usa_bimetallic_ratio_1873_desc: "Свободная чеканка серебра фактически приостановлена, что подрывает биметаллическую систему и подготавливает переход к золотому денежному стандарту."

amendment_spain_bimetallic_ratio_traditional: "Традиционное испанское биметаллическое соотношение"
amendment_spain_bimetallic_ratio_traditional_desc: "Паритет золота и серебра отражает давние испанские денежные традиции, сформированные масштабной добычей серебра и колониальным денежным обращением."

amendment_german_bimetallic_ratio_conservative: "Консервативный германский биметаллический паритет"
amendment_german_bimetallic_ratio_conservative_desc: "Денежная система сохраняет осторожное соотношение золота и серебра, отдавая предпочтение стабильности и преемственности перед быстрой адаптацией к условиям международного рынка."

amendment_netherlands_bimetallic_ratio: "Голландское административное биметаллическое соотношение"
amendment_netherlands_bimetallic_ratio_desc: "Паритет золота и серебра административно согласован с денежными системами соседних государств, сохраняя биметаллическое обращение без формальных договорных обязательств."
