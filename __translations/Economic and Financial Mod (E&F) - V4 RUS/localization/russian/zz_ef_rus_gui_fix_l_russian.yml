 # ---------------------------------------------------------------------------
 # Ключи, которых нет в локализации мода.
 # В .gui они прописаны как text = "<ключ>", и без записи здесь игра печатает
 # сам ключ: в таблицах видно "total", "month", "time", "stored", "Balance"...
 # Файл называется zz_*, чтобы грузиться последним и переопределять что угодно.
 # В ванильной локализации таких ключей нет — конфликта не будет.
 # ---------------------------------------------------------------------------

 # шапки таблиц «Посмотреть финансируемые страны» / «…предоставляющие золотые кредиты»
 c:0 "$"
 type:0 "$"
 total:0 "Всего"
 month:0 "Доход/мес"
 year:0 "Год"
 time:0 "Лет"

 # шапки в панели национального резерва
 stored:0 "Закупка"
 relesed:0 "Выпуск"
 Balance:0 "Баланс"
