  economic_sentiment_index_base_1_button:1 "#b 5 [GetBuildingType('building_ef_private_construction').GetName]#!"
  economic_sentiment_index_base_1_button_desc: "Попросить частный сектор инвестировать в новые [GetBuildingType('building_ef_private_construction').GetName]. Определённое количество таких секторов будет построено по всей стране.\nОднако после этого запроса частный сектор некоторое время не сможет отвечать на дальнейшие требования правительства."
