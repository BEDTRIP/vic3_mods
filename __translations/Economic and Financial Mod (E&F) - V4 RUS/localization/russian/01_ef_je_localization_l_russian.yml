central_bank_bankruptcy_country_tooltip:0 "#T #l Стоимость денег в золоте:#! [GetPlayer.MakeScope.ScriptValue('money_value_in_gold')|D]@gold!#! \nТекущая золотая стоимость национальной валюты @gold! составляет #b [GetPlayer.MakeScope.ScriptValue('money_value_in_gold')|D]#! @gold!. Если это значение остаётся ниже #n 0,01#! @gold! дольше #bold 1 года#!, может наступить #l #n банкротство центрального банка#!#!. Если страна уже переживает экономическую или финансовую нестабильность, падение ниже #n 0,01#! @gold! немедленно вызовет #n многофакторный экономический кризис#!.\n > В течение #u 2 лет#! страна будет находиться в кризисе, что помешает созданию торговых путей ([concept_trade]) (спустя #u 3 года#! после кризиса вы сможете ввести новую валюту)."

currency_crisis_country_tooltip:0 "#T #l Стоимость денег за 1 год:#! [GetPlayer.MakeScope.ScriptValue('money_value_dif_1_final')|%|=+]#! \nЕсли стоимость национальной валюты упадёт более чем на #n -50%#! за #bold 1 год#!, может наступить #l #n валютный кризис#!#!. Если страна уже переживает экономическую или финансовую нестабильность, обесценивание валюты более чем на #n -50%#! немедленно вызовет #n многофакторный экономический кризис#!.\n > В течение #u 2 лет#! страна будет находиться в кризисе, что помешает созданию торговых путей ([concept_trade]) (спустя #u 3 года#! после кризиса вы сможете ввести новую валюту)."

economic_crisis_country_tooltip:0 "#T #l [concept_gdp] за 1 год:#! [GetPlayer.MakeScope.ScriptValue('GDP_dif_1_final')|%|=+]#! \nЕсли [concept_gdp] страны сократится более чем на #n -50%#! за #bold 1 год#!, может наступить #l #n экономический кризис#!#!. Если страна уже переживает экономическую или финансовую нестабильность, спад экономики более чем на #n -50%#! немедленно вызовет #n многофакторный экономический кризис#!.\n > В течение #u 2 лет#! #t все здания#! в стране получат модификатор, снижающий их производительность более чем на #N 50%#!."

financial_crash_country_tooltip:0 "#T #l Изменение фондового индекса за 1 год:#! [GetPlayer.MakeScope.ScriptValue('GDP_dif_1_final')|%|=+]#! \nЕсли национальный фондовый индекс упадёт более чем на #n -50%#! за #bold 1 год#!, может наступить #l #n финансовый крах#!#!. Если страна уже переживает экономическую или финансовую нестабильность, обвал рынка более чем на #n -50%#! немедленно вызовет #n многофакторный экономический кризис#!.\n > В течение #u 2 лет#! #t все частные здания#! в стране получат модификатор, снижающий их производительность более чем на #N 50%#!."

country_bankruptcy_tooltip:0 "#T #l Банкротство страны:#!#! \n Объявляя банкротство, страна вступает в период экономической нестабильности на весь срок действия модификатора. Хотя из всех крупных кризисов этот наносит экономике наименьший ущерб, он создаёт крайне уязвимое положение, в котором любой новый возникший кризис немедленно перерастёт в #n многофакторный экономический кризис#!."
 

