  speculative_share_9_button:1 "#b Стимулирование спроса на строительство #!" 
  speculative_share_9_button_desc: "Правительство стремится стимулировать частное строительство, снизив ключевую ставку. Это приведёт к строительству #b 5 [GetBuildingType('building_ef_private_construction').GetName]#!. Однако чрезмерный рост может привести к риску запуска «Перестроенной экономики»."
