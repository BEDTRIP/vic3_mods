  ################################
  #Introduction CB et FC
  ################################

  bank_je_central_1:0 "Закон об учреждении центрального банка" 
  bank_je_central_1_reason:0 "Центральный банк позволяет унифицировать и централизовать выпуск монет и банкнот — ключевой этап экономического развития любого государства.\n \n Центральный банк автоматически появится, когда ВВП страны превысит 5 миллионов, либо когда будет открыта технология «Центральный банк»."

  financial_center_je_1:0 "Разрешение на учреждение фондовой биржи"
  financial_center_je_1_reason:0 "Фондовая биржа даёт предпринимателям и инвесторам единую площадку для обращения акций и облигаций — необходимый шаг для перехода экономики к акционерному капиталу.\n \n Финансовый центр появится, когда будут открыты технологии «[GetTechnology('stock_exchange').GetName]» и «[GetTechnology('financial_center').GetName]»; исследование обеих ускоряется по мере роста ВВП страны."

##########################
#financial_center_je
##########################

  financial_center_je_2:0 "Управление финансовой стабильности (УФС)"
  financial_center_je_2_reason:0 "#l > Стабильность финансового сектора: #! \n\n #b Спекулятивный рынок#! в настоящее время составляет #b [GetPlayer.MakeScope.ScriptValue('fiancial_center_week_balance_in_ratio')|%|]#! национального #b [concept_gdp]#!.\n\nЧем большую долю [concept_gdp] занимает спекулятивный рынок, тем сильнее раздувается спекулятивный пузырь по следующей схеме:\n\n #U - 0–10% → спекулятивное напряжение сильно снижено (−3)\n - 10–20% → напряжение снижается (−2)\n - 20–30% → небольшое снижение (−1)\n - 30–40% → небольшой рост (+1)\n - 40–50% → заметный рост (+2)\n - 50%+ → сильный рост пузыря (+3)#!\n\n#b Текущие последствия:#!\n - Сокращение доступной мощности [concept_construction] (сейчас: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Замедление темпа инноваций (сейчас: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Снижение целевого [concept_prosperity] для [concept_company] (сейчас: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n - Потеря национального престижа (сейчас: [GetPlayer.MakeScope.ScriptValue('speculative_share_1_penality')|D=+] %)\n\nЕсли пузырь достигнет #b 100%#! заполнения, страну поразит #b крупный финансовый крах#!.\n\n#l > Стабильность строительного сектора: #!\n\n [GetBuildingType('building_ef_private_construction').GetName] отражают общий спрос на проекты [concept_construction] со стороны частных лиц, а также [concept_company] разного размера.\n\n В отличие от мощности государственного [GetBuildingType('building_construction_sector').GetName], мощность [GetBuildingType('building_ef_private_construction').GetName] имеет теоретический предел — совокупный спрос населения на [concept_construction].\n \n Таким образом, существует прямая связь между уровнем [concept_urbanization] областей страны и её максимальной мощностью [GetBuildingType('building_ef_private_construction').GetName].\n \n [concept_base_rate_percentage], устанавливаемая Центральным банком, выступает множителем, связывающим эти две величины. Следовательно, теоретически максимальная мощность [GetBuildingType('building_ef_private_construction').GetName] страны равна:\n \n #v Суммарный уровень [GetBuildingType('building_urban_center').GetName] × (1 - Ключевая ставка x 10)#!\n \n #lore «Чем выше [concept_base_rate_percentage], тем сильнее сжимается строительный сектор. И наоборот, когда [concept_base_rate_percentage] низка, [GetBuildingType('building_ef_private_construction').GetName] достигают своего максимального потенциала спроса — равного суммарному числу уровней [GetBuildingType('building_urban_center').GetName] во всех областях.»#! \n \n #b Текущие значения:#!\n - Число [GetBuildingType('building_ef_private_construction').GetName] в стране: #p [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#!\n - Суммарный уровень [GetBuildingType('building_urban_center').GetName]: #p [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl')]#!\n - Текущая [concept_base_rate_percentage]: #p [GetPlayer.MakeScope.ScriptValue('base_rate_percentage_decimal')]%#!\n - Теоретический максимум уровня ЧСС: #p [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#! #b (т.е. [GetPlayer.MakeScope.ScriptValue('base_rate_to_pcs_factor')|%] от [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl')])#!\n \n Если суммарное число уровней [GetBuildingType('building_ef_private_construction').GetName] превысит этот теоретический максимум из-за рыночной конъюнктуры, страна попадает в состояние #v перестроенной экономики#!.\n \n Пока длится перестроенная экономика, шкала прогресса растёт на #U +1#! каждый месяц, а её заполнение напрямую определяет отрицательный модификатор к выпуску финансовых продуктов.\n \n И наоборот, пока текущий уровень [GetBuildingType('building_ef_private_construction').GetName] ниже максимального, вы можете попросить частный сектор строить больше в обмен на экономические уступки."

  financial_center_je_2_reason_1:0 "Спекулятивный рынок#! в настоящее время составляет #b [GetPlayer.MakeScope.ScriptValue('fiancial_center_week_balance_in_ratio')|%|]#! национального #b [concept_gdp]#!."

  financial_center_je_2_reason_1_2:0 "#U - 0–10% → спекулятивное напряжение сильно снижено (−3)\n - 10–20% → напряжение снижается (−2)\n - 20–30% → небольшое снижение (−1)\n - 30–40% → небольшой рост (+1)\n - 40–50% → заметный рост (+2)\n - 50%+ → сильный рост пузыря (+3)#!"

  financial_center_je_2_reason_1_3:0 "Чем выше уровень ваших финансовых центров, тем активнее частный сектор реинвестирует инвестиционный пул, тем больше создаётся финансовых продуктов — и тем выше потенциал спекулятивного пузыря"

