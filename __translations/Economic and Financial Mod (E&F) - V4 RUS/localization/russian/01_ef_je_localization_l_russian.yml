  status_central_bank_1: "При отсутствии централизованной денежной системы страна опирается на разрозненный набор способов обмена. Бартер, устаревшие местные монеты и смесь иностранных валют обращаются бок о бок, подчёркивая фрагментированное состояние экономики."
  status_central_bank_2: "После открытия технологии «Валютные стандарты» в разных областях страны обращаются различные виды банкнот без какой-либо централизованной унификации"
  status_central_bank_3: " Пока Япония остаётся под властью сёгуната, современные финансовые структуры не могут быть созданы.\n Завершение Реставрации Мэйдзи положит конец этой изоляции и откроет возможность создания национального Центрального банка."

  # status_financial_center_1: "Доверие инвесторов стремительно растёт, рынки процветают, а частный капитал свободно перетекает во все отрасли. Экономика излучает стабильность и рост."
  # status_financial_center_2: "Экономическая обстановка уверенная. Частные банки расширяют свои портфели, а общество воспринимает рынок как надёжный и прибыльный."
  # status_financial_center_3: "В целом экономика остаётся здоровой, хотя некоторые инвесторы начинают действовать осторожнее. Рост продолжается, но появляются признаки волатильности."
  # status_financial_center_4: "Экономическая уверенность умеренная. Инвестиции остаются стабильными, но неопределённость начинает влиять на финансовые решения."
  # status_financial_center_5: "Рынок колеблется. Частные инвесторы становятся более разборчивыми, а общий экономический настрой нейтрален, балансируя между оптимизмом и осторожностью."
  # status_financial_center_6: "Уверенность ослабевает. Инвесторы переходят к оборонительной позиции, а условия кредитования начинают ужесточаться по мере распространения сомнений на рынках."
  # status_financial_center_7: "Экономические настроения напряжённые. Частное финансирование замедляется, и растут спекуляции о устойчивости текущих темпов роста."
  # status_financial_center_8: "Доверие инвесторов резко упало. Отток капитала и рыночные коррекции нарушают финансовую стабильность."
  # status_financial_center_9: "Страна сталкивается с серьёзным экономическим спадом. Банки ограничивают кредитование, промышленность страдает, а рынками правит страх."
  # status_financial_center_10: "Надвигается полномасштабный финансовый крах. Инвесторов охватывает паника, кредит иссяк, и экономическая система балансирует на грани провала."


