  #speculative
  speculative_share_1_button:1 "#b Запрет иностранных финансовых продуктов#!"
  speculative_share_1_button_desc: "После принятия иностранные финансовые продукты больше не могут импортироваться или потребляться финансовыми центрами. Это снижает производство паевых фондов и уменьшает спекулятивную долю в ВВП страны.\n#b Требуется, чтобы прогресс спекулятивного пузыря превышал 10%.#!"
  speculative_share_1_button_tt: "#b Прогресс спекулятивного пузыря#! должен быть выше #b 10%#!. (Сейчас: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_2_button:1 "#b Закон о регулировании фондовой биржи#!"
  speculative_share_2_button_desc: "Этот закон вводит более жёсткий надзор за операциями на фондовом рынке, ограничивая спекулятивную торговлю и рискованные инвестиции. Сдерживая краткосрочные спекуляции, он снижает спрос на финансовые продукты и постепенно замедляет рост паевых фондов.\n#B Требуется, чтобы прогресс спекулятивного пузыря превышал 20% и чтобы спрос на финансовые продукты в финансовых центрах был сокращён на 25%.#!"
  speculative_share_2_button_tt: "#b Прогресс спекулятивного пузыря#! должен быть выше #b 20%#!. (Сейчас: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_3_button:1 "#b Указ об ужесточении кредита и валютных операций#!"
  speculative_share_3_button_desc: "Правительство вводит жёсткие ограничения на кредит и финансовые обмены, чтобы сдержать перегрев рынка. Эта мера напрямую сокращает спрос на финансовые продукты вдвое, резко снижая производство паевых фондов и спекулятивный рост.\n#b Требуется, чтобы прогресс спекулятивного пузыря превышал 40% и чтобы спрос на финансовые продукты в финансовых центрах был сокращён на 50%.#!"
  speculative_share_3_button_tt: "#b Прогресс спекулятивного пузыря#! должен быть выше #b 40%#!. (Сейчас: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_4_button:1 "#b Экстренный указ о приостановке финансовых рынков#!"
  speculative_share_4_button_desc: "В ответ на критический спекулятивный кризис правительство приостанавливает все основные операции на финансовых рынках. Импорт и обмен финансовых товаров замораживаются, производство паевых фондов останавливается, а пузырь принудительно сдувается. Этот экстренный указ, стабилизируя экономику, может вызвать временную рецессию.\n#b Требуется, чтобы прогресс спекулятивного пузыря превышал 60% и чтобы спрос на финансовые продукты в финансовых центрах был сокращён на 75%.#!"
  speculative_share_4_button_tt: "#b Прогресс спекулятивного пузыря#! должен быть выше #b 60%#!. (Сейчас: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"

  speculative_share_5_button:1 "#b Стимулирование финансового сектора#!" #5 [GetBuildingType('building_financial_centre').GetName]
  speculative_share_5_button_desc: "Попросить частный сектор инвестировать в новые #b 5 уровней [GetBuildingType('building_financial_centre').GetName]#!. Определённое количество таких центров будет построено по всей стране.\nОднако после этого запроса частный сектор некоторое время не сможет отвечать на дальнейшие требования правительства."
  speculative_share_5_button_tt_1: "Спекулятивный пузырь ниже 20% (Сейчас: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue]%)"
