  concept_central_bank:0 "Центральный банк"
  concept_central_bank_desc:0 "В XIX веке [concept_central_bank] обычно определялся как экономический институт, главными задачами которого были эмиссия национальной валюты, регулирование [concept_money_supply], надзор за финансовой системой и поддержание экономической стабильности. [concept_central_bank] XIX века часто создавались в ответ на потребность в едином эмитенте валюты, способном контролировать [concept_money_supply] и стабилизировать экономическую систему."

  concept_financial_centre:0 "Финансовый центр"
  concept_financial_centre_desc:0 "В XIX веке [concept_financial_centre] был экономически значимым регионом, где сосредотачивалась банковская, финансовая и торговая деятельность. Такие [concept_financial_centre] часто служили узловыми точками для банковских учреждений, финансовых рынков, корпораций и других участников делового оборота."

  concept_national_stockpile:0 "Национальный резерв"
  concept_national_stockpile_desc:0 "«Резерв» — это значительный запас или накопление чего-либо, обычно товаров, сырья или ресурсов, хранимых в расчёте на будущие потребности или на случай чрезвычайных ситуаций. Также этим словом обозначают большое количество чего-либо, накопленное за определённый период времени."

  ################################
  #divers
  ################################

  concept_money_value:0 "Стоимость денег"
  concept_money_value_desc:0 "[concept_money_value] определяется как [concept_national_stockpile], делённый на общее количество выпущенной и находящейся в обращении валюты на вашем рынке ([concept_money_supply]). Если национальная валюта покидает ваш рынок, её стоимость возрастает; если валюта поступает на рынок, стоимость снижается. Аналогично, увеличение выпуска валюты снижает её стоимость, а уменьшение выпуска — повышает."

  concept_money_value_target_real:0 "Металлический паритет" #je pense que c'est le money valu ciblé
  concept_money_value_target_real_desc:0 "Металлический паритет — это желаемая стоимость вашей национальной валюты в металле."

  concept_money_value_target_selection:0 "Металлический паритет"
  concept_money_value_target_selection_desc:0 "Металлический паритет — это желаемая стоимость вашей национальной валюты в металле."

  concept_money_supply:0 "Денежная масса"
  concept_money_supply_desc:0 "Денежная масса — это общее количество национальной валюты, находящейся на вашем рынке."

  concept_central_bank_gold_reserve_ratio:0 "Доля металлических резервов центрального банка"
  concept_central_bank_gold_reserve_ratio_desc:0 "Доля металлических резервов центрального банка — это процент денежной массы страны, обеспеченный металлическими резервами центрального банка. Этот показатель отражает, какая часть обращающейся валюты может быть конвертирована в металл."

  concept_money_value_target:0 "Коэф. покрытия металлом"
  concept_money_value_target_desc:0 "Коэффициент покрытия металлом — это максимальная стоимость национальной валюты, которую вы можете или должны производить для достижения [concept_money_value_target_real]. Если ваша [concept_money_supply] превышает [concept_money_value_target], месячный прирост денежной массы сбрасывается в 0, и вы не сможете накапливать больше валюты. Кроме того, к вашему центральному банку будет применён штраф -1% в месяц к производству денег, максимум до -50%. Этот штраф действует только при активной политике «без денежной политики» или «ревальвация»; при политике девальвации этот предел не учитывается, и стоимость валюты будет стремиться к 0. В целом это означает, что вы стремитесь поддерживать стоимость валюты на слишком высоком уровне относительно возможностей вашего рынка."

  concept_money_value_target_with_reference_currency_selection:0 "Паритет с эталонной валютой"
  concept_money_value_target_with_reference_currency_selection_desc:0 "Паритет, установленный по отношению к выбранной эталонной валюте."

  concept_inflation_value:0 "Значение инфляции"
  concept_inflation_value_desc:0 "Инфляция/дефляция — результат нескольких параметров: годовой естественной инфляции, рыночных цен, стоимости валюты и инфляции, возникающей из-за производства вашей валюты. Вы можете влиять на инфляцию/дефляцию, воздействуя на эти параметры."

  concept_national_capacity:0 "Национальный капитал"
  concept_national_capacity_desc:0 "Национальный капитал — это общее количество золота, которым располагает страна. Он определяется несколькими факторами: [concept_government_treasury], [concept_central_bank_metal_reserves] и [concept_gold_balance]."

  concept_devaluation:0 "Девальвация"
  concept_devaluation_desc:0 "В XIX веке девальвация обычно понималась как экономическое действие по снижению официальной стоимости валюты относительно эталона — другой иностранной валюты или денежного стандарта, такого как золото или серебро. Вы можете девальвировать валюту на 25%, 50%, 75% или 100%. Это увеличивает вашу текущую денежную производственную мощность на соответствующий процент. При этом инфляция денежного производства увеличивается на +1, +2, +3 или +4 с интервалом в 6 месяцев."

  concept_revaluation:0 "Ревальвация"
  concept_revaluation_desc:0 "В XIX веке ревальвация была экономическим действием, противоположным девальвации, и заключалась в повышении официальной стоимости валюты относительно эталона — другой иностранной валюты или денежного стандарта, такого как золото или серебро. Вы можете ревальвировать валюту на 25%, 50%, 75% или 100%. Это уменьшает вашу текущую денежную производственную мощность на соответствующий процент. При этом инфляция денежного производства уменьшается на -1, -2, -3 или -4 с интервалом в 6 месяцев."

  concept_subject_currency_management:0 "Управление валютой субъекта"
  concept_subject_currency_management_desc:0 "Управление валютой субъекта позволяет игроку регулировать паритет между своей валютой и валютой своих субъектов. По умолчанию валюта сюзерена стоит вдвое дороже валюты субъектов."

  concept_parity:0 "Паритет"
  concept_parity_desc:0 "В XIX веке термин «паритет» в денежной экономике означал официальное или фиксированное соотношение между двумя валютами либо между валютой и денежным стандартом, таким как золото или серебро. Паритет определял относительную стоимость одной валюты по сравнению с другой или с общим эталоном."

  concept_central_bank_metal_reserves:0 "Металлические резервы ЦБ"
  concept_central_bank_metal_reserves_desc:0 "Металлические резервы Центрального банка — это металлы, хранящиеся в вашем [concept_central_bank]. Они являются основным источником ценности валюты страны. Эти металлы находятся в том штате, где расположен ваш [concept_central_bank]; если этот штат будет аннексирован вражеской державой, вы потеряете эти металлы. Резервы пополняются за счёт металлов, имеющихся на вашем рынке и накапливаемых ежемесячно: чем больше металлов на вашем рынке, тем больше их накапливается в Металлических резервах Центрального банка. Зависимые страны не могут накапливать металлы."

  concept_gold_balance:0 "Торговый баланс"
  concept_gold_balance_desc:0 "Торговый баланс — это ситуация, когда страна поддерживает сбалансированную торговлю с другими государствами по чистым притокам и оттокам золота. В условиях золотого стандарта или обеспечения валюты золотом такой баланс был крайне важен для стабильности валюты и золотых резервов."

  concept_import_value:0 "Стоимость импорта (в золоте)"
  concept_import_value_desc:0 "Стоимость импорта (в золоте) — это совокупность всего, что вы покупаете на внешнем рынке. Вы платите за эти товары золотом, а не национальной валютой (современное представление о покупке иностранных товаров за национальную валюту появилось лишь в 1970-х годах, после краха Бреттон-Вудской системы)."

  concept_export_value:0 "Доход от экспорта (в золоте)"
  concept_export_value_desc:0 "Экспортная прибыль (в золоте) — это совокупность всего, что вы продаёте на внешнем рынке. Вы продаёте эти товары за золото, а не за национальную валюту (современное представление о продаже товаров за рубеж за национальную валюту появилось лишь в 1970-х годах, после краха Бреттон-Вудской системы)."

  concept_world_currency:0 "Мировая валюта"
  concept_world_currency_desc:0 "Список мировых валют позволяет увидеть, какое место занимает ваша национальная валюта относительно остальных мировых валют."

  concept_evolution_of_the_currency_value:0 "Динамика стоимости валюты"
  concept_evolution_of_the_currency_value_desc:0 "Список «Динамика курса валют» позволяет увидеть изменение стоимости мировых валют за 1 год, 5 лет и 10 лет. (Значения поначалу могут выглядеть некорректно — чтобы они выставились правильно, требуется 5 и 10 лет игрового времени)"

  concept_exchange_rate:0 "Обменный курс"
  concept_exchange_rate_desc:0 "В XIX веке обменные курсы между валютами обычно определялись системой фиксированных курсов, основанной на золотом стандарте. Это означало, что стоимость национальных валют была привязана к определённому количеству золота. Правительства часто устанавливали цену своей валюты в золоте, тем самым обеспечивая её конвертируемость."

  concept_money_value_rapported_inflation:0 "Стоимость денег с учётом инфляции"
  concept_money_value_rapported_inflation_desc:0 "Стоимость денег с учётом инфляции — это изменение стоимости вашей валюты из-за инфляции/дефляции. Это важнейший фактор при определении стоимости вашей валюты для обменных курсов."

  concept_international_economic_power:0 "Международная экономическая мощь"
  concept_international_economic_power_desc:0 "Международная экономическая мощь определяется страной с наибольшим национальным капиталом. Это валюта с наибольшим обеспечением, что делает её крайне надёжной на мировых рынках. Это значение может меняться в зависимости от того, какая страна обладает наибольшим национальным капиталом. (Всё в ваших руках!)"

  concept_monetary_policy:0 "Денежно-кредитная политика"
  concept_monetary_policy_desc:0 "Денежно-кредитная политика — основной инструмент управления инфляцией/дефляцией. Она также позволяет увеличивать или уменьшать [concept_money_supply], что влияет на [concept_money_value] вашей валюты. Это главный способ достижения [concept_money_value_target]."

  concept_currency_reserves:0 "Валютные резервы"
  concept_currency_reserves_desc:0 "Валютные резервы — это общее количество иностранной валюты, которой вы владеете, приобретённой через покупку или полученной в результате торговли. Вы накапливаете иностранную валюту только если иностранная страна хочет импортировать товары с вашего рынка. В этом случае страна покупает ваши товары, расплачиваясь своей валютой. То же самое происходит в обратном направлении при импорте: вы передаёте свою валюту другой стране."

  concept_national_debt:0 "Государственный долг"
  concept_national_debt_desc:0 "Общая сумма денег, которую государство заняло, обычно через выпуск ценных бумаг, таких как облигации и казначейские векселя. Включает как внутренний, так и внешний долг."

  concept_credit_at_central_bank:0 "Кредит в центральном банке"
  concept_credit_at_central_bank_desc:0 "Объём кредита, предоставленного центральному банку, часто через операции на открытом рынке или другие инструменты денежно-кредитной политики. Сюда могут входить краткосрочные заимствования коммерческих банков у центрального банка."

  concept_central_bank_debt:0 "Долг центрального банка"
  concept_central_bank_debt_desc:0 "Долг центрального банка — это разница между золотом, находящимся в банке, и золотом, необходимым для обеспечения золотого паритета. Если этот долг больше 0, центральные банки или иностранные правительства предоставляют золото под годовой процент."

  concept_take_debt:0 "Взять кредит в центральном банке"
  concept_take_debt_desc:0 "Заимствование денег у центрального банка, обычно коммерческими банками или другими финансовыми учреждениями. Как правило, это делается для покрытия краткосрочных потребностей в ликвидности и подчиняется ставкам и условиям кредитования центрального банка."

  concept_central_bank_metal_reserves_state_to_ensure_the_conversion:0 "Металлические резервы ЦБ для обеспечения конвертируемости"
  concept_central_bank_metal_reserves_state_to_ensure_the_conversion_desc:0 "Объём золота, находящегося в центральном банке, который служит гарантией стабильности и надёжности валюты страны. Эти резервы поддерживают стоимость национальной валюты и могут использоваться в международной торговле и финансовых операциях."

  concept_gdp_growth_rate:0 "Темп роста ВВП"
  concept_gdp_growth_rate_desc:0 "Темп роста ВВП — это список, показывающий динамику ВВП стран за 1 год, 5 лет и 10 лет. (Значения поначалу могут выглядеть некорректно — чтобы они выставились правильно, требуется 5 и 10 лет игрового времени)"

  concept_gold_balance_by_country:0 "Золотой баланс внешней торговли по странам (в золоте)"
  concept_gold_balance_by_country_desc:0 "Золотой баланс внешней торговли — это ситуация, когда страна поддерживает сбалансированную торговлю с другими государствами по чистым притокам и оттокам золота. В условиях золотого стандарта или обеспечения валюты золотом такой баланс был крайне важен для стабильности валюты и золотых резервов."

  concept_international_financial_power:0 "Международная финансовая мощь"
  concept_international_financial_power_desc:0 "Международная финансовая мощь определяется суммой общей капитализации всех финансовых продуктов страны."

  concept_stock_market_index:0 "Капитализация фондового рынка"
  concept_stock_market_index_desc:0 "Капитализация фондового рынка — это сумма всех акций/облигаций в определённом секторе, умноженная на их цену."

  concept_country_rating:0 "Рейтинг страны"
  concept_country_rating_desc:0 "Рейтинг страны — это оценка, присваиваемая стране на основе ВВП, стоимости валюты, инфляции, престижа, ранга и уровня жизни. На основе присвоенного рейтинга определяется пороговая процентная ставка для страны. Ставка, которой может достичь страна, не может быть ниже определённой рейтингом."

  concept_financial_product_bond:0 "Финансовый продукт — облигация"
  concept_financial_product_bond_desc:0 "Общее количество облигаций, находящихся у страны."

  concept_purchase_of_bond_debt:0 "Инвестиции во внешний долг"
  concept_purchase_of_bond_debt_desc:0 "Инвестиции во внешний долг позволяют покупать облигации иностранных государств. Вы отправляете часть золота из своего резерва на срок 5 или 10 лет и получаете ежемесячный процент по ставке страны-эмитента. По истечении срока вы автоматически возвращаете своё золото. Можно совершить до 5 инвестиций на 10 лет или 5 инвестиций на 5 лет. Игроку также доступна возможность запросить инвестиции в свой долг: в этом случае иностранные страны отправят вам золото, а вы будете платить ежемесячный процент. По истечении срока вы возвращаете заёмное золото. Включите «Запросить международное финансирование»."

  concept_financial_product_industrial:0 "Финансовый продукт — акции"
  concept_financial_product_industrial_desc:0 "Общее количество финансовых продуктов (акций), находящихся у страны."

  concept_flow_storage:0 "Потоковое хранение"
  concept_flow_storage_desc:0 "[concept_flow_storage] бесплатно хранит излишки рынка. В отличие от приказов накопления и высвобождения, доступных благодаря технологии национального резерва, которые могут дорого обходиться государству, но позволяют создавать более надёжные стратегические запасы."

  concept_exchange_currency:0 "Обмен валюты (Форекс)"
  concept_exchange_currency_desc:0 "Форекс позволяет обменивать вашу валюту на валюту иностранного государства. Будьте осторожны: если у иностранного государства окажется много вашей валюты, оно может продать её большими объёмами вашему центральному банку, что приведёт к падению стоимости вашей национальной валюты."

  concept_r_m_s_a:0 "Договор о поставках сырья"
  concept_r_m_s_a_desc:0 "[concept_r_m_s_a] — это договор, позволяющий покупать сырьё у конкретной иностранной страны за её национальную валюту или за золото при покупке на мировом рынке."

  concept_m_e_s_a:0 "Договор о поставках военного снаряжения"
  concept_m_e_s_a_desc:0 "[concept_m_e_s_a] — это лицензия, позволяющая приобретать военное снаряжение у конкретной иностранной страны за её национальную валюту."

  concept_r_m_g_m:0 "Глобальный рынок сырья (R.M.G.M)"
  concept_r_m_g_m_desc:0 "[concept_r_m_g_m] позволяет покупать сырьё на международном рынке за золото по курсу валюты международной экономической державы."

  concept_bond_market_index:0 "Капитализация облигаций"
  concept_bond_market_index_desc:0 "Капитализация облигаций — это общее количество облигаций, умноженное на их цену."

  concept_manufacture_stock_index:0 "Капитализация промышлен-\nных акций"
  concept_manufacture_stock_index_desc:0 "[concept_manufacture_stock_index] — это общее количество промышленных акций, умноженное на их цену."

  concept_mining_stock_index:0 "Капитализация горно-\nдобывающих акций"
  concept_mining_stock_index_desc:0 "[concept_mining_stock_index] — это общее количество горнодобывающих акций, умноженное на их цену."

  concept_agricultural_stock_index:0 "Капитализация акций\nсельского хозяйства"
  concept_agricultural_stock_index_desc:0 "[concept_agricultural_stock_index] — это общее количество акций сельского хозяйства, умноженное на их цену."

  concept_railroad_stock_index:0 "Капитализация железно-\nдорожных акций"
  concept_railroad_stock_index_desc:0 "[concept_railroad_stock_index] — это общее количество железнодорожных акций, умноженное на их цену."

  concept_short_term_monetary_policy:0 "Малая корректировка денежной политики"
  concept_short_term_monetary_policy_desc:0 "Небольшое изменение, вносимое центральным банком в инструменты денежной политики — процентные ставки, требования к резервам или операции на открытом рынке — с целью тонкой настройки экономических условий. Обычно такие корректировки делаются для реагирования на краткосрочные экономические колебания без существенного изменения общего курса денежной политики."

  concept_long_term_monetary_policy:0 "Крупная корректировка денежной политики"
  concept_long_term_monetary_policy_desc:0 "Существенное изменение, вносимое центральным банком в инструменты денежной политики: значительная корректировка процентных ставок, серьёзное изменение требований к резервам или масштабные операции на открытом рынке. Обычно такие меры принимаются в ответ на тяжёлые экономические условия или кризисы и направлены на существенное изменение экономической активности."

  concept_money_circulating:0 "Валюта в обращении"
  concept_money_circulating_desc:0 "Валюта в обращении — это количество вашей валюты, которое циркулирует в экономике и на которое вы не можете повлиять."

  concept_pool_growth_rate_thanks_to_borrowing:0 "Темп роста пула за счёт заимствований"
  concept_pool_growth_rate_thanks_to_borrowing_desc:0 "Темп роста пула отражает увеличение инвестиционного пула за счёт займа, предоставленного инвестиционным пулом частных банков центральному банку."

  concept_private_bank_borrowings_year:0 "Величина кредитного потока"
  concept_private_bank_borrowings_year_desc:0 "Прогнозируемая величина увеличения/уменьшения кредита в инвестиционном пуле на 1 января следующего года"

  concept_pool_growth_rate_thanks_credit_score:0 "Рост пула за счёт кредитного рейтинга"
  concept_pool_growth_rate_thanks_credit_score_desc:0 "Процент увеличения инвестиционного пула за счёт кредита центральному банку в зависимости от экономической и финансовой силы (максимум = 10)"

  concept_interest_value_domestic:0 "(Внутренняя) ставка по облигациям"
  concept_interest_value_domestic_desc:0 "[concept_interest_value_domestic] — ставка, по которой рассчитываются проценты по деньгам, которые ваше население одалживает государству при отрицательном бюджете (ванильная механика)."
  concept_interest_value_domestic_s:0 "ВСО"
  concept_interest_value_domestic_s_desc:0 "[concept_interest_value_domestic] — ставка, по которой рассчитываются проценты по деньгам, которые ваше население одалживает государству при отрицательном бюджете (ванильная механика)."

  concept_base_rate_percentage:0 "Ключевая ставка"
  concept_base_rate_percentage_desc:0 "[concept_base_rate_percentage] — это процентная ставка центрального банка (учётная, дисконтная или ключевая ставка), позволяющая замедлить рост денежной массы за счёт сокращения кредитов, выдаваемых частным банкам. Её повышение замедляет экономику и объём производимой денежной массы. Наоборот, её снижение сильно стимулирует экономику и позволяет появиться частному капиталистическому сектору."
  concept_base_rate_percentage_s:0 "КС"
  concept_base_rate_percentage_s_desc:0 "[concept_base_rate_percentage] — это процентная ставка центрального банка (учётная, дисконтная или ключевая ставка), позволяющая замедлить рост денежной массы за счёт сокращения кредитов, выдаваемых частным банкам. Её повышение замедляет экономику и объём производимой денежной массы. Наоборот, её снижение сильно стимулирует экономику и позволяет появиться частному капиталистическому сектору."

  concept_base_interest_value_5Y:0 "(Международная) краткосрочная ставка по облигациям (5 лет)"
  concept_base_interest_value_5Y_desc:0 "[concept_base_interest_value_5Y] — процентная ставка по золотому кредиту, полученному вашим центральным банком от иностранного инвестора."
  concept_base_interest_value_5Y_s:0 "КСО"
  concept_base_interest_value_5Y_s_desc:0 "[concept_base_interest_value_5Y] — процентная ставка по золотому кредиту, полученному вашим центральным банком от иностранного инвестора."

  concept_base_interest_value_10Y:0 "(Международная) долгосрочная ставка по облигациям (10 лет)"
  concept_base_interest_value_10Y_desc:0 "[concept_base_interest_value_10Y] — процентная ставка по золотому кредиту, полученному вашим центральным банком от иностранного инвестора; эта же ставка применяется, если вы берёте золотой кредит в своём центральном банке."

  concept_base_interest_value_10Y_s:0 "ДСО"
  concept_base_interest_value_10Y_s_desc:0  "[concept_base_interest_value_10Y] — процентная ставка по золотому кредиту, полученному вашим центральным банком от иностранного инвестора; эта же ставка применяется, если вы берёте золотой кредит в своём центральном банке."

  concept_credit_flow_rate:0 "Темп кредитного потока"
  concept_credit_flow_rate_desc:0 "Показатель [concept_credit_flow_rate] измеряет чистое изменение объёма кредита в инвестиционном пуле.\n\n - Положительный темп указывает на расширение кредита и выражается как процент от денежной массы.\n - Отрицательный темп указывает на сокращение кредита и выражается как процент от инвестиционного пула.\n\n Показатель нейтрален, когда ключевая ставка находится в диапазоне 6%–7%.\n Ниже 6% он становится положительным и стимулирует расширение кредита; выше 7% — становится отрицательным и приводит к сокращению пула."

  concept_private_credit_ceiling:0 "Верхний предел частного кредита"
  concept_private_credit_ceiling_desc:0 "Рекомендуемый [concept_private_credit_ceiling] представляет собой максимальную устойчивую долю денежной массы, которая должна находиться у частных банков. За этим порогом дальнейшее расширение частного кредита становится дестабилизирующим, повышая риск давления на резервы, чрезмерного кредитного плеча и финансовых дисбалансов. Это значение может быть превышено"

  concept_private_credit_floor:0 "Нижний предел частного кредита"
  concept_private_credit_floor_desc:0 "Рекомендуемый [concept_private_credit_floor] представляет собой минимальную здоровую долю денежной массы, которая должна оставаться у частных банков. Падение ниже этого порога сигнализирует о недостаточной кредитной активности, ослаблении финансового посредничества и риске экономической стагнации. Это значение может быть превышено"

  concept_maximum_number_companies:0 "Максимальное количество компаний"
  concept_maximum_number_companies_desc:0 "[concept_maximum_number_companies]: представляет собой верхний предел числа предприятий, которое может поддерживать национальная финансовая система. Этот предел определяется суммой всех уровней финансовых центров с поправкой на множитель (1 – ключевая ставка).\n\nБолее низкая ключевая ставка позволяет работать большему числу предприятий, тогда как более высокая ограничивает эту способность.\n\nЕсли число существующих предприятий превышает этот порог, компании сверх лимита будут случайным образом разоряться из-за недостаточной кредитной поддержки."

concept_maximum_pcs_capacity:0 "Максимальная мощность частного строительного сектора" 
concept_maximum_pcs_capacity_desc:0 "[concept_maximum_pcs_capacity]: представляет собой теоретически максимальный уровень [GetBuildingType('building_ef_private_construction').GetName], который способна поддерживать национальная экономика. Этот предел определяется общей суммой уровней городских центров в стране с поправкой на множитель (1 – ключевая ставка).\n\n Более низкая ключевая ставка повышает эффективность строительной системы и позволяет работать большему числу [GetBuildingType('building_ef_private_construction').GetName], тогда как более высокая снижает эту мощность.\n\n Если число действующих частных строительных секторов превышает этот порог, избыточные сектора будут простаивать или приходить в упадок из-за нехватки кредита и финансирования строительства."


concept_inflation_genrated:0 "Создаваемая инфляция" 
concept_inflation_genrated_desc:0 "Если резервы #v [GetPlayer.GetCustom('currency_name')] [GetPlayer.GetCustom('currency_symbol')]#!, находящиеся у [GetBuildingType('building_bank').GetName], опускаются ниже #v 10%#!, эффекты политики девальвации или ревальвации перестают влиять на [concept_inflation_value]. Это происходит потому, что резервы, которыми управляет центральный банк, слишком малы относительно общей денежной массы, чтобы заметно влиять на инфляцию"





