international_loans_event.1.f:0 "'Не знаю, друг мой. Здесь каждому что-то нравится, а что-то нет. Ты уверен, что мы сможем заставить буржуазных свиней согласиться?'\n\n'Не волнуйся, как говорит мудрец: нравственность терпит поражение, когда запах больших денег сильнее самой нравственности'."
