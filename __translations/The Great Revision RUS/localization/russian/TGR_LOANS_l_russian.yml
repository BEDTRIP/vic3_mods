je_international_loans: "Денежно-кредитная политика"
je_international_loans_reason: "С наступлением нового века важность #bold; финансового сектора#! становится все очевиднее. Доступ к займам позволит нам активнее инвестировать в нашу экономику.\nНо чтобы получить выгодный [concept_credit], мы должны обеспечить нашей стране репутацию надежной — как #b внутри страны#!, так и #b на международной арене#!.\n\nНачальная #red;bold; национальная процентная ставка#! составляет #red;bold; 25%#!, однако каждая #green;bold; переменная#!, которую вы выполните, снизит процентную ставку. Стабильные #b правительство#! и #b экономика#! гарантируют, что мы сможем занимать деньги на выгодных условиях.\n\n#b #green;bold; Переменные#!, уменьшающие #red;bold; национальную процентную ставку#!:\n#bold; Законы#!\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_no_slavery_countries_checkbox')] Принят [concept_law] [GetLawType('law_slavery_banned').GetName]\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_economic_system_checkbox')] НЕ принят [concept_law] [GetLawType('law_traditionalism').GetName]\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_trade_policy_checkbox')] НЕ принят [concept_law] [GetLawType('law_isolationism').GetName]\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_communist_countries_checkbox')] НЕ принят [concept_law] [GetLawType('law_cooperative_ownership').GetName]\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_no_autocratic_countries_checkbox')] НЕ принят [concept_law] [GetLawType('law_autocracy').GetName]\n\n#bold; Экономика#!\n• #green;bold; -3%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_positive_cash_reserve_checkbox')] Положительный фиксированный недельный доход > 50 тыс.\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_positive_cashflow_checkbox')] Отсутствует дефицит бюджета\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_positive_investment_pool_cashflow_checkbox')] Недельный чистый доход [concept_investment_pool] > 50k \n• #green;bold; -2%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_debt_checkbox')] Всего [concept_loans] < 25%\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_gdp_ranking_checkbox')] [concept_gdp] в топ-10\n\n#bold; Политика#!\n• #green;bold; -2%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_legittimacy_checkbox')] [concept_legitimacy] > 90\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_infamy_checkbox')] [concept_infamy] < 25\n• #green;bold; -2%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_political_movement_radicalism_checkbox')] НЕТ ни одного [concept_political_movement] с [concept_activism] > 25%\n• #green;bold; -3%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_is_at_war_checkbox')] [ROOT.GetCountry.GetNameNoFlag] НЕ находится в состоянии войны\n• #green;bold; -1%#! [SCOPE.GetRootScope.GetCountry.GetCustom('great_revision_country_radicals_checkbox')] Доля [Concept('concept_radical','$concept_radicals$')] в [Concept('concept_country', '$concept_country$')] < 20%"

