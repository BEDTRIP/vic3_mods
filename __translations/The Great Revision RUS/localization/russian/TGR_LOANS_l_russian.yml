tgr_loans_button_1: "Принять #yellow;bold; Закон о банковском соглашении#!"
tgr_loans_button_1_desc: "Идёт на уступки частным банкам ради доступа к субсидированному кредиту."
tgr_loans_button_1_modifier_tooltip: "Это действие снизит #red;bold; Национальную процентную ставку#! на #green;bold; -2%#!."

tgr_loans_button_4: "Принять #yellow;bold; Закон об интервенционизме#!"
tgr_loans_button_4_desc: "Чтобы исправить неэффективность частного сектора, этот указ позволит государству вмешиваться более напрямую — ценой некоторых ограничений для частного сектора."
tgr_loans_button_4_modifier_tooltip_1: "Это действие снизит #red;bold; Национальную процентную ставку#! на #green;bold; -2%#!."

tgr_loans_button_3: "Принять #yellow;bold; Закон о налоге на инвестиции#!"
tgr_loans_button_3_desc: "Вводит чрезвычайный налог на инвестированный капитал для покрытия государственного дефицита."
tgr_loans_button_3_modifier_tooltip_1: "Вы введёте налог в размере #green;bold; 25%#! от общей стоимости [concept_investment_pool]. #red;bold; Это разгневает инвесторов#!."
tgr_loans_button_3_modifier_tooltip_2: "Это действие повысит #red;bold; Национальную процентную ставку#! на #red;bold; 3%#!."

tgr_loans_button_5: "Принять #yellow;bold; Закон о национальной приватизации#!"
tgr_loans_button_5_desc: "Вводит чрезвычайный указ о приватизации [concept_nationally_owned] [concept_building_level]."
tgr_loans_button_5_modifier_tooltip_1: "Вы инициируете период [Concept('concept_privatize','$concept_privatization$')], чтобы попытаться сократить #red;bold; Государственный долг#!."
tgr_loans_button_5_modifier_tooltip_2: "Это действие снизит #red;bold; Национальную процентную ставку#! на #green;bold; -5%#!."

tgr_loans_button_7: "Стимулирует внутренние #yellow;bold; Инвестиции#!"
tgr_loans_button_7_desc: "Чтобы стимулировать внутренний рост, мы можем побудить мелких и крупных инвесторов не удерживать капитал, а вкладывать его на внутреннем рынке."
tgr_loans_button_7_modifier_tooltip_1: "Это действие снизит #red;bold; Национальную процентную ставку#! на #green;bold; -3%#!."
tgr_loans_button_7_modifier_tooltip_2: "#yellow;bold; Инвесторы#! вложат в рынок больше капитала. Это приведёт к смещению баланса от #red;bold; потребления#! к #green;bold; инвестициям#!, с небольшим снижением #red;bold; ВВП#! в краткосрочной перспективе."

tgr_loans_button_8: "Стимулирует внутреннее #yellow;bold; Потребление#!"
tgr_loans_button_8_desc: "Мы можем сдержать экономический рост, усложнив инвестирование в новые проекты. Это сместит капитал от инвестиций в сторону роста внутреннего потребления."
tgr_loans_button_8_modifier_tooltip_1: "Это действие снизит #red;bold; Национальную процентную ставку#! на #green;bold; -1%#!."
tgr_loans_button_8_modifier_tooltip_2: "#yellow;bold; Инвесторы#! выведут капитал с рынка. Это приведёт к смещению баланса от #red;bold; инвестиций#! к #green;bold; потреблению#!, с небольшим ростом #green;bold; ВВП#! в краткосрочной перспективе."

tgr_loans_button_2: "Выпустить #bold; небольшие#! #yellow;bold; государственные облигации#!"
tgr_loans_button_2_desc: "Использует инструменты Центрального банка для выпуска облигаций с целью финансирования государственного аппарата"
tgr_loans_button_2_modifier_tooltip_1: "Вы получите заём в размере #green;bold; 5%#! от вашего [concept_gdp], распределённый на #yellow;bold; 10 лет#!, со ставкой, зависящей от вашей #red;bold; Национальной процентной ставки#!."
tgr_loans_button_2_modifier_tooltip_2: "Это действие повысит #red;bold; Национальную процентную ставку#! на #red;bold; 1%#!."

tgr_loans_button_6: "Выпустить #bold; крупные#! #yellow;bold; государственные облигации#!"
tgr_loans_button_6_desc: "Использует инструменты Центрального банка для выпуска облигаций с целью финансирования государственного аппарата"
tgr_loans_button_6_modifier_tooltip_1: "Вы получите заём в размере #green;bold; 10%#! от вашего [concept_gdp], распределённый на #yellow;bold; 10 лет#!, со ставкой, зависящей от вашей #red;bold; Национальной процентной ставки#!."
tgr_loans_button_6_modifier_tooltip_2: "Это действие повысит #red;bold; Национальную процентную ставку#! на #red;bold; 2%#!."

