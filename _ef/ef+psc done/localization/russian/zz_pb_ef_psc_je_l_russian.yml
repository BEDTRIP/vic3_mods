  speculative_share_11_button_desc: "Правительство стремится стимулировать частное строительство, снизив базовую ставку, что приведёт к строительству #b 15 [GetBuildingType('building_construction_sector').GetName]#!. Этот проект создаст денежную массу в размере #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_15_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')], что соответствует #b 5%#! средств частных банков, умноженным на коэффициент редкости Сектора частного строительства #b (Rarety Facto:[GetPlayer.MakeScope.ScriptValue('rarity_factor')|D])#!. Чрезмерное денежное расширение может привести к риску дестабилизации валюты и запуску «Перестроенной экономики»."
  speculative_share_12_button_desc: "Правительство стремится стимулировать частное строительство, снизив базовую ставку, что приведёт к строительству #b 20 [GetBuildingType('building_construction_sector').GetName]#!. Этот проект создаст денежную массу в размере #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_20_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')], что соответствует #b 12%#! средств частных банков, умноженным на коэффициент редкости Сектора частного строительства #b (Rarety Facto:[GetPlayer.MakeScope.ScriptValue('rarity_factor')|D])#!. Чрезмерное денежное расширение может привести к риску дестабилизации валюты и запуску «Перестроенной экономики»."
