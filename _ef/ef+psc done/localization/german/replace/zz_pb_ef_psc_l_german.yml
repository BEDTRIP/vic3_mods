# pb+ef: hand-authored strings for the E&F + PSC compatch.
#
# LIVES IN replace/ (2026-09-24). Localization is first-come: the first file
# that defines a key wins, whatever the mod order, and E&F (or the V4 RUS
# translation, which overrides E&F by identical file names) defines these
# keys first. Files under localization/<lang>/replace/ override existing keys
# -- the mechanism Morgenroete uses on vanilla strings. Before the move this
# file was dead weight.
#
# Everything here needs human wording, so it is NOT regenerated by
# tools/regen_ef_psc_copies.py -- that script only does the mechanical
# building_ef_private_construction -> building_construction_sector rename and
# it deliberately skips these keys.
#
# concept_*_desc            : our own concepts, E&F has no text for them.
# financial_center_je_2_reason : empty -- the journal sections explain
#                             themselves (EF.18 v2, zz_pb_ef_fso_widgets.gui).
# speculative_share_*_tt_2  : reworded for the compatch's cap check. E&F asks
#                             "is there room for one more sector"; the effect
#                             builds 5/10/15/20 at once, so pb+ef checks
#                             pcs_construction_sector_headroom_by_base_rate
#                             instead (zz_pb_ef_remap_pcs_values.txt).
#
# NOTE: the level readout must call ScriptValue('building_ef_private_construction_lvl').
# That is E&F's key name, remapped by the compatch to sum building_construction_sector.
# An earlier build used 'building_construction_sector_lvl' in the Russian file --
# no such script_value exists, so the number rendered empty.

l_german:
  concept_building_urban_center_lvl_by_base_rate_desc:1 "The maximum level of [GetBuildingType('building_construction_sector').GetName] is the total level of [GetBuildingType('building_urban_center').GetName] in the country × (1 − 5 × [concept_base_rate_percentage]). At a rate of 1% it is 95% of the urban centres, at 6% — 70%, at 12% — 40%, at 20% or more — zero."
  concept_maximum_pcs_capacity_desc:0 "[concept_maximum_pcs_capacity]: the theoretical maximum level of [GetBuildingType('building_construction_sector').GetName] the national economy can sustain — the total level of [GetBuildingType('building_urban_center').GetName] × (1 − 5 × [concept_base_rate_percentage]).\n\n A low base rate lets more [GetBuildingType('building_construction_sector').GetName] work; a high one shrinks the capacity.\n\n If the actual level exceeds it, the country has overcapacity: the overcapacity index moves towards its target (1 − limit / sectors) and cuts the construction sectors' throughput."

  # Empty: each journal section explains itself (gui/scripted_widgets/zz_pb_ef_fso_widgets.gui).
  financial_center_je_2_reason:0 ""
  # 2026-09-25: stimulus buttons 9-12 reworked (scripted_guis/zz_pb_ef_speculative_pcs_sguis.txt)
  speculative_share_9_button_desc: "The government stimulates private construction by cutting the base rate by #b 1%#!. Cheap credit loads construction beyond what the economy can carry: the overbuilt economy penalty rises by #b 10#! points and then returns to its target."
  speculative_share_9_button_tt_1: "Overbuilt economy penalty below #b 90#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_9_button_tt_effect_1_1: "- $speculative_share_9_button_tt_effect_1$\n- Overbuilt economy penalty #r +10#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('down_base_rate').GetName|v] for 6 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_6').GetName|v] for 12 months"
  zz_pb_ef_stimulus_off_tt: "#N Switched off:#! under the central bank's rate (EF.30) the cut is walked back; the buttons will be reworked (STR.4)."
  speculative_share_9_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_9_button$\n\n$speculative_share_9_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_9_button_tt_1$\n- $speculative_share_9_button_tt_3$\n\nEffect:\n$speculative_share_9_button_tt_effect_1_1$"
  speculative_share_10_button_desc: "The government stimulates private construction by cutting the base rate by #b 2%#!. The easing creates a monetary mass of #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_10_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 2%#! of private bank funds, adjusted for rarity), locked in a governmental fund. Cheap credit loads construction beyond what the economy can carry: the overbuilt economy penalty rises by #b 20#! points and then returns to its target."
  speculative_share_10_button_tt_1: "Overbuilt economy penalty below #b 80#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_10_button_tt_effect_1_1: "- $speculative_share_10_button_tt_effect_1$\n- $speculative_share_10_button_tt_effect_2$\n- Overbuilt economy penalty #r +20#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('down_base_rate').GetName|v] for 6 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_6').GetName|v] for 12 months"
  speculative_share_10_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_10_button$\n\n$speculative_share_10_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_10_button_tt_1$\n- $speculative_share_10_button_tt_3$\n\nEffect:\n$speculative_share_10_button_tt_effect_1_1$"
  speculative_share_11_button_desc: "The government stimulates private construction by cutting the base rate by #b 3%#!. The easing creates a monetary mass of #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_15_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 5%#! of private bank funds, adjusted for rarity), locked in a governmental fund. Cheap credit loads construction beyond what the economy can carry: the overbuilt economy penalty rises by #b 30#! points and then returns to its target."
  speculative_share_11_button_tt_1: "Overbuilt economy penalty below #b 70#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_11_button_tt_effect_1_1: "- $speculative_share_11_button_tt_effect_1$\n- $speculative_share_11_button_tt_effect_2$\n- Overbuilt economy penalty #r +30#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('down_base_rate').GetName|v] for 6 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_6').GetName|v] for 12 months"
  speculative_share_11_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_11_button$\n\n$speculative_share_11_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_11_button_tt_1$\n- $speculative_share_11_button_tt_3$\n\nEffect:\n$speculative_share_11_button_tt_effect_1_1$"
  speculative_share_12_button_desc: "The government stimulates private construction by cutting the base rate by #b 4%#!. The easing creates a monetary mass of #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_20_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 12%#! of private bank funds, adjusted for rarity), locked in a governmental fund. Cheap credit loads construction beyond what the economy can carry: the overbuilt economy penalty rises by #b 40#! points and then returns to its target."
  speculative_share_12_button_tt_1: "Overbuilt economy penalty below #b 60#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_12_button_tt_effect_1_1: "- $speculative_share_12_button_tt_effect_1$\n- $speculative_share_12_button_tt_effect_2$\n- Overbuilt economy penalty #r +40#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('down_base_rate').GetName|v] for 6 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_6').GetName|v] for 12 months"
  speculative_share_12_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_12_button$\n\n$speculative_share_12_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_12_button_tt_1$\n- $speculative_share_12_button_tt_3$\n\nEffect:\n$speculative_share_12_button_tt_effect_1_1$"
