# pb+ef: hand-authored strings for the E&F + PSC compatch.
#
# Everything here needs human wording, so it is NOT regenerated by
# tools/regen_ef_psc_copies.py -- that script only does the mechanical
# building_ef_private_construction -> building_construction_sector rename and
# it deliberately skips these keys.
#
# concept_*_desc            : our own concepts, E&F has no text for them.
# speculative_share_*_tt_2  : reworded for the compatch's cap check. E&F asks
#                             "is there room for one more sector"; the effect
#                             builds 5/10/15/20 at once, so pb+ef checks
#                             pcs_construction_sector_headroom_by_base_rate
#                             instead (zz_pb_ef_remap_pcs_values.txt).
#
# NOTE: the level readout must call ScriptValue('building_ef_private_construction_lvl').
# That is E&F's key name, remapped by the compatch to sum building_construction_sector.
# An earlier build used 'building_construction_sector_lvl' in the Russian file --
# no such script_value exists, so the number rendered empty.

l_japanese:
  concept_building_urban_center_lvl_by_base_rate_desc:1 "The maximum level of [GetBuildingType('building_construction_sector').GetName] is determined by the number of [GetBuildingType('building_urban_center').GetName] present in the state and by the [concept_base_rate_percentage]. For a [concept_base_rate_percentage] of 1% or less than 1%, the maximum level is the number of [GetBuildingType('building_urban_center').GetName]. For a [concept_base_rate_percentage] of 10%, the maximum level of [GetBuildingType('building_construction_sector').GetName] is 1."
  concept_maximum_pcs_capacity_desc:0 "The [concept_maximum_pcs_capacity]: represents the theoretical maximum level of [GetBuildingType('building_construction_sector').GetName] that the national economy can sustain. This limit is determined by the total sum of Urban Center levels within the country, adjusted by the factor (1 – base rate).\n\n Lower base rates increase the construction system’s efficiency and allow more [GetBuildingType('building_construction_sector').GetName] to operate, while higher base rates reduce this capacity.\n\n If the active number of CS exceeds this threshold, excess sectors will stall or collapse due to insufficient credit and construction financing."
  speculative_share_9_button_tt_2: "The total level of [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 5#! from the stimulus is below the theoretical limit of #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_10_button_tt_2: "The total level of [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 10#! from the stimulus is below the theoretical limit of #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_11_button_tt_2: "The total level of [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 15#! from the stimulus is below the theoretical limit of #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"
  speculative_share_12_button_tt_2: "The total level of [GetBuildingType('building_construction_sector').GetName] #b [GetPlayer.MakeScope.ScriptValue('building_ef_private_construction_lvl')]#! + #b 20#! from the stimulus is below the theoretical limit of #b [GetPlayer.MakeScope.ScriptValue('building_urban_center_lvl_by_base_rate')]#!"

# The Overbuilt Economy counter is held at 0 by the compatch, so this is the only
# status_speculative_share_2_* tier the player will ever see. Re-word it rather
# than leave E&F's "Dormant Sector" text, which would read as a live diagnosis.
 status_speculative_share_2_1:0 "\n Construction: #green Overbuilt Economy: disabled by this compatch#! — PSC already bills the treasury and the investment pool for every construction good consumed, so E&F's second penalty for the same over-building is switched off. See common/on_actions/zz_pb_ef_psc_overbuilt_off.txt."
