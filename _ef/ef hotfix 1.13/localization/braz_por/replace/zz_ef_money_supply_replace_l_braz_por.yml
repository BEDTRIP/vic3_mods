ble;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_banks Bank funds#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_pool')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][GetPlayer.GetCustom('currency_symbol')])\n       deposits [GetPlayer.MakeScope.ScriptValue('zz_ef_deposits')|D] [GetPlayer.GetCustom('currency_symbol')], bank credit [GetPlayer.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [GetPlayer.GetCustom('currency_symbol')]: ×[GetPlayer.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2] of deposits, target ×[GetPlayer.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2]\n   Money multiplier M2 / M0: ×[GetPlayer.MakeScope.ScriptValue('zz_ef_m2_to_m0')|2]\n - Owned by other countries: #T [GetPlayer.MakeScope.ScriptValue('money_supply_stockpile_by_other_country')|D] [GetPlayer.GetCustom('currency_symbol')]#!\nGovernment debt (not money): budget debt [GetPlayer.MakeScope.ScriptValue('zz_ef_debt_principal')|D] [GetPlayer.GetCustom('currency_symbol')], to the central bank [GetPlayer.MakeScope.ScriptValue('zz_ef_debt_cb_gold')|D] @gold!\n#italic Hover an account for all its transfers this month.#!\n\n#b Reconciliation — engine raw numbers, weekly:#!\nfixed income [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_fixed_income')|D], total income [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_total_income')|D], income (engine) [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_income')|D], minting [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_minting_week')|D], fixed expenses [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_fixed_expenses')|D], total expenses [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_total_expenses')|D], military [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_military')|D], treaty transfers [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_transfers_out')|D], tax waste [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_tax_waste')|D], pool: gross income [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_pool_gross')|D], pool: net income [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_pool_net')|D]\nexports [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_export_gold')|D] @gold!, imports [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_import_gold')|D] @gold!, GDP per year [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_gdp')|D]\n$TOOLTIP_DELIMITER$"
 zz_ef_ms_tt_savings:0 "#b Pop savings this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Treasury\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_1')|D] [Country.GetCustom('currency_symbol')]#! taxes (estimate)\n2 Business cash\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_1')|D] [Country.GetCustom('currency_symbol')]#! purchases of goods\n3 Bank funds\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_1')|D] [Country.GetCustom('currency_symbol')]#! deposit withdrawals\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_2')|D] [Country.GetCustom('currency_symbol')]#! deposits\n4 Central bank reserves\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_1')|D] [Country.GetCustom('currency_symbol')]#! market demand for the currency — the country's share\n5 Outside the accounts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_1')|D] [Country.GetCustom('currency_symbol')]#! cut above 2 × GDP\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_2')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_3')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n\nCash held by pops — a model: pops hold no money in the engine. Taxes and purchases are an estimate (GDP / 12 − pool contributions; the taxes' share — budget income without minting).\nPops' outlays per month: [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = GDP / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − pool contributions [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('currency_symbol')]; spent from savings [Country.MakeScope.ScriptValue('zz_ef_v_f_outflow')|D] [Country.GetCustom('currency_symbol')]."
 zz_ef_ms_tt_treasury:0 "#b Treasury this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Pop savings\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_savings_1')|D] [Country.GetCustom('currency_symbol')]#! taxes from savings (estimate)\n2 Business cash\n  no transfers visible to scripts\n3 Bank funds\n  no transfers visible to scripts\n4 Central bank reserves\n  no transfers visible to scripts\n5 Outside the accounts\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_1')|D] [Country.GetCustom('currency_symbol')]#! minting — new money\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_2')|D] [Country.GetCustom('currency_symbol')]#! other budget income\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_3')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_4')|D] [Country.GetCustom('currency_symbol')]#! budget expenses and other\n\nState money, part of M0. The full budget: Money in the top bar."
 zz_ef_ms_tt_buildings:0 "#b Business cash this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Pop savings\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_savings_1')|D] [Country.GetCustom('currency_symbol')]#! pops' purchases\n2 Treasury\n  no transfers visible to scripts\n3 Bank funds\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_banks_1')|D] [Country.GetCustom('currency_symbol')]#! construction from the pool\n4 Central bank reserves\n  no transfers visible to scripts\n5 Outside the accounts\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_1')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_2')|D] [Country.GetCustom('currency_symbol')]#! wages, dividends, purchases, imports and other\n\nBuildings' cash reserves: credit limit − base − GDP share (COUNTRY_MIN_CREDIT_*)."
 zz_ef_ms_tt_banks:0 "#b Bank funds this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Pop savings\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_1')|D] [Country.GetCustom('currency_symbol')]#! deposits\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_2')|D] [Country.GetCustom('currency_symbol')]#! deposit withdrawals\n2 Treasury\n  no transfers visible to scripts\n3 Business cash\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_buildings_1')|D] [Country.GetCustom('currency_symbol')]#! construction — private and via the treasury\n4 Central bank reserves\n  no transfers visible to scripts\n5 Outside the accounts\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_1')|D] [Country.GetCustom('currency_symbol')]#! new bank credit\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_2')|D] [Country.GetCustom('currency_symbol')]#! pool contributions — pops and buildings (vanilla)\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_3')|D] [Country.GetCustom('currency_symbol')]#! credit contraction\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_4')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_5')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n\nBanks steer their funds to deposits × multiplier (×3 at 2%, ×1.2 at 12%).\nDeposits [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')], bank credit [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]: now ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], target ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] at a rate of [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Central bank reserves this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Pop savings\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_savings_1')|D] [Country.GetCustom('currency_symbol')]#! into circulation: market demand — the country's share\n2 Treasury\n  no transfers visible to scripts\n3 Business cash\n  no transfers visible to scripts\n4 Bank funds\n  no transfers visible to scripts\n5 Outside the accounts\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_1')|D] [Country.GetCustom('currency_symbol')]#! issue: sales of the currency good on the market\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_2')|D] [Country.GetCustom('currency_symbol')]#! into circulation: other countries of the market\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_3')|D] [Country.GetCustom('currency_symbol')]#! devaluation\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_4')|D] [Country.GetCustom('currency_symbol')]#! revaluation\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_5')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_6')|D] [Country.GetCustom('currency_symbol')]#! other — not visible to scripts\n\nCurrency held by the central bank, out of circulation. Issue and demand: the currency good's market this month (E&F, market owner)."
