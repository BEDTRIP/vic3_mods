 zz_ef_ms_check_02:0 "Debts (not money): budget $zz_ef_ms_x_debt_principal$ $zz_ef_ms_cur$, banks to the CB $zz_ef_ms_x_bank_cb_debt$ $zz_ef_ms_cur$, consumer credit $zz_ef_ms_x_cc_debt$ $zz_ef_ms_cur$, business $zz_ef_ms_x_bc_debt$ $zz_ef_ms_cur$"
 zz_ef_ms_check_03:0 "#b Reconciliation — engine raw numbers, weekly:#!"
 zz_ef_ms_check_04:0 "GUI → script bridge: budget lines outside the accounts recorded $zz_ef_ms_x_v_f_ext$, now $zz_ef_ms_x_v_f_mint_tr_rest$; M2 leak this week $zz_ef_ms_x_v_f_leak$ (this week's data: $zz_ef_ms_x_hook_ok$; queued $zz_ef_ms_x_expr_36$; bridge calls in total $zz_ef_ms_x_hook_calls$, probe $zz_ef_ms_x_hook_probe_calls$)"
 zz_ef_ms_check_05:0 "settled / forecast: income tax $zz_ef_ms_x_expr_37$ / [Country.GetIncomeTaxIncome|D]; total income $zz_ef_ms_x_raw_total_income$ / [Country.PredictWeeklyIncome|D]; pool transfer $zz_ef_ms_x_v_f_transfer_2$ / $zz_ef_ms_x_pool_transfer_week$ / [Country.GetInvestmentIncome|D]"
 zz_ef_ms_check_06:0 "fixed income $zz_ef_ms_x_raw_fixed_income$, total income $zz_ef_ms_x_raw_total_income$, minting $zz_ef_ms_x_raw_minting_week$, fixed expenses $zz_ef_ms_x_raw_fixed_expenses$, total expenses $zz_ef_ms_x_raw_total_expenses$, military $zz_ef_ms_x_raw_military$, pool: gross income $zz_ef_ms_x_raw_pool_gross$, pool: net income $zz_ef_ms_x_raw_pool_net$; GDP per year $zz_ef_ms_x_raw_gdp$"
 zz_ef_ms_check_07:0 "#grey Marks: eng — the engine's number as is (budget, cash, pool); mod — money the mod moved (deposits, credit, metal); calc — derived from other numbers (money conservation, residual, revaluation); est — an estimate (wages = GDP / 52); E&F — an E&F variable (bonds).#!"

 # ---- deposits ----
 zz_ef_ms_deposits_01:0 "#b Bank deposits this week: $zz_ef_ms_x_v_d_deposits$$zz_ef_ms_cur$#! #grey mod#!"
 zz_ef_ms_deposits_02:0 "  ← #P +$zz_ef_ms_x_v_w_dep_in$ $zz_ef_ms_cur$#! #grey mod#! deposited from cash"
 zz_ef_ms_deposits_03:0 "  → #N −$zz_ef_ms_x_v_w_dep_out$ $zz_ef_ms_cur$#! #grey mod#! withdrawn to cash"
 zz_ef_ms_deposits_04:0 "  ← #P +$zz_ef_ms_x_v_w_dep_int_2$ $zz_ef_ms_cur$#! #grey mod#! interest (the banks pay it from the pool)"
 zz_ef_ms_deposits_05:0 "  ↔ $zz_ef_ms_x_v_d_deposits_rest$ $zz_ef_ms_cur$ #grey calc#! other"
 zz_ef_ms_deposits_06:0 "Deposits are the banks' debt to pops; the money is in the banks' reserves (the pool) and in their loans. Deposit rate $zz_ef_ms_x_deposit_rate$ = key − the banks' margin $zz_ef_ms_x_deposit_margin$."

