 INFLATION_BALANCE:0 "Current: #n [Country.MakeScope.ScriptValue('inflation_value')|%|=-]#! — the consumer basket's price growth over a year (index [Country.MakeScope.ScriptValue('zz_ef_price_index')|1], 100 = 1836 prices); compare: M2 growth [Country.MakeScope.ScriptValue('zz_ef_circ_growth_year')|%1=+], GDP [Country.MakeScope.ScriptValue('zz_ef_gdp_growth_year')|%1=+] a year.\nE&F's breakdown (goods, energy, "currency value change") is hidden: it was the old formula and did not add up to the total.\n$TOOLTIP_DELIMITER$"
