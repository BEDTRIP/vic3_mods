l_german:
 MONEY_VALUE_INFO_silver_standard:0 "Current index with inflation/deflation: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_rapported_inflation')]#! @silver! ([Country.MakeScope.ScriptValue('inflation_value')|%|=-] @inflation!)\nValue: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_0')|4]#! @silver! — parity #T [Country.MakeScope.ScriptValue('zz_ef_cb_valuation')|4]#! @silver! (strength against the reference [Country.MakeScope.ScriptValue('zz_ef_currency_strength')|2])\nCover: the CB's reserves at parity / M2 = #T [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]#! (norm 40%). While the cover is 25% or more, notes are redeemed in metal and the value stays at the parity (±2%); under 25% redemption is suspended: value = parity × cover / 40%.\n$TOOLTIP_DELIMITER$"
 NATIONAL_CAPACITY_DESC_silver_standard:0 "CB reserves:\nTotal #v reserves#!: [Country.MakeScope.ScriptValue('national_capacity')|D] @silver! = #T [Country.MakeScope.ScriptValue('zz_ef_cb_money')|D]#! [Country.GetCustom('currency_symbol')] at parity\n- metal in the CB's vault: #T [Country.MakeScope.ScriptValue('central_bank_metal_reserves_state')|D]#! @silver!\n- foreign currency in the reserves (at its value, in metal): #T [Country.MakeScope.ScriptValue('zz_ef_v_fx_metal')|D]#! @silver!\nNot reserves: gold pledged abroad (debt collateral) — [Country.MakeScope.Var('gold_loaned_to_central_bank_fix').GetValue|D] @gold!\n$TOOLTIP_DELIMITER$"
