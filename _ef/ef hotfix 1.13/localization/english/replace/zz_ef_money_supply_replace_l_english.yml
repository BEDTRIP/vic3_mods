 the accounts\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_pool'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_transfer'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_in'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_out'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_int'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0'))|D+=] [Country.GetCustom('currency_symbol')] other\n\nThe investment pool. Private construction goes through the treasury: pool → treasury (transfer) → businesses (construction goods). Banks keep several months of contributions in the pool (12 at 2%, 3 at 12%): below it they borrow from the CB at the key rate, above it they repay.\nBanks' debt to the CB [Country.MakeScope.ScriptValue('zz_ef_bank_cb_debt')|D] [Country.GetCustom('currency_symbol')]; pool target [Country.MakeScope.ScriptValue('zz_ef_pool_target')|D] [Country.GetCustom('currency_symbol')] = a month's contributions × [Country.MakeScope.ScriptValue('zz_ef_credit_months')|1] months at a rate of [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]; they borrow and repay 1.15% of the gap a week (~5% a month)."
 zz_ef_ms_tt_pops:0 "#b Pops this week#!\n1 Treasury\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_income_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_poll_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_consumption_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_dividends_taxes]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_government_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_military_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_welfare_payments]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_interest] — to the debt holders (owners of the buildings' reserves)\n2 Business cash\n  ← #P +[Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! wages and dividends (estimate: GDP / 52 − state pay)\n  → #N −[Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend)), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend)))), Negate_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0'))), Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0'))|D] [Country.GetCustom('currency_symbol')]#! purchases of goods — the rest of the income (estimate)\n3 Outside the accounts\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! into savings: money that dropped out of the engine's money (exact, merged: income left over and payments abroad inside the market)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! from savings: more came back into the engine's money than dropped out\n\nPops hold no money in the engine: it turns the income left over into wealth (a number). The mod catches this money into savings — exact, by money conservation (the GUI → script bridge), but merged with payments abroad inside the market. Part of the savings is in deposits — engine money again (the pool).\nPops' income ≈ GDP / 52 = [Country.MakeScope.ScriptValue('zz_ef_gdp_week')|D] [Country.GetCustom('currency_symbol')].\n#b Savings: [Country.MakeScope.ScriptValue('zz_ef_pop_savings')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_pop_savings_week')|D+=][Country.GetCustom('currency_symbol')] this week) — in deposits [Country.MakeScope.ScriptValue('zz_ef_pop_deposits')|D] [Country.GetCustom('currency_symbol')], at hand [Country.MakeScope.ScriptValue('zz_ef_pop_cash')|D] [Country.GetCustom('currency_symbol')]. This week: dropped out of the engine's money [Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')|D+=][Country.GetCustom('currency_symbol')], deposit interest [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_int')|D+=][Country.GetCustom('currency_symbol')]; deposited [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_in')|D] [Country.GetCustom('currency_symbol')], withdrawn [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_out')|D] [Country.GetCustom('currency_symbol')]. Deposit share target [Country.MakeScope.ScriptValue('zz_ef_deposit_share')|%0] (by the rate), deposit rate [Country.MakeScope.ScriptValue('zz_ef_deposit_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Central bank this week#!\n1 Treasury\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! the CB's profit: banks' interest\n2 Bank funds\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! credit to banks at the key rate\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! repayment of the CB's credit\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! interest on the CB's credit\n3 Outside the accounts\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! issue: credit to banks — new money\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! repaid — money withdrawn\n\nIn the engine's money the CB holds no stock: credit to banks is new money, repayment withdraws it, interest goes to the treasury. E&F's currency-good stock is separate, in counts."
 zz_ef_ms_tt_abroad:0 "#b Abroad this week#!\n1 Treasury\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetTreatiesIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPowerBlocIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n  → #N −[Abs_CFixedPoint(Country.GetMarketFeesIncome)|D] [Country.GetCustom('currency_symbol')]#! [concept_supply_network] (fees from market members)\n  → #N −[Abs_CFixedPoint(Country.PredictTolls)|D] [Country.GetCustom('currency_symbol')]#! [concept_tolls]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPiracyIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_piracy]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetTreatiesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetPowerBlocExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n2 Business cash\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_week'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! trade: exports over imports (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_week')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! trade: imports over exports (E&F)\n3 Bank funds\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! foreign bonds bought by private banks (E&F)\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! foreign bonds run off (E&F)\n\nThe account holds no stock — only transfers."
 zz_ef_ms_tt_fx:0 "#b The CB stock of the currency good (E&F) this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=] units#!\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_issue_month')|D]#! units issue: sales of the currency good on the market\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_own')|D]#! units into circulation: the country's buildings and pops\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_others')|D]#! units into circulation: other countries of the market\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_devaluation_month')|D]#! units devaluation\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_revaluation_month')|D]#! units revaluation\n\nThese are not money but counts of the liquidity_currency good (E&F counts them × 4 a month and draws them with the currency sign). In the engine's money the CB is an ordinary building: its revenue is in business cash."
