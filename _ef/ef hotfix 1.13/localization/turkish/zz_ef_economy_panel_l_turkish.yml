l_turkish:
 zz_ef_ep_current_account:0 "Current account, a week"
 zz_ef_ep_current_account_tt:0 "The week's net flow with abroad — the same number as the 'net' line of the 'Abroad' card in the money supply tooltip: budget lines with abroad, the market's trade balance, dividends from abroad, foreign bonds bought. The CB settles it through the world clearing at the next weekly step: an outflow in metal (the share by trust in the currency) and our currency, an inflow in the payers' metal and currencies."
 zz_ef_ep_trade_tt:0 "The market's trade balance this week: exports − imports of all goods at the market's prices (engine money)."
 zz_ef_ep_week_market_prices:0 "a week, at the market's prices"
 zz_ef_ep_cbfx_units:0 "Units"
 zz_ef_ep_cbfx_money:0 "In our money"
 zz_ef_ep_cbfx_gold:0 "In gold (a week)"
 zz_ef_ep_holders_title:0 "Who holds our currency"
 zz_ef_ep_bank_holders_title:0 "Which banks hold our currency"
 zz_ef_ep_bop:0 "#b Balance of payments this week#!\nCurrent account: [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_current')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  goods trade [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_trade')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  primary income (dividends, interest) [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_primary')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  secondary income (budget lines with abroad) [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_secondary')|D+=] [GetPlayer.GetCustom('currency_symbol')]\nFinancial account (other countries' bonds): [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_financial')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n#b Balance [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#! → the world clearing\nReserve assets: [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_reserves_money')|D+=] [GetPlayer.GetCustom('currency_symbol')] (metal [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_metal_money')|D+=] [GetPlayer.GetCustom('currency_symbol')], currency [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_fx_money')|D+=] [GetPlayer.GetCustom('currency_symbol')])\n  not settled by the clearing [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_unsettled')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n#b Net international position [GetPlayer.MakeScope.ScriptValue('zz_ef_abroad_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!"
