 zz_ef_ms_tt_cb:0 "#b Central bank this week: [Country.MakeScope.ScriptValue('zz_ef_v_d_cbm')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Bank funds\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! credit to banks at the key rate\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! repayment of the CB's credit\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! interest on the CB's credit\n2 Treasury\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! the CB's profit: banks' interest\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! E&F: the treasury repays the CB (beyond the budget)\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! E&F: other income to the treasury beyond the budget\n3 Outside the accounts\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! issue: credit to banks — new money\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! repaid — money withdrawn\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_cbm'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb')), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] other\n\nThe CB is the country's settlement agent: every payment with abroad goes through it. Credit to banks is new money, repayment withdraws it, interest goes to the treasury. The account's stock is the metal reserves (E&F's currency-good stock is counts of a good, not in them): a net outflow abroad pays out metal at the currency's value, an inflow brings it in (Hume's mechanism, metal standards with a CB only). The reserves are the currency's cover, not money: they are outside M0–M3, else a payment abroad would count twice (the money left the pool or business cash and the same metal left the CB). An outflow lowers the money and the cover by one sum; E&F's trade balance is no longer in the reserves.\n#b Metal reserves: [Country.MakeScope.ScriptValue('zz_ef_cb_metal')|D] @gold!#! (this week [Country.MakeScope.ScriptValue('zz_ef_v_f_hume')|D+=]); net flow with abroad [Country.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=][Country.GetCustom('currency_symbol')]; value [Country.MakeScope.ScriptValue('money_value_0')|3] metal per [Country.GetCustom('currency_symbol')]; cover at parity [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]. Currency-good stock [Country.MakeScope.ScriptValue('money_supply_state')|D] units."
