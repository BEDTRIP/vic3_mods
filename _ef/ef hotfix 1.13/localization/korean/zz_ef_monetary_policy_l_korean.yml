 zz_ef_mp_tt:0 "[GetLawType('law_devaluation').GetName] and [GetLawType('law_revaluation').GetName] are a tool of the [concept_central_bank]. The measure is the cover: metal and foreign currency in the reserves at parity against the money in circulation. When the law passes the target is today's cover; move it with the buttons.\n\n[GetLawType('law_devaluation').GetName]: the [concept_central_bank] prints money into the treasury — the state spends it, there is more money, the cover falls to the target. While the treasury has not spent what was printed, no more than needed is printed.\n[GetLawType('law_revaluation').GetName]: the [concept_central_bank] takes money out of the treasury (no treasury — the pace falls).\n\nTarget reached — the parity is rewritten to today's value (a new metal content) and the law is lifted. If the cover is already past the target, the parity is rewritten at once."
