 zz_ef_ms_cb_23:0 "  ↔ $zz_ef_ms_x_v_d_cbm_rest$ $zz_ef_ms_cur$ #grey calc#! other — E&F's operations with the CB's metal (metal purchases, currency deals)"
 zz_ef_ms_cb_24:0 "The CB is the country's settlement agent: every payment with abroad goes through it. Credit to banks is new money, repayment withdraws it, interest goes to the treasury. The account's stock is the metal reserves (E&F's currency-good stock is counts of a good, not in them): a net outflow abroad pays out metal at the currency's value, an inflow brings it in (Hume's mechanism, metal standards with a CB only). The reserves are the currency's cover, not money: they are outside M0–M3, else a payment abroad would count twice (the money left the pool or business cash and the same metal left the CB). An outflow lowers the money and the cover by one sum; E&F's trade balance is no longer in the reserves."
 zz_ef_ms_cb_25:0 "#grey Marks: eng — the engine's number as is (budget, cash, pool); mod — money the mod moved (deposits, credit, metal); calc — derived from other numbers (money conservation, residual, revaluation); est — an estimate (wages = GDP / 52); E&F — an E&F variable (bonds).#!"
 zz_ef_ms_cb_26:0 "#b Metal reserves: $zz_ef_ms_x_cb_metal$ @gold!#! (this week $zz_ef_ms_x_v_f_hume$); net flow with abroad $zz_ef_ms_x_v_f_ext_net$$zz_ef_ms_cur$; value $zz_ef_ms_x_money_value_0$ metal per $zz_ef_ms_cur$; cover at parity $zz_ef_ms_x_cb_cover$. Currency-good stock $zz_ef_ms_x_money_supply_state$ units."

