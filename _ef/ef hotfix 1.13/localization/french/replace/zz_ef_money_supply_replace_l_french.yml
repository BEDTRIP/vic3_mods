 zz_ef_ms_pops_06:0 "  ← #P +$zz_ef_ms_x_v_w_cc_issue$ $zz_ef_ms_cur$#! #grey mod#! consumer credit: lent (the week just ended; reaches pops as the dependents' surcharge)"
 zz_ef_ms_pops_07:0 "  → #N −$zz_ef_ms_x_v_w_cc_repay$ $zz_ef_ms_cur$#! #grey mod#! consumer credit: repaid (the week just ended)"
