 zz_ef_ms_banks_24:0 "The investment pool. Private construction goes through the treasury: pool → treasury (transfer) → businesses (construction goods). Banks borrow from the CB at the key rate — the debt goes to a share of GDP by the rate (50% at 2%, 0 at 12%): a lower rate puts more new money into the pool, a higher one makes banks repay from the pool."
 zz_ef_ms_banks_25:0 "#grey Marks: eng — the engine's number as is (budget, cash, pool); mod — money the mod moved (deposits, credit, metal); calc — derived from other numbers (money conservation, residual, revaluation); est — an estimate (wages = GDP / 52); E&F — an E&F variable (bonds).#!"
 zz_ef_ms_banks_26:0 "Banks' debt to the CB $zz_ef_ms_x_bank_cb_debt$ $zz_ef_ms_cur$; target $zz_ef_ms_x_cb_credit_target$ $zz_ef_ms_cur$ = GDP × $zz_ef_ms_x_cb_credit_share$ of 50% at a rate of $zz_ef_ms_x_money_rate$; 1.15% of the gap a week (~5% a month), but they borrow only what the pool lacks of its need $zz_ef_ms_x_pool_need$ $zz_ef_ms_cur$ (3 months of its payouts), and idle money over it repays the CB. The pool holds $zz_ef_ms_x_pool_months$ months of contributions."
 zz_ef_ms_banks_27:0 "#b Business credit: businesses' debt $zz_ef_ms_x_bc_debt$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_bc_debt_to_gdp$ of GDP). This week's private construction was paid with the banks' borrowed money for $zz_ef_ms_x_bc_borrowed_share$ (CB credit and deposits to the pool): new debt $zz_ef_ms_x_v_f_bc_new$ $zz_ef_ms_cur$; interest $zz_ef_ms_x_v_f_bc_int$ $zz_ef_ms_cur$ (key + 3 pp), term 5 years; counted from the buildings' contributions $zz_ef_ms_x_v_f_bc_paid$ $zz_ef_ms_cur$ ($zz_ef_ms_x_bc_service_share$ of them) — money from business cash to the pool. When they fall short, owners put more income into the pool instead of dividends: now +$zz_ef_ms_x_v_bc_svc$% of the contribution share (up to +30%)."

