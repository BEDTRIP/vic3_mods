 zz_ef_ms_pops_14:0 "  → #N −$zz_ef_ms_x_expr_6$ $zz_ef_ms_cur$#! #grey eng#! [concept_budget_dividends_taxes]"
 zz_ef_ms_pops_15:0 "  ← #P +$zz_ef_ms_x_expr_7$ $zz_ef_ms_cur$#! #grey eng#! [concept_budget_government_wages]"
 zz_ef_ms_pops_16:0 "  ← #P +$zz_ef_ms_x_expr_8$ $zz_ef_ms_cur$#! #grey eng#! [concept_budget_military_wages]"
 zz_ef_ms_pops_17:0 "  ← #P +$zz_ef_ms_x_expr_9$ $zz_ef_ms_cur$#! #grey eng#! [concept_welfare_payments]"
 zz_ef_ms_pops_18:0 "  ← #P +$zz_ef_ms_x_expr_10$ $zz_ef_ms_cur$#! #grey eng#! [concept_budget_interest] — to the debt holders (owners of the buildings' reserves)"
 zz_ef_ms_pops_19:0 "4 Outside the accounts"
 zz_ef_ms_pops_20:0 "  → #N −$zz_ef_ms_x_v_f_inflow$ $zz_ef_ms_cur$#! #grey calc#! into savings: income left over — money that dropped out of the treasury and business cash (exact, by money conservation)"
 zz_ef_ms_pops_21:0 "  ← #P +$zz_ef_ms_x_v_f_inflow_neg$ $zz_ef_ms_cur$#! #grey calc#! from savings: more came back into the engine's money than dropped out"
 zz_ef_ms_pops_22:0 "  → #N −$zz_ef_ms_x_v_f_mint_own$ $zz_ef_ms_cur$#! #grey mod#! into savings: coinage — to the metal's owners"
 zz_ef_ms_pops_23:0 "  ← #P +$zz_ef_ms_x_v_f_mint_own$ $zz_ef_ms_cur$#! #grey mod#! the CB coins mined metal — to the owners"
 zz_ef_ms_pops_24:0 "  → #N −$zz_ef_ms_x_v_f_buyout$ $zz_ef_ms_cur$#! #grey calc#! into savings: the level sellers' proceeds"
 zz_ef_ms_pops_25:0 "Pops hold no money in the engine: it turns the income left over into wealth (a number). The mod catches this money into savings by money conservation (the GUI → script bridge): what vanished from the treasury and business cash beyond the known transfers. Payments abroad (the trade centres' cash) and the pool's unexplained change (levels bought) are not in it. Part of the savings is in deposits — engine money again (the pool)."
 zz_ef_ms_pops_26:0 "#grey Marks: eng — the engine's number as is (budget, cash, pool); mod — money the mod moved (deposits, credit, metal); calc — derived from other numbers (money conservation, residual, revaluation); est — an estimate (wages = GDP / 52); E&F — an E&F variable (bonds).#!"
 zz_ef_ms_pops_27:0 "#b Consumer credit: debt $zz_ef_ms_x_cc_debt$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_cc_debt_to_gdp$ of GDP); limit 4 months of income $zz_ef_ms_x_cc_limit$ $zz_ef_ms_cur$, target $zz_ef_ms_x_cc_target$ $zz_ef_ms_cur$ ($zz_ef_ms_x_cc_share$ of the limit by the rate: 100% at 2%, 0 at 12%); rate $zz_ef_ms_x_cc_rate$ (key + 3 pp), term a year. This week: lent $zz_ef_ms_x_v_f_cc_issue$ $zz_ef_ms_cur$, repaid $zz_ef_ms_x_v_f_cc_repay$ $zz_ef_ms_cur$, interest $zz_ef_ms_x_v_f_cc_int$ $zz_ef_ms_cur$ — net to pops $zz_ef_ms_x_v_f_cc_net$$zz_ef_ms_cur$, dependents' surcharge $zz_ef_ms_x_cc_wage_add$ a year per dependent ($zz_ef_ms_x_v_dependents$ dependents)."
 zz_ef_ms_pops_28:0 "Pops' income ≈ GDP / 52 = $zz_ef_ms_x_gdp_week_2$ $zz_ef_ms_cur$."
 zz_ef_ms_pops_29:0 "#b Savings: $zz_ef_ms_x_pop_savings$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_pop_savings_week$$zz_ef_ms_cur$ this week) — in deposits $zz_ef_ms_x_pop_deposits$ $zz_ef_ms_cur$, at hand $zz_ef_ms_x_pop_cash$ $zz_ef_ms_cur$. This week: dropped out of the engine's money $zz_ef_ms_x_v_f_inflow_2$$zz_ef_ms_cur$, levels sold to companies $zz_ef_ms_x_v_f_buyout_2$$zz_ef_ms_cur$, deposit interest $zz_ef_ms_x_v_f_dep_int$$zz_ef_ms_cur$; deposited $zz_ef_ms_x_v_f_dep_in$ $zz_ef_ms_cur$, withdrawn $zz_ef_ms_x_v_f_dep_out$ $zz_ef_ms_cur$. Cash norm at hand $zz_ef_ms_x_pop_cash_norm$ $zz_ef_ms_cur$ ($zz_ef_ms_x_cash_norm_gdp$ of GDP: 20% at a 0% deposit rate, 12% at 3%, at least 6%); over it pops deposit, under it they withdraw, 10% of the gap a week. Deposit rate $zz_ef_ms_x_deposit_rate$ = key − the banks' margin $zz_ef_ms_x_deposit_margin$ (1.5 pp + 1 pp per need of idle money in the pool)."

