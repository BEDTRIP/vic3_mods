 zz_ef_ms_pops_01:0 "#b Pops this week#!"
 zz_ef_ms_pops_02:0 "1 Business cash"
 zz_ef_ms_pops_03:0 "  ← #P +$zz_ef_ms_x_gdp_week$ $zz_ef_ms_cur$#! #grey est#! wages and dividends (estimate: GDP / 52 − state pay)"
