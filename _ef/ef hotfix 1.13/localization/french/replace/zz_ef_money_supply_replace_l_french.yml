 zz_ef_ms_pops_09:0 "  ← #P +$zz_ef_ms_x_v_f_pool_other_neg$ $zz_ef_ms_cur$#! #grey calc#! companies buy building levels from aristocrats and capitalists (the privatization price, 15 000 a level) — money to the sellers"
 zz_ef_ms_pops_10:0 "3 Treasury"
