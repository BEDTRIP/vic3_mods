 zz_ef_ms_abroad_22:0 "Abroad — the country's claims on other countries: the private banks' and the treasury's bonds (E&F). Every payment with abroad goes through the CB: a net outflow pays out its metal (Hume's mechanism). Payments do not change the claims and are not in 'other'; 'other' is the bonds' change not explained by purchases and redemptions."
