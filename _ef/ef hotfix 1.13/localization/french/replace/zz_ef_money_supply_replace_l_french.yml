 MONEY_SUPPLY_DESC_MONEY_VALUE_subject_player:0 "Money Supply:\nTotal #v Money Supply#!: #p [GetPlayer.MakeScope.ScriptValue('total_money_supply')|D]#! [GetPlayer.GetCustom('currency_symbol')]\n - Owned in the country (M2): #T [GetPlayer.MakeScope.ScriptValue('money_supply')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_m2')|D+=][GetPlayer.GetCustom('currency_symbol')] this month)\n   M0 — cash and state money: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_m0')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_cb Central bank reserves#!: #T [GetPlayer.MakeScope.ScriptValue('money_supply_state')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][GetPlayer.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_treasury Treasury#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_treasury')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][GetPlayer.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_savings Pop savings#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_savings')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][GetPlayer.GetCustom('currency_symbol')])\n   M1 = M0 + business cash: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_m1')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_buildings Business cash#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_building_cash')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][GetPlayer.GetCustom('currency_symbol')])\n   M2 = M1 + bank funds: #T [GetPlayer.MakeScope.ScriptValue('money_supply')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_banks Bank funds#!: #T [GetPlayer.MakeScope.ScriptValue('investment_pool')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][GetPlayer.GetCustom('currency_symbol')])\n       deposits [GetPlayer.MakeScope.ScriptValue('zz_ef_deposits')|D] [GetPlayer.GetCustom('currency_symbol')], bank credit [GetPlayer.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [GetPlayer.GetCustom('currency_symbol')]: ×[GetPlayer.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2] of deposits, target ×[GetPlayer.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2]\n   Money multiplier M2 / M0: ×[GetPlayer.MakeScope.ScriptValue('zz_ef_m2_to_m0')|2]\n - Owned by other countries: #T [GetPlayer.MakeScope.ScriptValue('money_supply_stockpile_by_other_country')|D] [GetPlayer.GetCustom('currency_symbol')]#!\nGovernment debt (not money): budget debt [GetPlayer.MakeScope.ScriptValue('zz_ef_debt_principal')|D] [GetPlayer.GetCustom('currency_symbol')], to the central bank [GetPlayer.MakeScope.ScriptValue('zz_ef_debt_cb_gold')|D] @gold!\n#italic Hover an account for its transfers this month.#!\n$TOOLTIP_DELIMITER$"
 zz_ef_ms_tt_savings:0 "#b Pop savings this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n  inflow — currency demand, the country's share of its market: [Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')|D+=][Country.GetCustom('currency_symbol')]\n  → treasury: taxes (estimate): [Country.MakeScope.ScriptValue('zz_ef_f_taxes_neg')|D+=][Country.GetCustom('currency_symbol')]\n  → businesses: spending on goods: [Country.MakeScope.ScriptValue('zz_ef_f_goods_neg')|D+=][Country.GetCustom('currency_symbol')]\n  ↔ banks: deposits (minus) / withdrawals (plus): [Country.MakeScope.ScriptValue('zz_ef_f_deposits_neg')|D+=][Country.GetCustom('currency_symbol')]\n  correction: cut above 2 × GDP: [Country.MakeScope.ScriptValue('zz_ef_f_cap_neg')|D+=][Country.GetCustom('currency_symbol')]\n  other: [Country.MakeScope.ScriptValue('zz_ef_other_savings')|D+=][Country.GetCustom('currency_symbol')]\n\nCash held by pops. Inflow is the market's demand for the currency (E&F), split among the market's countries by GDP share. Spending on goods and taxes ≈ GDP − pool contributions; a large stock is spent from fully, a small one hardly at all. Taxes are an estimate: budget income without minting."
 zz_ef_ms_tt_banks:0 "#b Bank funds this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n  ← pops: deposits / withdrawals: [Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')|D+=][Country.GetCustom('currency_symbol')]\n  new bank credit (+) / contraction (−): [Country.MakeScope.ScriptValue('zz_ef_v_f_credit')|D+=][Country.GetCustom('currency_symbol')]\n  ← pops and buildings: pool contributions (vanilla): [Country.MakeScope.ScriptValue('zz_ef_v_f_contrib')|D+=][Country.GetCustom('currency_symbol')]\n  → businesses: private construction: [Country.MakeScope.ScriptValue('zz_ef_f_construction_neg')|D+=][Country.GetCustom('currency_symbol')]\n  other: [Country.MakeScope.ScriptValue('zz_ef_other_pool')|D+=][Country.GetCustom('currency_symbol')]\n\nDeposits [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('zz_ef_v_d_deposits')|D+=][Country.GetCustom('currency_symbol')]), bank credit [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]. Banks steer their funds to deposits × multiplier: now ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], target ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] at a rate of [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1] (×3 at 2%, ×1.2 at 12%). Other: government construction from the pool, interest on bonds."
 zz_ef_ms_tt_treasury:0 "#b Treasury this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n  ← pops: taxes (estimate): [Country.MakeScope.ScriptValue('zz_ef_v_f_taxes')|D+=][Country.GetCustom('currency_symbol')]\n  minting — new money: [Country.MakeScope.ScriptValue('zz_ef_v_f_minting')|D+=][Country.GetCustom('currency_symbol')]\n  other: expenses, tariffs, pacts, loans: [Country.MakeScope.ScriptValue('zz_ef_other_treasury')|D+=][Country.GetCustom('currency_symbol')]\n\nState money, part of M0. The full budget: Money in the top bar. Minting is the only budget item that creates money; loans create money together with debt."
 zz_ef_ms_tt_buildings:0 "#b Business cash this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')]#!\n  ← pops: spending on goods: [Country.MakeScope.ScriptValue('zz_ef_v_f_goods')|D+=][Country.GetCustom('currency_symbol')]\n  ← banks: private construction: [Country.MakeScope.ScriptValue('zz_ef_v_f_construction')|D+=][Country.GetCustom('currency_symbol')]\n  other: wages, dividends, purchases, exports: [Country.MakeScope.ScriptValue('zz_ef_other_buildings')|D+=][Country.GetCustom('currency_symbol')]\n\nBuildings' cash reserves. The engine gives them only inside the country's credit limit: limit − base − GDP share (COUNTRY_MIN_CREDIT_* defines). Wages and dividends are not visible to scripts one by one — they are in other."
 zz_ef_ms_tt_cb:0 "#b Central bank reserves this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n  by E&F's reckoning (issue, buyback, devaluation): [Country.MakeScope.ScriptValue('money_supply_state_monthly')|D+=][Country.GetCustom('currency_symbol')]\n\nCurrency held by the central bank, out of circulation."
