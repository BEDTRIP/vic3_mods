l_russian:
 MONEY_VALUE_INFO_silver_standard:0 "Курс: #T 1 [Country.GetCustom('currency_symbol')] = [Country.MakeScope.ScriptValue('money_value_0')|4] @silver!#!\nКурс с инфляцией: 1 [Country.GetCustom('currency_symbol')] = [Country.MakeScope.ScriptValue('money_value_rapported_inflation')|4] @silver! ([Country.MakeScope.ScriptValue('inflation_value')|%|=-])\nПаритет: 1 [Country.GetCustom('currency_symbol')] = [Country.MakeScope.ScriptValue('zz_ef_cb_valuation')|4] @silver!\nПокрытие: #T [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]#! (норма 40%, ниже 25% — размен приостановлен)\n$TOOLTIP_DELIMITER$"
 NATIONAL_CAPACITY_DESC_silver_standard:0 ""
