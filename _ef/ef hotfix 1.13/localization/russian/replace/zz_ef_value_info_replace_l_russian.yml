 INFLATION_BALANCE:0 "Текущее: #n [Country.MakeScope.ScriptValue('inflation_value')|%|=-]#! — рост цен потребительской корзины за год (индекс [Country.MakeScope.ScriptValue('zz_ef_price_index')|1], 100 = цены 1836); для сравнения: рост M2 [Country.MakeScope.ScriptValue('zz_ef_circ_growth_year')|%1=+], ВВП [Country.MakeScope.ScriptValue('zz_ef_gdp_growth_year')|%1=+] за год.\nРазложение E&F (товары, энергия, «изменение стоимости валюты») скрыто: оно считалось старой формулой и не складывалось в итог.\n$TOOLTIP_DELIMITER$"
