 MONEY_VALUE_INFO_silver_standard:0 "#b Курс:#! #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_0')|4]#! @silver! — паритет [Country.MakeScope.ScriptValue('zz_ef_cb_valuation')|4] @silver!; сила к эталону [Country.MakeScope.ScriptValue('zz_ef_currency_strength')|2]\nПокрытие #T [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]#! (норма 40%): от 25% — размен на металл, курс у паритета ±2%; ниже — размен приостановлен, курс = паритет × покрытие / 40%\nС инфляцией: 1 [Country.GetCustom('currency_symbol')] = [Country.MakeScope.ScriptValue('money_value_rapported_inflation')] @silver! ([Country.MakeScope.ScriptValue('inflation_value')|%|=-] @inflation!)\n$TOOLTIP_DELIMITER$"
 NATIONAL_CAPACITY_DESC_silver_standard:0 ""
