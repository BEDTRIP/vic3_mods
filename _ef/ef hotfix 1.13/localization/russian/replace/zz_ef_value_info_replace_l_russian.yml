l_russian:
 MONEY_VALUE_INFO_silver_standard:0 "Текущий индекс с учётом инфляции/дефляции: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_rapported_inflation')]#! @silver! ([Country.MakeScope.ScriptValue('inflation_value')|%|=-] @inflation!)\nКурс: #T 1 [Country.GetCustom('currency_symbol')]#! = #T [Country.MakeScope.ScriptValue('money_value_0')|4]#! @silver! — паритет #T [Country.MakeScope.ScriptValue('zz_ef_cb_valuation')|4]#! @silver! (сила к эталону [Country.MakeScope.ScriptValue('zz_ef_currency_strength')|2])\nПокрытие: резервы ЦБ по паритету / M2 = #T [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]#! (норма 40%). Пока покрытие 25% и выше, банкноты разменны на металл и курс держится у паритета (±2%); ниже 25% размен приостановлен: курс = паритет × покрытие / 40%.\n$TOOLTIP_DELIMITER$"
 NATIONAL_CAPACITY_DESC_silver_standard:0 "Резервы ЦБ:\nВсего #v резервы#!: [Country.MakeScope.ScriptValue('national_capacity')|D] @silver! = #T [Country.MakeScope.ScriptValue('zz_ef_cb_money')|D]#! [Country.GetCustom('currency_symbol')] по паритету\n- металл в хранилище ЦБ: #T [Country.MakeScope.ScriptValue('central_bank_metal_reserves_state')|D]#! @silver!\n- чужая валюта в резервах (по курсу, в металле): #T [Country.MakeScope.ScriptValue('zz_ef_v_fx_metal')|D]#! @silver!\nНе резервы: залоговое золото за рубежом (обеспечение долга) — [Country.MakeScope.Var('gold_loaned_to_central_bank_fix').GetValue|D] @gold!\n$TOOLTIP_DELIMITER$"
