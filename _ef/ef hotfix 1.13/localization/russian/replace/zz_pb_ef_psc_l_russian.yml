# pb+ef: hand-authored strings for the E&F + PSC compatch.
#
# LIVES IN replace/ (2026-09-24). Localization is first-come: the first file
# that defines a key wins, whatever the mod order, and E&F (or the V4 RUS
# translation, which overrides E&F by identical file names) defines these
# keys first. Files under localization/<lang>/replace/ override existing keys
# -- the mechanism Morgenroete uses on vanilla strings. Before the move this
# file was dead weight.
#
# Everything here needs human wording, so it is NOT regenerated by
# tools/regen_ef_psc_copies.py -- that script only does the mechanical
# building_ef_private_construction -> building_construction_sector rename and
# it deliberately skips these keys.
#
# concept_*_desc            : our own concepts, E&F has no text for them.
# financial_center_je_2_reason : empty -- the journal sections explain
#                             themselves (EF.18 v2, zz_pb_ef_fso_widgets.gui).
# speculative_share_*_tt_2  : reworded for the compatch's cap check. E&F asks
#                             "is there room for one more sector"; the effect
#                             builds 5/10/15/20 at once, so pb+ef checks
#                             pcs_construction_sector_headroom_by_base_rate
#                             instead (zz_pb_ef_remap_pcs_values.txt).
#
# NOTE: the level readout must call ScriptValue('building_ef_private_construction_lvl').
# That is E&F's key name, remapped by the compatch to sum building_construction_sector.
# An earlier build used 'building_construction_sector_lvl' in the Russian file --
# no such script_value exists, so the number rendered empty.

l_russian:
  concept_building_urban_center_lvl_by_base_rate_desc:1 "Максимальный уровень [GetBuildingType('building_construction_sector').GetName] равен суммарному уровню [GetBuildingType('building_urban_center').GetName] в стране × (1 − 5 × [concept_base_rate_percentage]). При ставке 1% это 95% городских центров, при 6% — 70%, при 12% — 40%, при 20% и выше — ноль."
  concept_maximum_pcs_capacity_desc:0 "[concept_maximum_pcs_capacity]: теоретический максимальный уровень [GetBuildingType('building_construction_sector').GetName], который способна поддерживать национальная экономика, — суммарный уровень [GetBuildingType('building_urban_center').GetName] × (1 − 5 × [concept_base_rate_percentage]).\n\n Низкая ставка позволяет работать большему числу [GetBuildingType('building_construction_sector').GetName], высокая сужает ёмкость.\n\n Если фактический уровень выше, возникают избыточные мощности: их индекс подтягивается к цели (1 − лимит / секторы) и урезает выработку секторов стройки."

  # Empty: each journal section explains itself (gui/scripted_widgets/zz_pb_ef_fso_widgets.gui).
  financial_center_je_2_reason:0 ""
 # EF.18 v2 (2026-09-25): the journal's two scripted bars are on again, for the outliner;
 # E&F's names describe the old mechanics.
 speculative_share_progress_bar:0 "Спекулятивный пузырь"
 speculative_share_progress_bar_desc:0 "Спекулятивный пузырь: [GetPlayer.MakeScope.Var('speculative_share_1').GetValue|0]%"
 overbuilt_economy_progress_bar:0 "Избыточные строительные мощности"
 overbuilt_economy_progress_bar_desc:0 "Избыточные строительные мощности: [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]"
  # 2026-09-25: stimulus buttons 9-12 reworked (scripted_guis/zz_pb_ef_speculative_pcs_sguis.txt)
  speculative_share_9_button_desc: "Правительство стимулирует частное строительство, снижая ключевую ставку на #b 1%#!. Дешёвый кредит загружает стройку сверх того, что тянет экономика: штраф избыточных строительных мощностей вырастает на #b 10#! пунктов и потом возвращается к целевому."
  speculative_share_9_button_tt_1: "Штраф избыточных строительных мощностей ниже #b 90#! (сейчас: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_9_button_tt_effect_1_1: "- $speculative_share_9_button_tt_effect_1$\n- Штраф избыточных строительных мощностей #r +10#! (не выше 100)\n- [GetPlayer.GetName] получает [GetStaticModifier('down_base_rate').GetName|v] на 6 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_5').GetName|v] на 12 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_6').GetName|v] на 12 месяцев"
  zz_pb_ef_stimulus_off_tt: "#N Выключено:#! при ставке от центробанка (EF.30) снижение отыгрывается назад; кнопки будут переделаны (СТР.4)."
  speculative_share_9_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_9_button$\n\n$speculative_share_9_button_desc$\n\nВозможно, если:\n- Нет модификатора [GetStaticModifier('speculative_share_modifier_5').GetName|v]\n- Есть модификатор [GetStaticModifier('has_financial_center').GetName|v]\n- $speculative_share_9_button_tt_1$\n- $speculative_share_9_button_tt_3$\n\nЭффект:\n$speculative_share_9_button_tt_effect_1_1$"
  speculative_share_10_button_desc: "Правительство стимулирует частное строительство, снижая ключевую ставку на #b 2%#!. Смягчение даёт денежную массу #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_10_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 2%#! средств частных банков с поправкой на редкость), она блокируется в государственном фонде. Дешёвый кредит загружает стройку сверх того, что тянет экономика: штраф избыточных строительных мощностей вырастает на #b 20#! пунктов и потом возвращается к целевому."
  speculative_share_10_button_tt_1: "Штраф избыточных строительных мощностей ниже #b 80#! (сейчас: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_10_button_tt_effect_1_1: "- $speculative_share_10_button_tt_effect_1$\n- $speculative_share_10_button_tt_effect_2$\n- Штраф избыточных строительных мощностей #r +20#! (не выше 100)\n- [GetPlayer.GetName] получает [GetStaticModifier('down_base_rate').GetName|v] на 6 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_5').GetName|v] на 12 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_6').GetName|v] на 12 месяцев"
  speculative_share_10_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_10_button$\n\n$speculative_share_10_button_desc$\n\nВозможно, если:\n- Нет модификатора [GetStaticModifier('speculative_share_modifier_5').GetName|v]\n- Есть модификатор [GetStaticModifier('has_financial_center').GetName|v]\n- $speculative_share_10_button_tt_1$\n- $speculative_share_10_button_tt_3$\n\nЭффект:\n$speculative_share_10_button_tt_effect_1_1$"
  speculative_share_11_button_desc: "Правительство стимулирует частное строительство, снижая ключевую ставку на #b 3%#!. Смягчение даёт денежную массу #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_15_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 5%#! средств частных банков с поправкой на редкость), она блокируется в государственном фонде. Дешёвый кредит загружает стройку сверх того, что тянет экономика: штраф избыточных строительных мощностей вырастает на #b 30#! пунктов и потом возвращается к целевому."
  speculative_share_11_button_tt_1: "Штраф избыточных строительных мощностей ниже #b 70#! (сейчас: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_11_button_tt_effect_1_1: "- $speculative_share_11_button_tt_effect_1$\n- $speculative_share_11_button_tt_effect_2$\n- Штраф избыточных строительных мощностей #r +30#! (не выше 100)\n- [GetPlayer.GetName] получает [GetStaticModifier('down_base_rate').GetName|v] на 6 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_5').GetName|v] на 12 месяцев\n- [GetPlayer.GetName] получает [GetStaticModifier('speculative_share_modifier_6').GetName|v] на 12 месяцев"
  speculative_share_11_button_tt: "$zz_pb_ef_stimulus_off_tt$\n\n$speculative_share_11_button$\n\n$speculative_share_11_button_desc$\n\nВозможно, если:\n- Нет модификатора [GetStaticModifier('speculative_share_modifier_5').GetName|v]\n- Есть модификатор [GetStaticModifier('has_financial_center').GetName|v]\n- $speculative_share_11_button_tt_1$\n- $speculative_share_11_button_tt_3$\n\nЭффект:\n$speculative_share_11_button_tt_effect_1_1$"
  speculative_share_12_button_desc: "Правительство стимулирует частное строительство, снижая ключевую ставку на #b 4%#!. Смягчение даёт денежную массу #b [GetPlayer.MakeScope.ScriptValue('private_bank_funds_proportion_by_psc_20_by_rarity')|D]#! [GetPlayer.GetCustom('global_monetary_reference_currency_good')] (#b 12%#! средств частных банков с поправкой на редкость), она блокируется в государственном фонде. Дешёвый кредит загружает стройку сверх того, что тянет экономика: штраф избыточных строительных мощностей вырастает на #b 40#! пунктов и потом возвращается к целевому."
  speculative_share_12_button_tt_1: "Штраф избыточных строительных мощностей ниже #b 60#! (сейчас: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
