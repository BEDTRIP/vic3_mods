 zz_ef_ms_tt_savings:0 "#b Сбережения населения за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Касса предприятий\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Средства банков\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Резервы центрального банка\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 вне счетов: спрос на валюту / срез выше 2 ВВП, прочее\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nНаличные у населения. Налоги и траты на товары — оценка: ВВП / 12 − взносы в пул, доля налогов — доход бюджета без чеканки. Зарплаты и дивиденды скрипту не видны — они в «прочем» у предприятий.\nТраты населения в месяц: [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = ВВП / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − взносы в пул [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('currency_symbol')]; из сбережений потрачено [Country.MakeScope.ScriptValue('zz_ef_v_f_outflow')|D] [Country.GetCustom('currency_symbol')]."
 zz_ef_ms_tt_treasury:0 "#b Казна за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_savings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_savings_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Касса предприятий\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_buildings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_buildings_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Средства банков\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_banks_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_banks_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Резервы центрального банка\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_cb_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_cb_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 вне счетов: чеканка, прочие доходы бюджета / расходы бюджета\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nДеньги государства — часть M0. Полный бюджет — «Деньги» в верхней панели."
 zz_ef_ms_tt_buildings:0 "#b Касса предприятий за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_savings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_savings_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Казна\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_treasury_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_treasury_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Средства банков\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_banks_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_banks_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Резервы центрального банка\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_cb_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_cb_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 вне счетов: зарплаты, дивиденды, закупки, экспорт\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nДенежные резервы зданий: кредитный лимит − база − доля ВВП (COUNTRY_MIN_CREDIT_*)."
 zz_ef_ms_tt_banks:0 "#b Средства банков за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Казна\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_treasury_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_treasury_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Касса предприятий\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_buildings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_buildings_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Резервы центрального банка\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_cb_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_cb_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 вне счетов: новый кредит банков, взносы в пул (ваниль) / сжатие кредита, прочее\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nСтройка — частная и через казну (перевод из пула в бюджет). Банки тянут средства к вкладам × множитель (×3 при 2%, ×1.2 при 12%).\nВклады [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')], кредит банков [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]: сейчас ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], цель ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Резервы центрального банка за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_savings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_savings_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Казна\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_treasury_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_treasury_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Касса предприятий\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_buildings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_buildings_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Средства банков\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_banks_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_banks_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 вне счетов: выпуск и выкуп по расчёту E&F\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nВалюта, которую держит центральный банк, вне обращения."
