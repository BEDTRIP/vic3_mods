 zz_ef_ms_tt_banks:0 "#b Средства банков за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! вклады\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! изъятия вкладов\n2 Казна\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetInvestmentIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_investment_income]: на стройку\n3 Касса предприятий\n  нет переводов\n4 Резервы центрального банка\n  нет переводов\n5 Заграница\n  нет переводов\n6 Вне счетов\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! взносы в пул — население и здания (ваниль)\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_credit'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! новый кредит банков\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_credit')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! сжатие кредита\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_pool'), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')), '(CFixedPoint)0'))), Negate_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetInvestmentIncomeTrend), '(CFixedPoint)4.333')))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_credit'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_credit')), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] прочее — не видно скрипту\n\nЧастная стройка идёт через казну: пул → казна (инвестфонд) → предприятия (строительные товары). Банки тянут средства к вкладам × множитель (×3 при 2%, ×1.2 при 12%).\nВклады [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')], кредит банков [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]: сейчас ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], цель ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Резервы центрального банка за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в обращение: спрос рынка на валюту — доля страны (E&F)\n2 Казна\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMintingTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_minting]\n3 Касса предприятий\n  нет переводов\n4 Средства банков\n  нет переводов\n5 Заграница\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_demand_others'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в обращение: другим странам рынка (E&F)\n6 Вне счетов\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMintingTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! выпуск для казны: чеканка\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_issue_month'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! выпуск: продажи товара-валюты на рынке (E&F)\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_devaluation_month'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! девальвация (E&F)\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_revaluation_month'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! ревальвация (E&F)\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_cb'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0'))), Negate_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMintingTrend), '(CFixedPoint)4.333')))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_demand_others'), '(CFixedPoint)0'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMintingTrend), '(CFixedPoint)4.333'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_issue_month'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_devaluation_month'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_revaluation_month'), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] прочее — не видно скрипту\n\nВалюта, которую держит центральный банк, вне обращения. Выпуск и спрос — рынок товара-валюты (E&F, у хозяина рынка); чеканку ЦБ выпускает для казны."
 zz_ef_ms_tt_abroad:0 "#b Заграница за месяц#!\n1 Сбережения населения\n  нет переводов\n2 Казна\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetTreatiesIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPowerBlocIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(Country.GetMarketFeesIncome, '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_supply_network] (сборы с участников рынка)\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(Country.PredictTolls, '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_tolls]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPiracyIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_piracy]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetTreatiesExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPowerBlocExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n3 Касса предприятий\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_month'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: экспорт сверх импорта (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_month')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: импорт сверх экспорта (E&F)\n4 Средства банков\n  нет переводов\n5 Резервы центрального банка\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_cb_demand_others'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в обращение: другим странам рынка (E&F)\n6 Вне счетов\n  нет переводов\n\nЗапаса у счёта нет — только переводы. Проценты иностранным держателям госдолга — шаг 3.\nВалюта страны у других стран: [Country.MakeScope.ScriptValue('money_supply_stockpile_by_other_country')|D] [Country.GetCustom('currency_symbol')]."
