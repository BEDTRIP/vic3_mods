 zz_ef_ms_tt_banks:0 "#b Средства банков за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetInvestmentIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_investment_income]: на стройку\n2 Касса предприятий\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! взносы в пул — инвестиции зданий и сбережения богатых (ваниль)\n3 Центральный банк\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n4 Заграница\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупка облигаций других стран частными банками (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение облигаций других стран (E&F)\n5 Вне счетов\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_pool'), Negate_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetInvestmentIncomeTrend), '(CFixedPoint)4.333')))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0'))|D+=] [Country.GetCustom('currency_symbol')] прочее\n\nИнвестиционный пул. Частная стройка идёт через казну: пул → казна (трансфер) → предприятия (строительные товары). Банки держат в пуле взносы за несколько месяцев (12 при ставке 2%, 3 при 12%): ниже — занимают у ЦБ под ключевую ставку, выше — гасят долг.\nДолг банков перед ЦБ [Country.MakeScope.ScriptValue('zz_ef_bank_cb_debt')|D] [Country.GetCustom('currency_symbol')]; цель пула [Country.MakeScope.ScriptValue('zz_ef_pool_target')|D] [Country.GetCustom('currency_symbol')] = взносы за месяц × [Country.MakeScope.ScriptValue('zz_ef_credit_months')|1] мес. при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]."
