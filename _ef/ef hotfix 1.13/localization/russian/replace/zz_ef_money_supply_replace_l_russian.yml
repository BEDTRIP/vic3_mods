 zz_ef_ms_cb_16:0 "  ← #P +$zz_ef_ms_x_v_f_mint$ $zz_ef_ms_cur$#! добытый металл, отчеканенный ЦБ, — в резервы"
 zz_ef_ms_cb_17:0 "  ← #P +$zz_ef_ms_x_v_f_cb_reval$ $zz_ef_ms_cur$#! переоценка резервов: паритет снижен (девальвация, перепривязка)"
 zz_ef_ms_cb_18:0 "  → #N −$zz_ef_ms_x_v_f_cb_reval_neg$ $zz_ef_ms_cur$#! переоценка резервов: паритет повышен"
 zz_ef_ms_cb_19:0 "  ← #P +$zz_ef_ms_x_v_f_cb_rescale$ $zz_ef_ms_cur$#! пересчёт металла до 40% покрытия (начало игры)"
 zz_ef_ms_cb_20:0 "  → #N −$zz_ef_ms_x_v_f_cb_rescale_neg$ $zz_ef_ms_cur$#! пересчёт металла до 40% покрытия (начало игры)"
 zz_ef_ms_cb_21:0 "  ↔ $zz_ef_ms_x_v_d_cbm_rest$ $zz_ef_ms_cur$ прочее — операции E&F с металлом ЦБ (закупки металла, валютные сделки)"
 zz_ef_ms_cb_22:0 "ЦБ — расчётный агент страны: все платежи с заграницей идут через него. Кредит банкам — новые деньги, погашение их изымает, проценты уходят в казну. Запас счёта — резервы металла (склад товара-валюты E&F — штуки товара, в резервы не входит): чистый отток за рубеж по курсу списывает металл, приток — добавляет (механизм Юма, только металлический стандарт с ЦБ). Резервы — покрытие валюты, а не деньги: в M0–M3 не входят, иначе отток за рубеж считался бы дважды (деньги ушли из пула или касс и тот же металл ушёл из ЦБ). Отток уменьшает деньги и покрытие на одну сумму; торговый баланс E&F в резервы больше не входит."
 zz_ef_ms_cb_23:0 "#b Резервы металла: $zz_ef_ms_x_cb_metal$ @gold!#! (за неделю $zz_ef_ms_x_v_f_hume$); чистый поток с заграницей $zz_ef_ms_x_v_f_ext_net$$zz_ef_ms_cur$; курс $zz_ef_ms_x_money_value_0$ металла за $zz_ef_ms_cur$; покрытие по паритету $zz_ef_ms_x_cb_cover$. Склад товара-валюты $zz_ef_ms_x_money_supply_state$ шт."

