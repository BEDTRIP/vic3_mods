 MONEY_SUPPLY_DESC_MONEY_VALUE_subject_player:0 "Денежная масса:\nВсего #v Денежная масса#!: #p [GetPlayer.MakeScope.ScriptValue('total_money_supply')|D]#! [GetPlayer.GetCustom('currency_symbol')]\n - В собственности страны (M2): #T [GetPlayer.MakeScope.ScriptValue('money_supply')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_m2')|D+=][GetPlayer.GetCustom('currency_symbol')] за месяц)\n   M0 — наличные и деньги государства: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_m0')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_cb Резервы центрального банка#!: #T [GetPlayer.MakeScope.ScriptValue('money_supply_state')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][GetPlayer.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_treasury Казна#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_treasury')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][GetPlayer.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_savings Сбережения населения#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_savings')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][GetPlayer.GetCustom('currency_symbol')])\n   M1 = M0 + касса предприятий: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_m1')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[GetPlayer.GetTooltipTag],zz_ef_ms_tt_buildings Касса предприятий#!: #T [GetPlayer.MakeScope.ScriptValue('zz_ef_building_cash')|D] [GetPlayer.GetCustom('currency_symbol')]#! ([GetPlayer.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][GetPlayer.GetCustom('currency_symbol')])\n   M2 = M1 + средства банков: #T [GetPlayer.MakeScope.ScriptValue('money_supply')|D] [GetPlayer.GetCustom('cu