 zz_ef_ms_cb_04:0 "  ← #P +$zz_ef_ms_x_v_f_cb_repay$ $zz_ef_ms_cur$#! #grey мод#! погашение кредита ЦБ"
 zz_ef_ms_cb_05:0 "  ← #P +$zz_ef_ms_x_v_f_cb_interest$ $zz_ef_ms_cur$#! #grey мод#! проценты по кредиту ЦБ"
 zz_ef_ms_cb_06:0 "2 Заграница"
 zz_ef_ms_cb_07:0 "  ← #P +$zz_ef_ms_x_v_f_cb_hume_m$ $zz_ef_ms_cur$#! #grey мод#! клиринг: металл за чистый приток из-за рубежа (прошлая неделя)"
 zz_ef_ms_cb_08:0 "  → #N −$zz_ef_ms_x_v_f_cb_hume_m_neg$ $zz_ef_ms_cur$#! #grey мод#! клиринг: металл за чистый отток за рубеж (прошлая неделя)"
 zz_ef_ms_cb_09:0 "3 Казна"
 zz_ef_ms_cb_10:0 "  → #N −$zz_ef_ms_x_expr_34$ $zz_ef_ms_cur$#! #grey дв#! [concept_budget_minting] — выпуск ЦБ в казну"
 zz_ef_ms_cb_11:0 "  → #N −$zz_ef_ms_x_v_f_cb_interest$ $zz_ef_ms_cur$#! #grey мод#! прибыль ЦБ: проценты банков"
 zz_ef_ms_cb_12:0 "  ← #P +$zz_ef_ms_x_tr_to_cb_neg$ $zz_ef_ms_cur$#! #grey расч#! E&F: казна гасит долг ЦБ (сверх бюджета)"
 zz_ef_ms_cb_13:0 "  → #N −$zz_ef_ms_x_tr_to_cb$ $zz_ef_ms_cur$#! #grey расч#! E&F: прочий приход в казну сверх бюджета"
 zz_ef_ms_cb_14:0 "4 Вне счетов"
 zz_ef_ms_cb_15:0 "  ← #P +$zz_ef_ms_x_expr_34$ $zz_ef_ms_cur$#! #grey дв#! выпуск: [concept_budget_minting] — новые деньги движка"
 zz_ef_ms_cb_16:0 "  ← #P +$zz_ef_ms_x_v_f_cb_borrow$ $zz_ef_ms_cur$#! #grey мод#! выпуск: кредит банкам — новые деньги"
 zz_ef_ms_cb_17:0 "  → #N −$zz_ef_ms_x_v_f_cb_repay$ $zz_ef_ms_cur$#! #grey мод#! погашено — деньги изъяты"
 zz_ef_ms_cb_18:0 "  ← #P +$zz_ef_ms_x_v_f_mint$ $zz_ef_ms_cur$#! #grey мод#! добытый металл, отчеканенный ЦБ, — в резервы"
 zz_ef_ms_cb_19:0 "  ← #P +$zz_ef_ms_x_v_f_cb_reval$ $zz_ef_ms_cur$#! #grey расч#! переоценка резервов: паритет снижен (девальвация, перепривязка)"
 zz_ef_ms_cb_20:0 "  → #N −$zz_ef_ms_x_v_f_cb_reval_neg$ $zz_ef_ms_cur$#! #grey расч#! переоценка резервов: паритет повышен"
 zz_ef_ms_cb_21:0 "  ← #P +$zz_ef_ms_x_v_f_cb_rescale$ $zz_ef_ms_cur$#! #grey расч#! пересчёт металла до 40% покрытия (начало игры)"
 zz_ef_ms_cb_22:0 "  → #N −$zz_ef_ms_x_v_f_cb_rescale_neg$ $zz_ef_ms_cur$#! #grey расч#! пересчёт металла до 40% покрытия (начало игры)"
 zz_ef_ms_cb_23:0 "  ↔ $zz_ef_ms_x_v_d_cbm_rest$ $zz_ef_ms_cur$ #grey расч#! прочее — здание ЦБ E&F копит металл раз в месяц (за месяц $zz_ef_ms_x_central_bank_metal_reserves_state_per_month$ металла), валютные сделки"
 zz_ef_ms_cb_24:0 "Запас счёта — металл ЦБ по паритету: покрытие валюты, а не деньги (вне M0–M3). Чужая валюта ЦБ — в счёте «Заграница», в покрытии учтена."
 zz_ef_ms_cb_25:0 "#b Резервы ЦБ $zz_ef_ms_x_cb_money$ $zz_ef_ms_cur$#! по паритету $zz_ef_ms_x_cb_valuation$:"
 zz_ef_ms_cb_26:0 "  металл $zz_ef_ms_x_cb_money$ $zz_ef_ms_cur$: золото $zz_ef_ms_x_gold_state_native_for_stockpile$ @gold! + серебро $zz_ef_ms_x_silver_state_native_for_stockpile$ @silver! (в металле стандарта $zz_ef_ms_x_central_bank_metal_reserves_state$)"
 zz_ef_ms_cb_27:0 "  + чужая валюта $zz_ef_ms_x_fx_money$ $zz_ef_ms_cur$ (в металле $zz_ef_ms_x_v_fx_metal$) — в счёте «Заграница»"
 zz_ef_ms_cb_28:0 "Покрытие M2 $zz_ef_ms_x_cb_cover$ (металл и валюта); чистый поток с заграницей этой недели $zz_ef_ms_x_v_f_ext_net$ $zz_ef_ms_cur$ — в клиринг на следующем шаге."

 # ---- check ----
 zz_ef_ms_check_01:0 "Признаки пузыря: кредит $zz_ef_ms_x_credit_total$ $zz_ef_ms_cur$ = $zz_ef_ms_x_credit_to_gdp$ ВВП; пул — $zz_ef_ms_x_pool_months$ мес. взносов; накопления — $zz_ef_ms_x_savings_to_gdp$ ВВП"
