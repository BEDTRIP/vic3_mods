 zz_ef_ms_tt_pops:0 "#b Население за неделю#!\n1 Казна\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_income_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_poll_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_consumption_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_dividends_taxes]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_government_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_military_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_welfare_payments]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_interest] — держателям долга (владельцам резервов зданий)\n2 Касса предприятий\n  ← #P +[Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! зарплаты и дивиденды (оценка: ВВП / 52 − госвыплаты)\n  → #N −[Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend)), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend)))), Negate_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0'))), Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0'))|D] [Country.GetCustom('currency_symbol')]#! покупки товаров — остаток дохода (оценка)\n3 Вне счетов\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в накопления: остаток дохода — деньги, выпавшие из казны и касс предприятий (точно, по сохранению денег)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! из накоплений: вернулось в деньги движка больше, чем выпало\n\nДенег у населения в движке нет: остаток дохода движок превращает в достаток (число). Мод ловит эти деньги в накопления — по сохранению денег (мост GUI → скрипт): что пропало из казны и касс предприятий сверх известных переводов. Оплата заграницы (касса торговых центров) и необъяснённый остаток пула (выкуп уровней) сюда не входят. Часть накоплений лежит во вкладах — это снова деньги движка (пул).\n#b Потребительский кредит: долг [Country.MakeScope.ScriptValue('zz_ef_cc_debt')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_cc_debt_to_gdp')|%1] ВВП); предел 4 месяца дохода [Country.MakeScope.ScriptValue('zz_ef_cc_limit')|D] [Country.GetCustom('currency_symbol')], цель [Country.MakeScope.ScriptValue('zz_ef_cc_target')|D] [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('zz_ef_cc_share')|%0] предела по ставке: 100% при 2%, 0 при 12%); ставка [Country.MakeScope.ScriptValue('zz_ef_cc_rate')|%1] (ключевая + 3 п.п.), срок год. На эту неделю: выдано [Country.MakeScope.ScriptValue('zz_ef_v_f_cc_issue')|D] [Country.GetCustom('currency_symbol')], погашено [Country.MakeScope.ScriptValue('zz_ef_v_f_cc_repay')|D] [Country.GetCustom('currency_symbol')], проценты [Country.MakeScope.ScriptValue('zz_ef_v_f_cc_int')|D] [Country.GetCustom('currency_symbol')] — итого населению [Country.MakeScope.ScriptValue('zz_ef_v_f_cc_net')|D+=][Country.GetCustom('currency_symbol')], надбавка к доходу иждивенцев [Country.MakeScope.ScriptValue('zz_ef_cc_wage_add')|+=2] в год на иждивенца ([Country.MakeScope.ScriptValue('zz_ef_v_dependents')|D] иждивенцев).\nДоход населения ≈ ВВП / 52 = [Country.MakeScope.ScriptValue('zz_ef_gdp_week')|D] [Country.GetCustom('currency_symbol')].\n#b Накопления: [Country.MakeScope.ScriptValue('zz_ef_pop_savings')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_pop_savings_week')|D+=][Country.GetCustom('currency_symbol')] за неделю) — во вкладах [Country.MakeScope.ScriptValue('zz_ef_pop_deposits')|D] [Country.GetCustom('currency_symbol')], на руках [Country.MakeScope.ScriptValue('zz_ef_pop_cash')|D] [Country.GetCustom('currency_symbol')]. За неделю: выпало из денег движка [Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')|D+=][Country.GetCustom('currency_symbol')], проценты по вкладам [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_int')|D+=][Country.GetCustom('currency_symbol')]; внесено [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_in')|D] [Country.GetCustom('currency_symbol')], снято [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_out')|D] [Country.GetCustom('currency_symbol')]. Доля во вкладах — цель [Country.MakeScope.ScriptValue('zz_ef_deposit_share')|%0] (по ставке), ставка по вкладам [Country.MakeScope.ScriptValue('zz_ef_deposit_rate')|%1]."
