 zz_ef_ms_tt_treasury:0 "#b Казна за неделю: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Касса предприятий\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetTariffTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_tariffs] (платят импортёры)\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentShareDividendsTrend))|D] [Country.GetCustom('currency_symbol')]#! государственные дивиденды\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentShareLossesTrend))|D] [Country.GetCustom('currency_symbol')]#! убытки государственных предприятий\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentGoodsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_goods_for_government_buildings]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryGoodsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_goods_for_military_upkeep]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetConstructionGoodsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_construction_goods]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetSubsidiesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_subsidies]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetSubventionsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_subventions]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentSlavesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_government_slaves]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetMilitarySlavesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_military_slaves]\n  → #N −[Abs_CFixedPoint(Country.GetSupplyShipConstructionGoodsExpenses)|D] [Country.GetCustom('currency_symbol')]#! постройка кораблей снабжения\n  → #N −[Abs_CFixedPoint(Country.GetSupplyShipMaintenanceExpenses)|D] [Country.GetCustom('currency_symbol')]#! содержание корабл