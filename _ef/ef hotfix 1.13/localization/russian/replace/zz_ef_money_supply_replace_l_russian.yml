 MONEY_SUPPLY_DESC_fiat_standard:0 "Денежная масса:\nВсего #v Денежная масса#!: #p [Country.MakeScope.ScriptValue('total_money_supply')|D]#! [Country.GetCustom('currency_symbol')]\n - В собственности страны (M2): #T [Country.MakeScope.ScriptValue('money_supply')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_m2')|D+=][Country.GetCustom('currency_symbol')] за месяц)\n   M0 — наличные и деньги государства: #T [Country.MakeScope.ScriptValue('zz_ef_m0')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_cb Резервы центрального банка#!: #T [Country.MakeScope.ScriptValue('money_supply_state')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_treasury Казна#!: #T [Country.MakeScope.ScriptValue('zz_ef_treasury')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_savings Сбережения населения#!: #T [Country.MakeScope.ScriptValue('zz_ef_savings')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')])\n   M1 = M0 + касса предприятий: #T [Country.MakeScope.ScriptValue('zz_ef_m1')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_buildings Касса предприятий#!: #T [Country.MakeScope.ScriptValue('zz_ef_building_cash')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')])\n   M2 = M1 + средства банков: #T [Country.MakeScope.ScriptValue('money_supply')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_banks Средства банков#!: #T [Country.MakeScope.ScriptValue('zz_ef_pool')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')])\n       вклады [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')], кредит банков [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]: ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2] к вкладам, цель ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2]\n   Денежный мультипликатор M2 / M0: ×[Country.MakeScope.ScriptValue('zz_ef_m2_to_m0')|2]\n - В собственности других стран: #T [Country.MakeScope.ScriptValue('money_supply_stockpile_by_other_country')|D] [Country.GetCustom('currency_symbol')]#!\nГосдолг (не деньги): долг бюджета [Country.MakeScope.ScriptValue('zz_ef_debt_principal')|D] [Country.GetCustom('currency_symbol')], перед центральным банком [Country.MakeScope.ScriptValue('zz_ef_debt_cb_gold')|D] @gold!\n#italic Наведите на счёт — все переводы за месяц.#!\n\n#b Сверка — сырые числа движка, в неделю:#!\nпостоянные доходы [Country.MakeScope.ScriptValue('zz_ef_raw_fixed_income')|D], все доходы [Country.MakeScope.ScriptValue('zz_ef_raw_total_income')|D], income (движок) [Country.MakeScope.ScriptValue('zz_ef_raw_income')|D], чеканка [Country.MakeScope.ScriptValue('zz_ef_raw_minting_week')|D], постоянные расходы [Country.MakeScope.ScriptValue('zz_ef_raw_fixed_expenses')|D], все расходы [Country.MakeScope.ScriptValue('zz_ef_raw_total_expenses')|D], армия [Country.MakeScope.ScriptValue('zz_ef_raw_military')|D], переводы по договорам [Country.MakeScope.ScriptValue('zz_ef_raw_transfers_out')|D], недобранные налоги [Country.MakeScope.ScriptValue('zz_ef_raw_tax_waste')|D], пул: приход [Country.MakeScope.ScriptValue('zz_ef_raw_pool_gross')|D], пул: чистый [Country.MakeScope.ScriptValue('zz_ef_raw_pool_net')|D]\nэкспорт [Country.MakeScope.ScriptValue('zz_ef_raw_export_gold')|D] @gold!, импорт [Country.MakeScope.ScriptValue('zz_ef_raw_import_gold')|D] @gold!, ВВП в год [Country.MakeScope.ScriptValue('zz_ef_raw_gdp')|D]\n$TOOLTIP_DELIMITER$"
