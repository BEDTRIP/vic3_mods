 MONEY_SUPPLY_DESC_fiat_standard:0 "Денежная масса:\nВсего #v Денежная масса#!: #p [Country.MakeScope.ScriptValue('total_money_supply')|D]#! [Country.GetCustom('currency_symbol')]\n - В собственности страны (M2): #T [Country.MakeScope.ScriptValue('money_supply')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_m2')|D+=][Country.GetCustom('currency_symbol')] за месяц)\n   M0 — наличные и деньги государства: #T [Country.MakeScope.ScriptValue('zz_ef_m0')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_cb Резервы центрального банка#!: #T [Country.MakeScope.ScriptValue('money_supply_state')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_treasury Казна#!: #T [Country.MakeScope.ScriptValue('zz_ef_treasury')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')])\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_savings Сбережения населения#!: #T [Country.MakeScope.ScriptValue('zz_ef_savings')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')])\n   M1 = M0 + касса предприятий: #T [Country.MakeScope.ScriptValue('zz_ef_m1')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_ef_ms_tt_buildings Касса предприятий#!: #T [Country.MakeScope.ScriptValue('zz_ef_building_cash')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')])\n   M2 = M1 + средства банков: #T [Country.MakeScope.ScriptValue('money_supply')|D] [Country.GetCustom('currency_symbol')]#!\n    -> #tooltippable;tooltip:[Country.GetTooltipTag],zz_e