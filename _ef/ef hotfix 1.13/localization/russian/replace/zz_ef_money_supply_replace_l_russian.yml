 zz_ef_ms_banks_22:0 "  ← #P +$zz_ef_ms_x_v_f_pool_other$ $zz_ef_ms_cur$#! необъяснённый приход в пул"
 zz_ef_ms_banks_23:0 "  ↔ $zz_ef_ms_x_v_d_pool_rest$ $zz_ef_ms_cur$ прочее"
 zz_ef_ms_banks_24:0 "Инвестиционный пул. Частная стройка идёт через казну: пул → казна (трансфер) → предприятия (строительные товары). Банки занимают у ЦБ под ключевую ставку — долг идёт к доле ВВП по ставке (50% при 2%, 0 при 12%): ставка ниже — больше новых денег в пул, выше — банки гасят долг из пула."
 zz_ef_ms_banks_25:0 "Долг банков перед ЦБ $zz_ef_ms_x_bank_cb_debt$ $zz_ef_ms_cur$; цель $zz_ef_ms_x_cb_credit_target$ $zz_ef_ms_cur$ = ВВП × $zz_ef_ms_x_cb_credit_share$ от 50% при ставке $zz_ef_ms_x_money_rate$; 1.15% разрыва в неделю (~5% в месяц), но занимают только недостачу пула до потребности $zz_ef_ms_x_pool_need$ $zz_ef_ms_cur$ (3 месяца выплат пула), а свободные деньги сверх неё идут на погашение. Пул — $zz_ef_ms_x_pool_months$ мес. взносов."
 zz_ef_ms_banks_26:0 "#b Кредит бизнесу: долг предприятий $zz_ef_ms_x_bc_debt$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_bc_debt_to_gdp$ ВВП). Частная стройка за неделю оплачена заёмными деньгами банков на $zz_ef_ms_x_bc_borrowed_share$ (кредит ЦБ и вклады к пулу): новый долг $zz_ef_ms_x_v_f_bc_new$ $zz_ef_ms_cur$; проценты $zz_ef_ms_x_v_f_bc_int$ $zz_ef_ms_cur$ (ключевая + 3 п.п.), срок 5 лет; из взносов зданий в счёт долга $zz_ef_ms_x_v_f_bc_paid$ $zz_ef_ms_cur$ ($zz_ef_ms_x_bc_service_share$ взносов) — деньги из касс в пул. Не хватает взносов — владельцы отдают больше дохода в пул вместо дивидендов: сейчас +$zz_ef_ms_x_v_bc_svc$% доли взносов (до +30%)."

