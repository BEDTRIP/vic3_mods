 zz_ef_ms_tt_savings:0 "#b Сбережения населения за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n  приток — спрос на валюту, доля страны в рынке: [Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')|D+=][Country.GetCustom('currency_symbol')]\n  → казна: налоги (оценка): [Country.MakeScope.ScriptValue('zz_ef_f_taxes_neg')|D+=][Country.GetCustom('currency_symbol')]\n  → предприятия: траты на товары: [Country.MakeScope.ScriptValue('zz_ef_f_goods_neg')|D+=][Country.GetCustom('currency_symbol')]\n  ↔ банки: вклады (минус) / изъятия (плюс): [Country.MakeScope.ScriptValue('zz_ef_f_deposits_neg')|D+=][Country.GetCustom('currency_symbol')]\n  поправка: срез выше 2 ВВП: [Country.MakeScope.ScriptValue('zz_ef_f_cap_neg')|D+=][Country.GetCustom('currency_symbol')]\n  прочее: [Country.MakeScope.ScriptValue('zz_ef_other_savings')|D+=][Country.GetCustom('currency_symbol')]\n\nНаличные у населения. Приток — спрос рынка на валюту (E&F), делится между странами рынка по доле ВВП. Траты на товары и налоги ≈ ВВП − взносы в пул; из большого запаса тратят целиком, из малого — почти ничего. Доля налогов в тратах — оценка: доход бюджета без чеканки / траты населения.\n\nТраты населения в месяц (оценка): [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = ВВП / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − взносы в пул [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('currency_symbol')]. Из сбережений потрачено [Country.MakeScope.ScriptValue('zz_ef_v_f_outflow')|D] [Country.GetCustom('currency_symbol')]."
 zz_ef_ms_tt_banks:0 "#b Средства банков за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n  ← население: вклады / изъятия: [Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')|D+=][Country.GetCustom('currency_symbol')]\n  новый кредит банков (+) / сжатие (−): [Country.MakeScope.ScriptValue('zz_ef_v_f_credit')|D+=][Country.GetCustom('currency_symbol')]\n  ← население и здания: взносы в пул (ваниль): [Country.MakeScope.ScriptValue('zz_ef_v_f_contrib')|D+=][Country.GetCustom('currency_symbol')]\n  → предприятия: частная стройка: [Country.MakeScope.ScriptValue('zz_ef_f_construction_neg')|D+=][Country.GetCustom('currency_symbol')]\n  прочее: [Country.MakeScope.ScriptValue('zz_ef_other_pool')|D+=][Country.GetCustom('currency_symbol')]\n\nВклады [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('zz_ef_v_d_deposits')|D+=][Country.GetCustom('currency_symbol')]), кредит банков [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]. Банки тянут средства к вкладам × множитель: сейчас ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], цель ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1] (×3 при 2%, ×1.2 при 12%). Прочее — госстройка из пула, проценты по облигациям."
 zz_ef_ms_tt_treasury:0 "#b Казна за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n  налоги и прочие доходы бюджета (оценка): [Country.MakeScope.ScriptValue('zz_ef_v_f_taxes_all')|D+=][Country.GetCustom('currency_symbol')]\n  чеканка — новые деньги: [Country.MakeScope.ScriptValue('zz_ef_v_f_minting')|D+=][Country.GetCustom('currency_symbol')]\n  прочее: расходы, пошлины, пакты, займы: [Country.MakeScope.ScriptValue('zz_ef_other_treasury')|D+=][Country.GetCustom('currency_symbol')]\n\nДеньги государства — часть M0. Полный бюджет — «Деньги» в верхней панели. Чеканка — единственная статья бюджета, которая создаёт деньги; займы создают деньги вместе с долгом."
 zz_ef_ms_tt_buildings:0 "#b Касса предприятий за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')]#!\n  ← население: траты на товары: [Country.MakeScope.ScriptValue('zz_ef_v_f_goods')|D+=][Country.GetCustom('currency_symbol')]\n  ← банки: частная стройка: [Country.MakeScope.ScriptValue('zz_ef_v_f_construction')|D+=][Country.GetCustom('currency_symbol')]\n  прочее: зарплаты, дивиденды, закупки, экспорт: [Country.MakeScope.ScriptValue('zz_ef_other_buildings')|D+=][Country.GetCustom('currency_symbol')]\n\nДенежные резервы зданий. Движок отдаёт их только внутри кредитного лимита страны: лимит − база − доля ВВП (константы COUNTRY_MIN_CREDIT_*). Зарплат и дивидендов по отдельности скрипту не видно — они в «прочем»."
 zz_ef_ms_tt_cb:0 "#b Резервы центрального банка за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n  по расчёту E&F (выпуск, выкуп, девальвация): [Country.MakeScope.ScriptValue('money_supply_state_monthly')|D+=][Country.GetCustom('currency_symbol')]\n\nВалюта, которую держит центральный банк, вне обращения."
