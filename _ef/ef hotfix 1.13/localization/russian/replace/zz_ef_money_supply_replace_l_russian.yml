 zz_ef_ms_tt_savings:0 "#b Сбережения населения за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_taxes'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! налоги (модель, оценка)\n2 Касса предприятий\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_goods'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупки товаров (модель)\n3 Средства банков\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! вклады\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! изъятия вкладов\n4 Резервы центрального банка\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в обращение: спрос рынка на валюту — доля страны (E&F)\n5 Заграница\n  нет переводов\n6 Вне счетов\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cap'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! срез выше 2 ВВП\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_savings'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_taxes'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_goods'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_deposits')), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cap'), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] прочее — не видно скрипту\n\nНаличные у населения — модель: денег у групп населения в движке нет. Бюджетные выплаты населению и налоги по видам — в карточке казны; сбережения свяжутся с ними на шаге «сбережения из потоков».\nТраты населения в месяц (модель): [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = ВВП / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − взносы в пул [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('currency_symbol')]; из сбережений потрачено [Country.MakeScope.ScriptValue('zz_ef_v_f_outflow')|D] [Country.GetCustom('currency_symbol')]."
