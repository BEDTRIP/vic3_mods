 12 − госвыплаты)\n  → #N −[Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend), '(CFixedPoint)4.333')), Negate_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend), '(CFixedPoint)4.333')))), Negate_CFixedPoint(Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend), '(CFixedPoint)4.333')))), Negate_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_month'), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend), '(CFixedPoint)4.333'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend), '(CFixedPoint)4.333'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend), '(CFixedPoint)4.333'))), '(CFixedPoint)0'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend), '(CFixedPoint)4.333'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend), '(CFixedPoint)4.333'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend), '(CFixedPoint)4.333'))), Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend), '(CFixedPoint)4.333')))|D] [Country.GetCustom('currency_symbol')]#! покупки товаров и прирост достатка — остаток дохода\n\nДенег у населения в движке нет: доход уходит на налоги и покупки, остаток становится достатком (числом, а не деньгами) — поэтому движок деньги не сохраняет.\nДоход населения ≈ ВВП / 12 = [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')]."
 zz_ef_ms_tt_cb:0 "#b Центральный банк за месяц#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! прибыль ЦБ: проценты банков\n2 Средства банков\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n3 Вне счетов\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! выпуск: кредит банкам — новые деньги\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашено — деньги изъяты\n\nВ деньгах движка у ЦБ запаса нет: кредит банкам — новые деньги, погашение их изымает, проценты уходят в казну. Склад товара-валюты E&F — отдельно, в штуках."
 zz_ef_ms_tt_abroad:0 "#b Заграница за месяц#!\n1 Казна\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetTreatiesIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPowerBlocIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(Country.GetMarketFeesIncome, '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_supply_network] (сборы с участников рынка)\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(Country.PredictTolls, '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_tolls]\n  → #N −[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPiracyIncomeTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_piracy]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetTreatiesExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  ← #P +[Abs_CFixedPoint(Multiply_CFixedPoint(GetTrendValue(Country.GetPowerBlocExpenseTrend), '(CFixedPoint)4.333'))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n2 Касса предприятий\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_month'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: экспорт сверх импорта (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_month')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: импорт сверх экспорта (E&F)\n3 Средства банков\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупка облигаций других стран частными банками (E&F)\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение облигаций других стран (E&F)\n\nЗапаса у счёта нет — только переводы."
 zz_ef_ms_tt_fx:0 "#b Склад товара-валюты ЦБ (E&F) за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=] шт.#!\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_issue_month')|D]#! шт. выпуск: продажи товара-валюты на рынке\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_own')|D]#! шт. в обращение: здания и население страны\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_others')|D]#! шт. в обращение: другие страны рынка\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_devaluation_month')|D]#! шт. девальвация\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_revaluation_month')|D]#! шт. ревальвация\n\nЭто не деньги, а штуки товара liquidity_currency (E&F считает их × 4 в месяц и рисует значком валюты). В деньгах движка ЦБ — обычное здание: его выручка в кассе предприятий."
