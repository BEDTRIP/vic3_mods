 zz_ef_ms_pops_25:0 "Денег у населения в движке нет: остаток дохода движок превращает в достаток (число). Мод ловит эти деньги в накопления — по сохранению денег (мост GUI → скрипт): что пропало из казны и касс предприятий сверх известных переводов. Оплата заграницы (касса торговых центров) и необъяснённый остаток пула (выкуп уровней) сюда не входят. Часть накоплений лежит во вкладах — это снова деньги движка (пул)."
 zz_ef_ms_pops_26:0 "#b Потребительский кредит: долг $zz_ef_ms_x_cc_debt$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_cc_debt_to_gdp$ ВВП); предел 4 месяца дохода $zz_ef_ms_x_cc_limit$ $zz_ef_ms_cur$, цель $zz_ef_ms_x_cc_target$ $zz_ef_ms_cur$ ($zz_ef_ms_x_cc_share$ предела по ставке: 100% при 2%, 0 при 12%); ставка $zz_ef_ms_x_cc_rate$ (ключевая + 3 п.п.), срок год. На эту неделю: выдано $zz_ef_ms_x_v_f_cc_issue$ $zz_ef_ms_cur$, погашено $zz_ef_ms_x_v_f_cc_repay$ $zz_ef_ms_cur$, проценты $zz_ef_ms_x_v_f_cc_int$ $zz_ef_ms_cur$ — итого населению $zz_ef_ms_x_v_f_cc_net$$zz_ef_ms_cur$, надбавка к доходу иждивенцев $zz_ef_ms_x_cc_wage_add$ в год на иждивенца ($zz_ef_ms_x_v_dependents$ иждивенцев)."
 zz_ef_ms_pops_27:0 "Доход населения ≈ ВВП / 52 = $zz_ef_ms_x_gdp_week_2$ $zz_ef_ms_cur$."
 zz_ef_ms_pops_28:0 "#b Накопления: $zz_ef_ms_x_pop_savings$ $zz_ef_ms_cur$#! ($zz_ef_ms_x_pop_savings_week$$zz_ef_ms_cur$ за неделю) — во вкладах $zz_ef_ms_x_pop_deposits$ $zz_ef_ms_cur$, на руках $zz_ef_ms_x_pop_cash$ $zz_ef_ms_cur$. За неделю: выпало из денег движка $zz_ef_ms_x_v_f_inflow_2$$zz_ef_ms_cur$, продажа уровней компаниям $zz_ef_ms_x_v_f_buyout_2$$zz_ef_ms_cur$, проценты по вкладам $zz_ef_ms_x_v_f_dep_int$$zz_ef_ms_cur$; внесено $zz_ef_ms_x_v_f_dep_in$ $zz_ef_ms_cur$, снято $zz_ef_ms_x_v_f_dep_out$ $zz_ef_ms_cur$ (в средствах банков — в изменении следующей недели). Норма наличных на руках — $zz_ef_ms_x_pop_cash_norm$ $zz_ef_ms_cur$ ($zz_ef_ms_x_cash_norm_gdp$ ВВП: 20% при ставке по вкладам 0%, 12% при 3%, не ниже 6%); сверх неё население вносит во вклады, ниже — снимает, по 10% разрыва в неделю. Ставка по вкладам $zz_ef_ms_x_deposit_rate$ = ключевая − маржа банков $zz_ef_ms_x_deposit_margin$ (1.5 п.п. + 1 п.п. за каждую потребность пула свободных денег)."

