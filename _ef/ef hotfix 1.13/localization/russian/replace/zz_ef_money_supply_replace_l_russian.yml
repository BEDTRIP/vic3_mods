ol_gross')|D], пул: чистый [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_pool_net')|D]\nэкспорт [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_export_gold')|D] @gold!, импорт [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_import_gold')|D] @gold!, ВВП в год [GetPlayer.MakeScope.ScriptValue('zz_ef_raw_gdp')|D]\n$TOOLTIP_DELIMITER$"
 zz_ef_ms_tt_savings:0 "#b Сбережения населения за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_1')|D] [Country.GetCustom('currency_symbol')]#! налоги (оценка)\n2 Касса предприятий\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_1')|D] [Country.GetCustom('currency_symbol')]#! покупки товаров\n3 Средства банков\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_1')|D] [Country.GetCustom('currency_symbol')]#! изъятия вкладов\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_2')|D] [Country.GetCustom('currency_symbol')]#! вклады\n4 Резервы центрального банка\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_1')|D] [Country.GetCustom('currency_symbol')]#! спрос рынка на валюту — доля страны\n5 Вне счетов\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_1')|D] [Country.GetCustom('currency_symbol')]#! срез выше 2 ВВП\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_2')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_3')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n\nНаличные у населения — модель: денег у групп населения в движке нет. Налоги и покупки — оценка (ВВП / 12 − взносы в пул; доля налогов — доход бюджета без чеканки).\nТраты населения в месяц: [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = ВВП / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − взносы в пул [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('currency_symbol')]; из сбережений потрачено [Country.MakeScope.ScriptValue('zz_ef_v_f_outflow')|D] [Country.GetCustom('currency_symbol')]."
 zz_ef_ms_tt_treasury:0 "#b Казна за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_treasury')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_savings_1')|D] [Country.GetCustom('currency_symbol')]#! налоги из сбережений (оценка)\n2 Касса предприятий\n  нет переводов, видимых скрипту\n3 Средства банков\n  нет переводов, видимых скрипту\n4 Резервы центрального банка\n  нет переводов, видимых скрипту\n5 Вне счетов\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_1')|D] [Country.GetCustom('currency_symbol')]#! чеканка — новые деньги\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_2')|D] [Country.GetCustom('currency_symbol')]#! прочие доходы бюджета\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_3')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_treasury_ext_4')|D] [Country.GetCustom('currency_symbol')]#! расходы бюджета и прочее\n\nДеньги государства — часть M0. Полный бюджет — «Деньги» в верхней панели."
 zz_ef_ms_tt_buildings:0 "#b Касса предприятий за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_buildings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_savings_1')|D] [Country.GetCustom('currency_symbol')]#! покупки населения\n2 Казна\n  нет переводов, видимых скрипту\n3 Средства банков\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_banks_1')|D] [Country.GetCustom('currency_symbol')]#! стройка из пула\n4 Резервы центрального банка\n  нет переводов, видимых скрипту\n5 Вне счетов\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_1')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_buildings_ext_2')|D] [Country.GetCustom('currency_symbol')]#! зарплаты, дивиденды, закупки, импорт и прочее\n\nДенежные резервы зданий: кредитный лимит − база − доля ВВП (COUNTRY_MIN_CREDIT_*)."
 zz_ef_ms_tt_banks:0 "#b Средства банков за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_1')|D] [Country.GetCustom('currency_symbol')]#! вклады\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_savings_2')|D] [Country.GetCustom('currency_symbol')]#! изъятия вкладов\n2 Казна\n  нет переводов, видимых скрипту\n3 Касса предприятий\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_buildings_1')|D] [Country.GetCustom('currency_symbol')]#! стройка — частная и через казну\n4 Резервы центрального банка\n  нет переводов, видимых скрипту\n5 Вне счетов\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_1')|D] [Country.GetCustom('currency_symbol')]#! новый кредит банков\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_2')|D] [Country.GetCustom('currency_symbol')]#! взносы в пул — население и здания (ваниль)\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_3')|D] [Country.GetCustom('currency_symbol')]#! сжатие кредита\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_4')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_banks_ext_5')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n\nБанки тянут средства к вкладам × множитель (×3 при 2%, ×1.2 при 12%).\nВклады [Country.MakeScope.ScriptValue('zz_ef_deposits')|D] [Country.GetCustom('currency_symbol')], кредит банков [Country.MakeScope.ScriptValue('zz_ef_bank_credit')|D] [Country.GetCustom('currency_symbol')]: сейчас ×[Country.MakeScope.ScriptValue('zz_ef_pool_to_deposits')|2], цель ×[Country.MakeScope.ScriptValue('zz_ef_credit_multiplier')|2] при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Резервы центрального банка за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Сбережения населения\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_savings_1')|D] [Country.GetCustom('currency_symbol')]#! в обращение: спрос рынка — доля страны\n2 Казна\n  нет переводов, видимых скрипту\n3 Касса предприятий\n  нет переводов, видимых скрипту\n4 Средства банков\n  нет переводов, видимых скрипту\n5 Вне счетов\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_1')|D] [Country.GetCustom('currency_symbol')]#! выпуск: продажи товара-валюты на рынке\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_2')|D] [Country.GetCustom('currency_symbol')]#! в обращение: другим странам рынка\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_3')|D] [Country.GetCustom('currency_symbol')]#! девальвация\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_4')|D] [Country.GetCustom('currency_symbol')]#! ревальвация\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_5')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_lg_cb_ext_6')|D] [Country.GetCustom('currency_symbol')]#! прочее — не видно скрипту\n\nВалюта, которую держит центральный банк, вне обращения. Выпуск и спрос — рынок товара-валюты за месяц (E&F, у хозяина рынка)."
