ate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_tc')), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_tc'), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] прочее\n\nЗаграница — требования страны к другим странам: облигации частных банков и казны (E&F). Все платежи с заграницей идут через ЦБ: чистый отток списывает его металл (механизм Юма)."
 zz_ef_ms_tt_cb:0 "#b Центральный банк за неделю: [Country.MakeScope.ScriptValue('zz_ef_v_d_cbm')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! прибыль ЦБ: проценты банков\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! E&F: казна гасит долг ЦБ (сверх бюджета)\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! E&F: прочий приход в казну сверх бюджета\n2 Средства банков\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n3 Вне счетов\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! выпуск: кредит банкам — новые деньги\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашено — деньги изъяты\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_cbm'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb')), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_tr_to_cb'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')))|D+=] [Country.GetCustom('currency_symbol')] прочее\n\nЦБ — расчётный агент страны: все платежи с заграницей идут через него. Кредит банкам — новые деньги, погашение их изымает, проценты уходят в казну. Запас счёта — резервы металла (и склад товара-валюты E&F в штуках): чистый отток за рубеж по курсу списывает металл, приток — добавляет (механизм Юма, только металлический стандарт с ЦБ). Резервы — покрытие валюты, а не деньги: в M0–M3 не входят, иначе отток за рубеж считался бы дважды (деньги ушли из пула или касс и тот же металл ушёл из ЦБ). Отток уменьшает деньги и покрытие на одну сумму; торговый баланс E&F в резервы больше не входит.\n#b Резервы металла: [Country.MakeScope.ScriptValue('zz_ef_cb_metal')|D] @gold!#! (за неделю [Country.MakeScope.ScriptValue('zz_ef_v_f_hume')|D+=]); чистый поток с заграницей [Country.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=][Country.GetCustom('currency_symbol')]; курс [Country.MakeScope.ScriptValue('money_value_0')|3] металла за [Country.GetCustom('currency_symbol')]; покрытие по паритету [Country.MakeScope.ScriptValue('zz_ef_cb_cover')|%0]. Склад товара-валюты [Country.MakeScope.ScriptValue('money_supply_state')|D] шт."
