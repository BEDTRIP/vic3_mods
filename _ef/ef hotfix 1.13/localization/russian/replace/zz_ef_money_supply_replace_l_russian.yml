 zz_ef_ms_tt_banks:0 "#b Средства банков за неделю: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_transfer'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_investment_income]: на стройку\n2 Касса предприятий\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! взносы в пул — инвестиции зданий и сбережения богатых (ваниль)\n3 Население\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_in'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! вклады населения из накоплений\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_out'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! снятие вкладов\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_int'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по вкладам\n4 Центральный банк\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n5 Заграница\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупка облигаций других стран частными банками (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение облигаций других стран (E&F)\n6 Вне счетов\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_pool'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_transfer'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_in'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_out'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_int'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0'))|D+=] [Country.GetCustom('currency_symbol')] прочее\n\nИнвестиционный пул. Частная стройка идёт через казну: пул → казна (трансфер) → предприятия (строительные товары). Банки держат в пуле взносы за несколько месяцев (12 при ставке 2%, 3 при 12%): ниже — занимают у ЦБ под ключевую ставку, выше — гасят долг.\nДолг банков перед ЦБ [Country.MakeScope.ScriptValue('zz_ef_bank_cb_debt')|D] [Country.GetCustom('currency_symbol')]; цель пула [Country.MakeScope.ScriptValue('zz_ef_pool_target')|D] [Country.GetCustom('currency_symbol')] = взносы за месяц × [Country.MakeScope.ScriptValue('zz_ef_credit_months')|1] мес. при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]; занимают и гасят 1.15% разрыва в неделю (~5% в месяц)."
 zz_ef_ms_tt_pops:0 "#b Население за неделю#!\n1 Казна\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_income_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_poll_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_consumption_taxes]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_dividends_taxes]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_government_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_military_wages]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_welfare_payments]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_interest] — держателям долга (владельцам резервов зданий)\n2 Касса предприятий\n  ← #P +[Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! зарплаты и дивиденды (оценка: ВВП / 52 − госвыплаты)\n  → #N −[Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend)), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend)))), Negate_CFixedPoint(Abs_CFixedPoint(GetTrendValue(Country.GetInterestExpenseTrend)))), Negate_CFixedPoint(Max_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_gdp_week'), Abs_CFixedPoint(GetTrendValue(Country.GetGovernmentWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetMilitaryWagesExpenseTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetWelfarePaymentsTrend))), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0'))), Abs_CFixedPoint(GetTrendValue(Country.GetTaxIncomeTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetPollTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetConsumptionTaxTrend))), Abs_CFixedPoint(GetTrendValue(Country.GetDividendsTaxTrend))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0'))|D] [Country.GetCustom('currency_symbol')]#! покупки товаров — остаток дохода (оценка)\n3 Вне счетов\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! в накопления: деньги, выпавшие из денег движка (точно, слитно: остаток дохода и оплата заграницы внутри рынка)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! из накоплений: вернулось в деньги движка больше, чем выпало\n\nДенег у населения в движке нет: остаток дохода движок превращает в достаток (число). Мод ловит эти деньги в накопления — точно, по сохранению денег (мост GUI → скрипт), но слитно с оплатой заграницы внутри рынка. Часть накоплений лежит во вкладах — это снова деньги движка (пул).\nДоход населения ≈ ВВП / 52 = [Country.MakeScope.ScriptValue('zz_ef_gdp_week')|D] [Country.GetCustom('currency_symbol')].\n#b Накопления: [Country.MakeScope.ScriptValue('zz_ef_pop_savings')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_pop_savings_week')|D+=][Country.GetCustom('currency_symbol')] за неделю) — во вкладах [Country.MakeScope.ScriptValue('zz_ef_pop_deposits')|D] [Country.GetCustom('currency_symbol')], на руках [Country.MakeScope.ScriptValue('zz_ef_pop_cash')|D] [Country.GetCustom('currency_symbol')]. За неделю: выпало из денег движка [Country.MakeScope.ScriptValue('zz_ef_v_f_inflow')|D+=][Country.GetCustom('currency_symbol')], проценты по вкладам [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_int')|D+=][Country.GetCustom('currency_symbol')]; внесено [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_in')|D] [Country.GetCustom('currency_symbol')], снято [Country.MakeScope.ScriptValue('zz_ef_v_f_dep_out')|D] [Country.GetCustom('currency_symbol')]. Доля во вкладах — цель [Country.MakeScope.ScriptValue('zz_ef_deposit_share')|%0] (по ставке), ставка по вкладам [Country.MakeScope.ScriptValue('zz_ef_deposit_rate')|%1]."
 zz_ef_ms_tt_cb:0 "#b Центральный банк за неделю#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! прибыль ЦБ: проценты банков\n2 Средства банков\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n3 Вне счетов\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! выпуск: кредит банкам — новые деньги\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашено — деньги изъяты\n\nВ деньгах движка у ЦБ запаса нет: кредит банкам — новые деньги, погашение их изымает, проценты уходят в казну. Склад товара-валюты E&F — отдельно, в штуках."
 zz_ef_ms_tt_abroad:0 "#b Заграница за неделю#!\n1 Казна\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetTreatiesIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPowerBlocIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n  → #N −[Abs_CFixedPoint(Country.GetMarketFeesIncome)|D] [Country.GetCustom('currency_symbol')]#! [concept_supply_network] (сборы с участников рынка)\n  → #N −[Abs_CFixedPoint(Country.PredictTolls)|D] [Country.GetCustom('currency_symbol')]#! [concept_tolls]\n  → #N −[Abs_CFixedPoint(GetTrendValue(Country.GetPiracyIncomeTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_piracy]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetDiplomaticPactsExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_diplomatic_pacts]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetTreatiesExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_treaties]\n  ← #P +[Abs_CFixedPoint(GetTrendValue(Country.GetPowerBlocExpenseTrend))|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_power_bloc]\n2 Касса предприятий\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_week'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: экспорт сверх импорта (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_trade_week')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! торговля: импорт сверх экспорта (E&F)\n3 Средства банков\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупка облигаций других стран частными банками (E&F)\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение облигаций других стран (E&F)\n\nЗапаса у счёта нет — только переводы."
 zz_ef_ms_tt_fx:0 "#b Склад товара-валюты ЦБ (E&F) за месяц: [Country.MakeScope.ScriptValue('zz_ef_v_d_cb')|D+=] шт.#!\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_issue_month')|D]#! шт. выпуск: продажи товара-валюты на рынке\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_own')|D]#! шт. в обращение: здания и население страны\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_demand_others')|D]#! шт. в обращение: другие страны рынка\n  ← #P +[Country.MakeScope.ScriptValue('zz_ef_cb_devaluation_month')|D]#! шт. девальвация\n  → #N −[Country.MakeScope.ScriptValue('zz_ef_cb_revaluation_month')|D]#! шт. ревальвация\n\nЭто не деньги, а штуки товара liquidity_currency (E&F считает их × 4 в месяц и рисует значком валюты). В деньгах движка ЦБ — обычное здание: его выручка в кассе предприятий."
