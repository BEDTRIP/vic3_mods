 zz_ef_ms_abroad_22:0 "Заграница — требования страны к другим странам: облигации частных банков и казны (E&F). Все платежи с заграницей идут через ЦБ: чистый отток списывает его металл (механизм Юма). Платежи требований не меняют — они в «прочее» не входят; «прочее» — изменение облигаций, не объяснённое покупками и погашениями."

