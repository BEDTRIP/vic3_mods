 zz_ef_ms_tt_banks:0 "#b Средства банков за неделю: [Country.MakeScope.ScriptValue('zz_ef_v_d_pool')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Казна\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_transfer'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! [concept_budget_investment_income]: на стройку\n2 Касса предприятий\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! взносы в пул — инвестиции зданий и сбережения богатых (ваниль)\n3 Население\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_in'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! вклады населения из накоплений\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_out'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! снятие вкладов\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_int'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по вкладам\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_issue'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! потребительский кредит: выдано\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! потребительский кредит: погашено\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_int'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! потребительский кредит: проценты\n4 Заграница\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! покупка облигаций других стран частными банками (E&F)\n  ← #P +[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение облигаций других стран (E&F)\n5 Центральный банк\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! кредит банкам под ключевую ставку\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! погашение кредита ЦБ\n  → #N −[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! проценты по кредиту ЦБ\n6 Вне счетов\n  → #N −[Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_pool_other')), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! выкуп уровней зданий по цене приватизации (15 000 за уровень) — деньги выходят из обращения (необъяснённый остаток пула)\n  ← #P +[Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_pool_other'), '(CFixedPoint)0')|D] [Country.GetCustom('currency_symbol')]#! необъяснённый приход в пул\n  ↔ [Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Subtract_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_pool'), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_transfer'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_contrib'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_in'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_out'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_dep_int'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_issue'), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_repay'), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_w_cc_int'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds'), '(CFixedPoint)0'))), Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_d_bonds')), '(CFixedPoint)0')), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_borrow'), '(CFixedPoint)0')), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_repay'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_cb_interest'), '(CFixedPoint)0'))), Negate_CFixedPoint(Max_CFixedPoint(Negate_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_pool_other')), '(CFixedPoint)0'))), Max_CFixedPoint(Country.MakeScope.ScriptValue('zz_ef_v_f_pool_other'), '(CFixedPoint)0'))|D+=] [Country.GetCustom('currency_symbol')] прочее\n\nИнвестиционный пул. Частная стройка идёт через казну: пул → казна (трансфер) → предприятия (строительные товары). Банки держат в пуле взносы за несколько месяцев (12 при ставке 2%, 3 при 12%): ниже — занимают у ЦБ под ключевую ставку, выше — гасят долг.\nДолг банков перед ЦБ [Country.MakeScope.ScriptValue('zz_ef_bank_cb_debt')|D] [Country.GetCustom('currency_symbol')]; цель пула [Country.MakeScope.ScriptValue('zz_ef_pool_target')|D] [Country.GetCustom('currency_symbol')] = взносы за месяц × [Country.MakeScope.ScriptValue('zz_ef_credit_months')|1] мес. при ставке [Country.MakeScope.ScriptValue('zz_ef_money_rate')|%1]; занимают и гасят 1.15% разрыва в неделю (~5% в месяц). Вклады идут к цели на 5% разрыва в неделю.\n#b Кредит бизнесу (учёт): долг предприятий [Country.MakeScope.ScriptValue('zz_ef_bc_debt')|D] [Country.GetCustom('currency_symbol')]#! ([Country.MakeScope.ScriptValue('zz_ef_bc_debt_to_gdp')|%1] ВВП). Частная стройка за неделю оплачена заёмными деньгами банков на [Country.MakeScope.ScriptValue('zz_ef_bc_borrowed_share')|%0] (кредит ЦБ и вклады к пулу): новый долг [Country.MakeScope.ScriptValue('zz_ef_v_f_bc_new')|D] [Country.GetCustom('currency_symbol')]; проценты [Country.MakeScope.ScriptValue('zz_ef_v_f_bc_int')|D] [Country.GetCustom('currency_symbol')] (ключевая + 3 п.п.), срок 5 лет; из взносов зданий в счёт долга [Country.MakeScope.ScriptValue('zz_ef_v_f_bc_paid')|D] [Country.GetCustom('currency_symbol')] ([Country.MakeScope.ScriptValue('zz_ef_bc_service_share')|%0] взносов). Деньги не двигаются — только учёт."
