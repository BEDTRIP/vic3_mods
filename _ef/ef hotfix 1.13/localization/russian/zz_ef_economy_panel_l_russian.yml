l_russian:
 zz_ef_ep_current_account:0 "Текущий счёт за неделю"
 zz_ef_ep_current_account_tt:0 "Чистый поток с заграницей за неделю — то же число, что «итого» в карточке «Заграница» подсказки денежной массы: статьи бюджета с заграницей, торговый баланс рынка, дивиденды из-за рубежа, покупка чужих облигаций. ЦБ сводит его через мировой клиринг на следующем недельном шаге: отток — металлом (доля по доверию к валюте) и нашей валютой, приток — металлом и валютами плательщиков."
 zz_ef_ep_trade_tt:0 "Торговый баланс рынка за неделю: экспорт − импорт всех товаров по ценам рынка (в деньгах движка)."
 zz_ef_ep_week_market_prices:0 "за неделю, по ценам рынка"
 zz_ef_ep_cbfx_units:0 "Количество"
 zz_ef_ep_cbfx_money:0 "В наших деньгах"
 zz_ef_ep_cbfx_gold:0 "В золоте (за неделю)"
 zz_ef_ep_holders_title:0 "У кого наша валюта"
 zz_ef_ep_bank_holders_title:0 "У каких банков наша валюта"
 zz_ef_ep_bop:0 "#b Платёжный баланс за неделю#!\n#P Получено / у нас: +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_in_total')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_exp')|D] [GetPlayer.GetCustom('currency_symbol')]#! экспорт товаров (по ценам рынка)\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_div_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! дивиденды из-за рубежа (оценка)\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_int_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! проценты по облигациям\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_sec_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! статьи бюджета с заграницей\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_fin_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! продано / погашено облигаций других стран\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_oth_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! прочее\n#N Отдано / мы должны: −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_out_total')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_imp')|D] [GetPlayer.GetCustom('currency_symbol')]#! импорт товаров (по ценам рынка)\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_div_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! дивиденды за рубеж (оценка)\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_int_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! проценты по облигациям\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_sec_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! статьи бюджета с заграницей\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_fin_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! куплено облигаций других стран\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_oth_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! прочее\n#b Сальдо [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!\nНа что влияет: сальдо → мировой клиринг → резервы ЦБ [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_reserves_money')|D+=] [GetPlayer.GetCustom('currency_symbol')] (металл [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_metal_money')|D+=], валюта [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_fx_money')|D+=]) → покрытие [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_cover')|%0] → курс (сила к эталону [GetPlayer.MakeScope.ScriptValue('zz_ef_currency_strength')|2])\n  не сведено клирингом [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_unsettled')|D+=] [GetPlayer.GetCustom('currency_symbol')] — платежи без оплаты\n#b Чистая международная позиция [GetPlayer.MakeScope.ScriptValue('zz_ef_abroad_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!"
