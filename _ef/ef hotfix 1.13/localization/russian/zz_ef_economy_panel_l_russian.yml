l_russian:
 zz_ef_ep_current_account:0 "Текущий счёт за неделю"
 zz_ef_ep_current_account_tt:0 "Чистый поток с заграницей за неделю — то же число, что «итого» в карточке «Заграница» подсказки денежной массы: статьи бюджета с заграницей, торговый баланс рынка, дивиденды из-за рубежа, покупка чужих облигаций. ЦБ сводит его через мировой клиринг на следующем недельном шаге: отток — металлом (доля по доверию к валюте) и нашей валютой, приток — металлом и валютами плательщиков."
 zz_ef_ep_trade_tt:0 "Торговый баланс рынка за неделю: экспорт − импорт всех товаров по ценам рынка (в деньгах движка)."
 zz_ef_ep_week_market_prices:0 "за неделю, по ценам рынка"
 zz_ef_ep_cbfx_units:0 "Количество"
 zz_ef_ep_cbfx_money:0 "В наших деньгах"
 zz_ef_ep_cbfx_gold:0 "В золоте (за неделю)"
 zz_ef_ep_holders_title:0 "У кого наша валюта"
 zz_ef_ep_bank_holders_title:0 "У каких банков наша валюта"
 zz_ef_ep_bop:0 "#b Платёжный баланс за неделю#!\nТекущий счёт: [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_current')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  торговля товарами [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_trade')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  первичные доходы (дивиденды, проценты) [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_primary')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n  вторичные доходы (статьи бюджета с заграницей) [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_secondary')|D+=] [GetPlayer.GetCustom('currency_symbol')]\nФинансовый счёт (облигации других стран): [GetPlayer.MakeScope.ScriptValue('zz_ef_bop_financial')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n#b Сальдо [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#! → мировой клиринг\nРезервные активы: [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_reserves_money')|D+=] [GetPlayer.GetCustom('currency_symbol')] (металл [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_metal_money')|D+=] [GetPlayer.GetCustom('currency_symbol')], валюта [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_fx_money')|D+=] [GetPlayer.GetCustom('currency_symbol')])\n  не сведено клирингом [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_unsettled')|D+=] [GetPlayer.GetCustom('currency_symbol')]\n#b Чистая международная позиция [GetPlayer.MakeScope.ScriptValue('zz_ef_abroad_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!"
