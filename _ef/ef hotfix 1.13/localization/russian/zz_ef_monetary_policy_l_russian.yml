 zz_ef_mp_tt:0 "[GetLawType('law_devaluation').GetName] и [GetLawType('law_revaluation').GetName] — инструмент [concept_central_bank]. Мера — покрытие: металл и валюта в резервах по паритету к деньгам в обращении. При принятии закона цель = текущее покрытие; двигайте цель кнопками.\n\n[GetLawType('law_devaluation').GetName]: [concept_central_bank] печатает деньги в казну — государство их тратит, денег становится больше, покрытие падает к цели. Пока казна не потратила напечатанное, новые деньги не печатаются сверх нужного.\n[GetLawType('law_revaluation').GetName]: [concept_central_bank] изымает деньги из казны (нет казны — темп падает).\n\nЦель достигнута — паритет переписывается на текущий курс (новое металлическое содержание), закон снимается. Если покрытие уже по другую сторону цели — паритет переписывается сразу."
