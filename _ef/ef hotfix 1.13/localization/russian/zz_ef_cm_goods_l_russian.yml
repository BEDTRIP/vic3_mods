l_russian:

 # E&F Currency Merge: единый товар-валюта.
 #
 # ЭКСПЕРИМЕНТ: скобка спрашивает у владельца рынка название его валюты
 # через родной currency_name_mk из E&F. Если имя товара рисуется в
 # контексте рыночного товара, каждая страна получает своё название
 # обратно, не тратя престижный слот — а их всего три на базовый товар,
 # это измерено в игре.
 #
 # Если скобка окажется пустой или сырой — ответ отрицательный, убираем
 # её и оставляем простое имя. Упавшую функцию назовёт debug.log.
 spe_uni_c:0 "Валюта ([Goods.GetMarket.GetOwner.GetCustom('currency_name_mk')])"

 # Престижный вариант, который чеканит центробанк во владении компании.
 zz_ef_cm_national_currency:0 "Национальная валюта"
