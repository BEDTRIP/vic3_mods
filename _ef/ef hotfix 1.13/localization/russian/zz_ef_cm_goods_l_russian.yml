l_russian:

 # Общий товар-валюта — в него слит local_currency, отсюда имя и иконка.
 # Просто деньги; центробанк поднимает их до одного из трёх обеспеченных
 # вариантов ниже, а какого именно — решает закон денежной системы.

 spe_uni_c:0 "Местная валюта"

 zz_ef_cm_representative_currency:0 "Обеспеченная валюта"
 zz_ef_cm_pegged_currency:0 "Привязанная валюта"
 zz_ef_cm_fiat_currency:0 "Фиатная валюта"

 # Модификатор, который держит слот компании и оплачивает патент.
 zz_ef_cm_central_bank_charter:0 "Устав центрального банка"

 # Компания центробанка для стран без своего исторического банка.
 # Одна на всех: престижный товар выбирает закон денежного стандарта,
 # а не валюта, так что 95 отдельных типов не давали ничего.
 zz_ef_cm_central_bank:0 "Центральный банк"
