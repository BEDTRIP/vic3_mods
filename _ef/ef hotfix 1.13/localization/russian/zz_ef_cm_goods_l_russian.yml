l_russian:

 # Общий товар-валюта. Скобка спрашивает у владельца рынка название его
 # валюты через родной currency_name_mk из E&F — это эксперимент, и он
 # требует, чтобы мод стоял НИЖЕ русского перевода E&F, который тоже
 # определяет этот ключ. Написано как «Валюта (…)», чтобы при отсутствии
 # контекста осталось читаемое имя, а не сырой ключ.
 spe_uni_c:0 "Валюта ([Goods.GetMarket.GetOwner.GetCustom('currency_name_mk')])"

 # Три режимные валюты, которые чеканит центробанк во владении компании.
 zz_ef_cm_metallic_currency:0 "Металлический стандарт"
 zz_ef_cm_exchange_currency:0 "Обменные деньги"
 zz_ef_cm_fiat_currency:0 "Фиатные деньги"
