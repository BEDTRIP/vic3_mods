l_russian:

 # EF.30: ключевая ставка — показатели центробанка, подсказки кнопок, понятия
 # (gui/00_00_ef_cb_rate_panel.gui, common/scripted_guis/zz_ef_cb_rate_buttons.txt,
 # common/game_concepts/zz_ef_cb_rate_concepts.txt, common/static_modifiers/zz_ef_rate_private_construction.txt)
 # GENERATED by tools/regen_ef_cb_rate_loc.py -- do not edit by hand.

 concept_zz_ef_policy_rule_rate:0 "Ставка по правилу"
 concept_zz_ef_policy_rule_rate_desc:0 "[concept_zz_ef_policy_rule_rate] — ставка, которую [concept_central_bank] рассчитывает сам, по правилу: нейтральная реальная ставка 2.5% + [concept_inflation_value] (потребительские товары, за год) + премия за риск от [concept_country_rating] (0.6 п.п. за балл ниже 10, до 6 п.п.) + поправка на металлическое покрытие валюты (ниже 75% — +1 п.п., ниже 50% — +2, выше 125% — −0.5). Коридор: металлический стандарт — 2–12%, фиатный или без денежной системы — 0.5–25%. Страна без центрального банка — 6.5%.\n\nФактическая [concept_base_rate_percentage] идёт к ставке по правилу с [concept_zz_ef_discretionary_adjustment] правительства (до ±2 п.п.). Разница между ними показывает, насколько политика мягче или жёстче правила.\n\n«Правило или усмотрение» — классический спор [concept_monetary_policy]: правило делает ставку предсказуемой, усмотрение даёт свободу, но за неё платят доверием (Кидланд и Прескотт, 1977; правило Тейлора, 1993)."
 concept_zz_ef_discretionary_adjustment:0 "Дискреционная поправка"
 concept_zz_ef_discretionary_adjustment_desc:0 "[concept_zz_ef_discretionary_adjustment] — насколько правительство своим решением сдвинуло [concept_base_rate_percentage] от [concept_zz_ef_policy_rule_rate]: от −2 до +2 п.п., шагом 0.5 п.п., кнопками «−» и «+» в «Финансах». Центробанк ведёт ставку к правилу с этой поправкой и не отыгрывает её назад.\n\nНиже правила — дешевле кредит, быстрее растёт инвестиционный пул, больше частной стройки; выше правила — наоборот, экономика остывает."
 zz_ef_rate_box_rating:0 "Кредитный рейтинг"
 zz_ef_rate_box_rating_value:0 "[GetPlayer.GetCustom('country_credit_rating_texture')]\n[GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_note_value')|2]"
 zz_ef_rate_box_rating_tt:0 "[concept_country_rating]: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_note_value')|2]#! (обычно 0–10, институт центробанка поднимает выше).\n\nДо 10 баллов дают показатели экономики и государства (подробно — «Посмотреть кредитный рейтинг» выше), до +2.5 — институт центрального банка (0.5 за уровень). Взятые кредиты умножают рейтинг на 0.75, долгая война и большой госдолг снижают его ещё.\n\nРейтинг задаёт премию за риск в [concept_zz_ef_policy_rule_rate]: #v 0.6 п.п.#! за каждый балл ниже 10, до 6 п.п. Страна без центробанка держит 6.5%."
 zz_ef_rate_box_target:0 "Ставка по правилу"
 zz_ef_rate_box_target_value:0 "[GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_rating_target')|%2]"
 zz_ef_rate_box_target_value_up:0 "#N [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_rating_target')|%2]#!"
 zz_ef_rate_box_target_value_down:0 "#P [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_rating_target')|%2]#!"
 zz_ef_rate_box_target_tt:0 "[concept_zz_ef_policy_rule_rate]: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_rating_target')|%2]#!\n  нейтральная реальная ставка: [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rule_neutral_pp')|1] п.п.\n  [concept_inflation_value]: [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rule_inflation_pp')|+1] п.п.\n  премия за риск ([concept_country_rating] [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_note_value')|2]): [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rule_risk_pp')|+1] п.п.\n  металлическое покрытие: [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rule_cover_pp')|+1] п.п.\nВ коридоре стандарта: металл 2–12%, фиат 0.5–25%. Страна без центробанка — 6.5%. [concept_zz_ef_discretionary_adjustment] на неё не влияет.\n\nТекущая [concept_base_rate_percentage]: [GetPlayer.MakeScope.Var('base_rate_percentage').GetValue|%2]. Правило минус ставка: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rule_gap_pp')|2] п.п.#! #N Красным#! — ставка ниже правила (политика мягче), #P зелёным#! — выше (жёстче).\n\nЦентробанк ведёт ставку к правилу с поправкой: к #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_target')|%2]#!."
 zz_ef_rate_box_step:0 "Динамика"
 zz_ef_rate_box_step_value:0 "[GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_next_step_pp')|+2] п.п.\nчерез [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_months_to_step')|0] мес."
 zz_ef_rate_box_step_tt:0 "Раз в квартал [concept_central_bank] сдвигает [concept_base_rate_percentage] к [concept_zz_ef_policy_rule_rate] с [concept_zz_ef_discretionary_adjustment] (сейчас к #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_target')|%2]#!): не больше чем на #v 0.5 п.п.#!, или на #v 1 п.п.#!, если до цели больше 5 п.п.\n\nСледующий шаг: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_next_step_pp')|+2] п.п.#! через [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_months_to_step')|0] мес."
 zz_ef_rate_box_policy:0 "Дискреционная поправка"
 zz_ef_rate_box_policy_value:0 "[GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1] п.п."
 zz_ef_rate_box_policy_tt:0 "[concept_zz_ef_discretionary_adjustment]: #v [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1] п.п.#!\n\nКнопки «−» и «+» под ставкой: каждое нажатие сразу сдвигает ставку на 0.5 п.п., и центробанк не отыгрывает её назад. Всего не больше ±2 п.п. [concept_zz_ef_policy_rule_rate] от поправки не меняется."
 zz_ef_rate_tt_increase_desc:0 "#b Повысить ключевую ставку#!\n[concept_base_rate_percentage] сразу вырастет на 0.5 п.п.: [concept_zz_ef_discretionary_adjustment] станет на 0.5 п.п. выше, и центробанк не будет возвращать ставку к правилу. Поправка сейчас: [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1] п.п. из допустимых ±2."
 zz_ef_rate_tt_reduce_desc:0 "#b Снизить ключевую ставку#!\n[concept_base_rate_percentage] сразу снизится на 0.5 п.п.: [concept_zz_ef_discretionary_adjustment] станет на 0.5 п.п. ниже, и центробанк не будет возвращать ставку к правилу. Поправка сейчас: [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1] п.п. из допустимых ±2."
 zz_ef_rate_tt_effect_up:0 "Ключевая ставка: #P +0.5 п.п.#!, дискреционная поправка: +0.5 п.п."
 zz_ef_rate_tt_effect_down:0 "Ключевая ставка: #P −0.5 п.п.#!, дискреционная поправка: −0.5 п.п."
 zz_ef_rate_tt_conditions:0 "\n\n#b Условия и действие:#!\n"
 zz_ef_rate_tt_below_max:0 "Ключевая ставка ниже потолка коридора (12% при металле, 25% при фиате)"
 zz_ef_rate_tt_above_min:0 "Ключевая ставка выше 0.5%"
 zz_ef_rate_tt_bias_up:0 "Дискреционная поправка ниже +2 п.п. (сейчас [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1])"
 zz_ef_rate_tt_bias_down:0 "Дискреционная поправка выше −2 п.п. (сейчас [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_rate_bias_pp')|+1])"
 zz_ef_rate_tt_no_devaluation:0 "Не действует закон «[GetLawType('law_devaluation').GetName]»"
 zz_ef_rate_tt_no_revaluation:0 "Не действует закон «[GetLawType('law_revaluation').GetName]»"
 zz_ef_rate_tt_no_fx_controls:0 "Нет модификатора «[GetStaticModifier('foreign_exchange_controls').GetName]»"
 zz_ef_rate_private_construction:0 "Ключевая ставка: частная стройка"
 zz_ef_rate_private_construction_desc:0 "[concept_base_rate_percentage] ниже 6.5% увеличивает долю очков строительства частного сектора, выше — уменьшает: 5 п.п. доли за каждый процент ставки, не больше ±30."
 zz_ef_business_cash:0 "Денежная масса: касса предприятий"
 zz_ef_business_cash_desc:0 "Устаревший: потолок кассы зданий теперь в базовых значениях страны. Снимается сам в начале месяца."
