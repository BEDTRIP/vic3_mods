  speculative_share_12_button_tt: "$speculative_share_12_button$\n\n$speculative_share_12_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_12_button_tt_1$\n\nEffect:\n$speculative_share_12_button_tt_effect_1_1$"
  zz_pb_ef_stimulus_off_tt: "#N Switched off:#! under the central bank's rate (EF.30) the cut is walked back; the buttons will be reworked (STR.4)."
