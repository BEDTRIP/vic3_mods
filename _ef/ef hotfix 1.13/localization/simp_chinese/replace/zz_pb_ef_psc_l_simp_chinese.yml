# pb+ef: hand-authored strings for the E&F + PSC compatch.
#
# LIVES IN replace/ (2026-09-24). Localization is first-come: the first file
# that defines a key wins, whatever the mod order, and E&F (or the V4 RUS
# translation, which overrides E&F by identical file names) defines these
# keys first. Files under localization/<lang>/replace/ override existing keys
# -- the mechanism Morgenroete uses on vanilla strings. Before the move this
# file was dead weight.
#
# Everything here needs human wording, so it is NOT regenerated by
# tools/regen_ef_psc_copies.py -- that script only does the mechanical
# building_ef_private_construction -> building_construction_sector rename and
# it deliberately skips these keys.
#
# concept_*_desc            : our own concepts, E&F has no text for them.
# financial_center_je_2_reason : empty -- the journal sections explain
#                             themselves (EF.18 v2, zz_pb_ef_fso_widgets.gui).
# speculative_share_*_tt_2  : reworded for the compatch's cap check. E&F asks
#                             "is there room for one more sector"; the effect
#                             builds 5/10/15/20 at once, so pb+ef checks
#                             pcs_construction_sector_headroom_by_base_rate
#                             instead (zz_pb_ef_remap_pcs_values.txt).
#
# NOTE: the level readout must call ScriptValue('building_ef_private_construction_lvl').
# That is E&F's key name, remapped by the compatch to sum building_construction_sector.
# An earlier build used 'building_construction_sector_lvl' in the Russian file --
# no such script_value exists, so the number rendered empty.

l_simp_chinese:
  concept_building_urban_center_lvl_by_base_rate_desc:1 "The maximum level of [GetBuildingType('building_construction_sector').GetName] is the total level of [GetBuildingType('building_urban_center').GetName] in the country × (1 − 5 × [concept_base_rate_percentage]). At a rate of 1% it is 95% of the urban centres, at 6% — 70%, at 12% — 40%, at 20% or more — zero."
  concept_maximum_pcs_capacity_desc:0 "[concept_maximum_pcs_capacity]: the theoretical maximum level of [GetBuildingType('building_construction_sector').GetName] the national economy can sustain — the total level of [GetBuildingType('building_urban_center').GetName] × (1 − 5 × [concept_base_rate_percentage]).\n\n A low base rate lets more [GetBuildingType('building_construction_sector').GetName] work; a high one shrinks the capacity.\n\n If the actual level exceeds it, the country has overcapacity: the overcapacity index moves towards its target (1 − limit / sectors) and cuts the construction sectors' throughput."

  # Empty: each journal section explains itself (gui/scripted_widgets/zz_pb_ef_fso_widgets.gui).
  financial_center_je_2_reason:0 ""
  # STR.4 (2026-10-03): stimulus buttons 9-12 change the sector limit factor -- tools/regen_ef_stimulus_buttons.py
  speculative_share_9_button_desc: "The government stimulates private construction: for #b 36 months#! the limit of construction sectors depends less on the base rate -- urban centres × (1 − #b 4#! × rate) instead of × (1 − 5 × rate). The extra private sectors overload the economy: the overbuilt economy penalty rises by #b 10#! points and then returns to its target. Pressing again while a stimulus runs replaces it."
  speculative_share_9_button_tt_1: "Overbuilt economy penalty below #b 90#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_9_button_tt_effect_1: "The rate factor in the construction sector limit is #b 4#! instead of 5 for #b 36 months#!."
  speculative_share_9_button_tt_effect_1_1: "- $speculative_share_9_button_tt_effect_1$\n- Overbuilt economy penalty #r +10#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months"
  speculative_share_9_button_tt: "$speculative_share_9_button$\n\n$speculative_share_9_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_9_button_tt_1$\n\nEffect:\n$speculative_share_9_button_tt_effect_1_1$"
  speculative_share_10_button_desc: "The government stimulates private construction: for #b 36 months#! the limit of construction sectors depends less on the base rate -- urban centres × (1 − #b 3.5#! × rate) instead of × (1 − 5 × rate). The extra private sectors overload the economy: the overbuilt economy penalty rises by #b 20#! points and then returns to its target. Pressing again while a stimulus runs replaces it."
  speculative_share_10_button_tt_1: "Overbuilt economy penalty below #b 80#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_10_button_tt_effect_1: "The rate factor in the construction sector limit is #b 3.5#! instead of 5 for #b 36 months#!."
  speculative_share_10_button_tt_effect_1_1: "- $speculative_share_10_button_tt_effect_1$\n- Overbuilt economy penalty #r +20#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months"
  speculative_share_10_button_tt: "$speculative_share_10_button$\n\n$speculative_share_10_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_10_button_tt_1$\n\nEffect:\n$speculative_share_10_button_tt_effect_1_1$"
  speculative_share_11_button_desc: "The government stimulates private construction: for #b 36 months#! the limit of construction sectors depends less on the base rate -- urban centres × (1 − #b 3#! × rate) instead of × (1 − 5 × rate). The extra private sectors overload the economy: the overbuilt economy penalty rises by #b 30#! points and then returns to its target. Pressing again while a stimulus runs replaces it."
  speculative_share_11_button_tt_1: "Overbuilt economy penalty below #b 70#! (current: #b [GetPlayer.MakeScope.Var('speculative_share_2').GetValue|0]#!)"
  speculative_share_11_button_tt_effect_1: "The rate factor in the construction sector limit is #b 3#! instead of 5 for #b 36 months#!."
  speculative_share_11_button_tt_effect_1_1: "- $speculative_share_11_button_tt_effect_1$\n- Overbuilt economy penalty #r +30#! (at most 100)\n- [GetPlayer.GetName] gets [GetStaticModifier('speculative_share_modifier_5').GetName|v] for 12 months"
  speculative_share_11_button_tt: "$speculative_share_11_button$\n\n$speculative_share_11_button_desc$\n\nPossible:\n- Not has [GetStaticModifier('speculative_share_modifier_5').GetName|v] modifier\n- [GetStaticModifier('has_financial_center').GetName|v] modifier\n- $speculative_share_11_button_tt_1$\n\nEffect:\n$speculative_share_11_button_tt_effect_1_1$"
  speculative_share_12_button_desc: "The government stimulates private construction: for #b 36 months#! the limit of construction sectors depends less on the base rate -- urban centres × (1 − #b 2.5#! × rate) instead of × (1 − 5 × rate). The extra private sectors overload the economy: the overbuilt economy penalty rises by #b 40#! points and then returns to its target. Pressing again while a stimulus runs replaces it."
