 zz_ef_ms_tt_savings:0 "#b Pop savings this month: [Country.MakeScope.ScriptValue('zz_ef_v_d_savings')|D+=][Country.GetCustom('currency_symbol')]#!\n1 Treasury\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_treasury_out')|D] [Country.GetCustom('currency_symbol')]#!\n2 Business cash\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_buildings_out')|D] [Country.GetCustom('currency_symbol')]#!\n3 Bank funds\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_banks_out')|D] [Country.GetCustom('currency_symbol')]#!\n4 Central bank reserves\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_cb_out')|D] [Country.GetCustom('currency_symbol')]#!\n5 outside: currency demand / cut above 2 × GDP, other\n  -> : #P +[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_in')|D] [Country.GetCustom('currency_symbol')]#!\n  <- : #N −[Country.MakeScope.ScriptValue('zz_ef_lg_savings_ext_out')|D] [Country.GetCustom('currency_symbol')]#!\n\nCash held by pops. Taxes and spending on goods are an estimate: GDP / 12 − pool contributions, the taxes' share — budget income without minting. Wages and dividends are not visible to scripts — they are in businesses' other.\nPops' outlays per month: [Country.MakeScope.ScriptValue('zz_ef_v_f_outlays')|D] [Country.GetCustom('currency_symbol')] = GDP / 12 [Country.MakeScope.ScriptValue('zz_ef_gdp_month')|D] [Country.GetCustom('currency_symbol')] − pool contributions [Country.MakeScope.ScriptValue('zz_ef_pool_contrib_month_gdp')|D] [Country.GetCustom('cu