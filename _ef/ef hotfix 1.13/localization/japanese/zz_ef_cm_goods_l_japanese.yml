l_japanese:

 # The shared currency good -- local_currency was merged into it, and this is
 # its name and icon. Plain money; a central bank raises it to one of the
 # three standard-backed variants below, picked by the monetary system law.

 spe_uni_c:0 "Local Currency"

 zz_ef_cm_representative_currency:0 "Representative Currency"
 zz_ef_cm_pegged_currency:0 "Pegged Currency"
 zz_ef_cm_fiat_currency:0 "Fiat Currency"

 # The modifier that holds the company slot and pays for the patent.
 zz_ef_cm_central_bank_charter:0 "Central Bank Charter"

 # The central bank company, for countries with no historical bank of
 # their own. One for all of them: the prestige good is chosen by the
 # monetary standard law, not by the currency, so ninety-five separate
 # types selected nothing.
 zz_ef_cm_central_bank:0 "Central Bank"
