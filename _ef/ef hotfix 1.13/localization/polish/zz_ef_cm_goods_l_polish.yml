l_polish:

 # liquidity_currency itself: the plain/default appearance (icon in
 # common/goods/zz_ef_cm_liquidity_currency_market.txt), used by minor
 # countries with no monetary system. Overrides E&F's own "Base Money".
 # The three prestige variants below and the central bank company/modifier
 # that mint them are for countries WITH a monetary system.

 liquidity_currency:0 "Local Currency"

 zz_ef_cm_representative_currency:0 "Representative Currency"
 zz_ef_cm_pegged_currency:0 "Pegged Currency"
 zz_ef_cm_fiat_currency:0 "Fiat Currency"

 # The modifier that holds the company slot and pays for the patent.
 zz_ef_cm_central_bank_charter:0 "Central Bank Charter"

 # The central bank company, for countries with no historical bank of
 # their own. One for all of them: the prestige good is chosen by the
 # monetary standard law, not by the currency, so ninety-five separate
 # types selected nothing.
 # EF.16 (2026-09-24) reverted: a company name has no COUNTRY context
 # (debug.log: "Data error in loc string 'zz_ef_cm_central_bank'").
 zz_ef_cm_central_bank:0 "Central Bank"

 # EF.15: central bank bond output follows debt as % of GDP (modifier on the bank).
 zz_ef_cb_bond_issuance_low:0 "Bond Issuance: Debt Below Reference"
 zz_ef_cb_bond_issuance_high:0 "Bond Issuance: Debt Above Reference"

 # EF.14: E&F has this key in english only.
 pm_currency_liquidity_currency:0 "National Currency Production"

 # Modifier type of the minor-country currency grant (modifier_type_definitions/zz_ef_liquidity_currency_sell_orders.txt).
 state_sell_orders_liquidity_currency_add:0 "State Sell Orders: Local Currency"
