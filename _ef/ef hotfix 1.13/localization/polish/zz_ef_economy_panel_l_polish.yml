l_polish:
 zz_ef_ep_current_account:0 "Current account, a week"
 zz_ef_ep_current_account_tt:0 "The week's net flow with abroad — the same number as the 'net' line of the 'Abroad' card in the money supply tooltip: budget lines with abroad, the market's trade balance, dividends from abroad, foreign bonds bought. The CB settles it through the world clearing at the next weekly step: an outflow in metal (the share by trust in the currency) and our currency, an inflow in the payers' metal and currencies."
 zz_ef_ep_trade_tt:0 "The market's trade balance this week: exports − imports of all goods at the market's prices (engine money)."
 zz_ef_ep_week_market_prices:0 "a week, at the market's prices"
 zz_ef_ep_cbfx_units:0 "Units"
 zz_ef_ep_cbfx_money:0 "In our money"
 zz_ef_ep_cbfx_gold:0 "In gold (a week)"
 zz_ef_ep_holders_title:0 "Who holds our currency"
 zz_ef_ep_bank_holders_title:0 "Which banks hold our currency"
 zz_ef_ep_bop:0 "#b Balance of payments this week#!\n#P Received / ours: +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_in_total')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_exp')|D] [GetPlayer.GetCustom('currency_symbol')]#! goods exports (market prices)\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_div_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! dividends from abroad (estimate)\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_int_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! bond interest\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_sec_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! budget lines with abroad\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_fin_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! other countries' bonds sold / repaid\n  #P +[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_oth_in')|D] [GetPlayer.GetCustom('currency_symbol')]#! other\n#N Paid out / we owe: −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_out_total')|D] [GetPlayer.GetCustom('currency_symbol')]#!\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_imp')|D] [GetPlayer.GetCustom('currency_symbol')]#! goods imports (market prices)\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_div_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! dividends abroad (estimate)\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_int_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! bond interest\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_sec_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! budget lines with abroad\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_fin_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! other countries' bonds bought\n  #N −[GetPlayer.MakeScope.ScriptValue('zz_ef_bop_oth_out')|D] [GetPlayer.GetCustom('currency_symbol')]#! other\n#b Balance [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_ext_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!\nWhat it moves: balance → the world clearing → CB reserves [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_reserves_money')|D+=] [GetPlayer.GetCustom('currency_symbol')] (metal [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_metal_money')|D+=], currency [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_fx_money')|D+=]) → cover [GetPlayer.MakeScope.ScriptValue('zz_ef_cb_cover')|%0] → the rate (strength to the reference [GetPlayer.MakeScope.ScriptValue('zz_ef_currency_strength')|2])\n  not settled by the clearing [GetPlayer.MakeScope.ScriptValue('zz_ef_v_f_clr_unsettled')|D+=] [GetPlayer.GetCustom('currency_symbol')] — payments without settlement\n#b Net international position [GetPlayer.MakeScope.ScriptValue('zz_ef_abroad_net')|D+=] [GetPlayer.GetCustom('currency_symbol')]#!"
